# ---- GPUQueue ------------------------------------------------------------------------------------

[classes.GPUQueue.methods.copy_external_image_to_texture]
diff = 'REMOVE'

[classes.GPUQueue.methods.read_buffer]
returns.type = 'GPUBuffer'
doc = '''
Takes the data contents of the buffer and return them as a memoryview.

This copies the data in the given buffer to a temporary buffer
and then maps that buffer to read the data. The given buffer's
usage must include COPY_SRC.

Also see `GPUBuffer._sync()` and `GPUBuffer._async()`.
'''

args.buffer.doc = 'The `GPUBuffer` object to read from.'
args.buffer.type = 'GPUBuffer'
args.buffer.default = ''

args.buffer_offset.doc = 'The offset in the buffer to start reading from.'
args.buffer_offset.type = 'int'
args.buffer_offset.default = '0'

args.size.doc = 'The number of bytes to read. Default all minus offset.'
args.size.type = 'int | None'
args.size.default = 'None'

[classes.GPUQueue.methods.read_texture]
returns.type = 'GPUTexture'
doc = '''
Takes the data contents and schedules a write operation of
these contents to the destination texture in the queue. A
snapshot of the data is taken; any changes to the data after
this function is called do not affect the texture contents.

Unlike `GPUCommandEncoder.copyBufferToTexture()`, there is
no alignment requirement on `bytes_per_row`.
'''

args.destination.doc = "A dict with fields: 'texture' (a texture object), 'origin' (a 3-tuple), 'mip_level' (an int, default 0)."
args.destination.type = 'structs.TexelCopyTextureInfoStruct'
args.destination.default = ''

args.data.doc = '''
The data to write to the texture.
Must be an object that supports the buffer protocol,
e.g. bytes, memoryview, numpy array, etc. Must be contiguous.
'''
args.data.type = 'ArrayLike'
args.data.default = ''

args.data_layout.doc = "A dict with fields: 'offset' (an int, default 0), 'bytes_per_row' (an int), 'rows_per_image' (an int, default 0)."
args.data_layout.type = 'structs.TexelCopyBufferLayoutStruct'
args.data_layout.default = ''

args.size.doc = 'A 3-tuple of ints specifying the size to write.'
args.size.type = 'tuple[int, int, int]'
args.size.default = ''

