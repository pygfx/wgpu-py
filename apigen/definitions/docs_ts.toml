GPU.methods.get_preferred_canvas_format.doc = '''
Returns an optimal {@link GPUTextureFormat} for displaying 8-bit depth, standard dynamic range
content on this system. Must only return {@link GPUTextureFormat} `"rgba8unorm"` or
{@link GPUTextureFormat} `"bgra8unorm"`.
The returned value can be passed as the {@link GPUCanvasConfiguration#format} to
{@link GPUCanvasContext#configure} calls on a {@link GPUCanvasContext} to ensure the associated
canvas is able to display its contents efficiently.
Note: Canvases which are not displayed to the screen may or may not benefit from using this
format.
'''
GPU.methods.request_adapter.args.options.doc = 'Criteria used to select the adapter.'
GPU.methods.request_adapter.doc = '''
Requests an adapter from the user agent.
The user agent chooses whether to return an adapter, and, if so,
chooses according to the provided options.
'''

GPUAdapter.methods.features.doc = 'The set of values in `this`.{@link GPUAdapter#[[adapter]]}.{@link adapter#[[features]]}.'
GPUAdapter.methods.info.doc = '''
Information about the physical adapter underlying this {@link GPUAdapter}.
For a given {@link GPUAdapter}, the {@link GPUAdapterInfo} values exposed are constant over time.
The same object is returned each time. To create that object for the first time:
<div algorithm=GPUAdapter.info>
<div data-timeline=content>
**Called on:** {@link GPUAdapter} `this`.
**Returns:** {@link GPUAdapterInfo}
Content timeline steps:
1. Return a [$new adapter info$] for `this.adapter`.
</div>
</div>
'''
GPUAdapter.methods.limits.doc = 'The limits in `this`.{@link GPUAdapter#[[adapter]]}.{@link adapter#[[limits]]}.'
GPUAdapter.methods.request_device.args.descriptor.doc = 'Description of the {@link GPUDevice} to request.'
GPUAdapter.methods.request_device.doc = '''
Requests a device from the adapter.
This is a one-time action: if a device is returned successfully,
the adapter becomes {@link adapter#[[state]]#"consumed"}.
'''

GPUAdapterInfo.methods.architecture.doc = '''
The name of the family or class of GPUs the adapter belongs to, if available. Empty
string otherwise.
'''
GPUAdapterInfo.methods.description.doc = '''
A human readable string describing the adapter as reported by the driver, if available.
Empty string otherwise.
Note: Because no formatting is applied to {@link GPUAdapterInfo#description} attempting to parse
this value is not recommended. Applications which change their behavior based on the
{@link GPUAdapterInfo}, such as applying workarounds for known driver issues, should rely on the
other fields when possible.
'''
GPUAdapterInfo.methods.device.doc = '''
A vendor-specific identifier for the adapter, if available. Empty string otherwise.
Note: This is a value that represents the type of adapter. For example, it may be a
[PCI device ID](https://pcisig.com/). It does not uniquely identify a given piece of
hardware like a serial number.
'''
GPUAdapterInfo.methods.is_fallback_adapter.doc = 'Whether the adapter is a fallback adapter.'
GPUAdapterInfo.methods.subgroup_max_size.doc = '''
If the "subgroups" feature is supported, the maximum supported subgroup size for the
adapter.

Check support before using. (Use the non-null assertion operator `!` where needed.)
'''
GPUAdapterInfo.methods.subgroup_min_size.doc = '''
If the "subgroups" feature is supported, the minimum supported subgroup size for the
adapter.

Check support before using. (Use the non-null assertion operator `!` where needed.)
'''
GPUAdapterInfo.methods.vendor.doc = 'The name of the vendor of the adapter, if available. Empty string otherwise.'

