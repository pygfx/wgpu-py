RenderPipelineDescriptor.fields.fragment.doc = '''
Describes the fragment shader entry point of the pipeline and its output colors. If
not map/exist|provided, the {@link https://www.w3.org/TR/webgpu/#no-color-output} mode is enabled.
'''
RenderPipelineDescriptor.fields.multisample.doc = 'Describes the multi-sampling properties of the pipeline.'
RenderPipelineDescriptor.fields.primitive.doc = 'Describes the primitive-related properties of the pipeline.'
RenderPipelineDescriptor.fields.vertex.doc = 'Describes the vertex shader entry point of the pipeline and its input buffer layouts.'

RequestAdapterOptions.fields.feature_level.doc = '''
Requests an adapter that supports at least a particular set of capabilities.
This influences the {@link adapter#[[default feature level]]} of devices created
from this adapter. The capabilities for each level are defined below, and the exact
steps are defined in {@link GPU#requestAdapter} and "a new device".
If the implementation or system does not support all of the capabilities in the
requested feature level, {@link GPU#requestAdapter} will return `null`.
Note:
Applications should typically make a single {@link GPU#requestAdapter} call with the lowest
feature level they support, then inspect the adapter for additional capabilities they can
use optionally, and request those in {@link GPUAdapter#requestDevice}.
The allowed <dfn dfn for="">feature level string</dfn> values are:
<dl dfn-type=dfn dfn-for="feature level string">
: <dfn noexport>"core"</dfn>
The following set of capabilities:
- The limit/Default limits.
- {@link GPUFeatureName} `"core-features-and-limits"`.
Note:
Adapters with this {@link adapter#[[default feature level]]} may
conventionally be referred to as "Core-defaulting".
: <dfn noexport>"compatibility"</dfn>
The following set of capabilities:
- The limit/Compatibility Mode Default limits.
- No features. (It excludes the {@link GPUFeatureName} `"core-features-and-limits"` feature.)
If the implementation cannot enforce the stricter "Compatibility Mode"
validation rules, {@link GPU#requestAdapter} will ignore this request and
treat it as a request for feature level string/"core".
Note:
Adapters with this {@link adapter#[[default feature level]]} may
conventionally be referred to as "Compatibility-defaulting".
'''
RequestAdapterOptions.fields.force_fallback_adapter.doc = '''
When set to `true` indicates that only a fallback adapter may be returned. If the user
agent does not support a fallback adapter, will cause {@link GPU#requestAdapter} to
resolve to `null`.
Note:
{@link GPU#requestAdapter} may still return a fallback adapter if
{@link GPURequestAdapterOptions#forceFallbackAdapter} is set to `false` and either no
other appropriate adapter is available or the user agent chooses to return a
fallback adapter. Developers that wish to prevent their applications from running on
fallback adapters should check the {@link GPUAdapter#info}.{@link GPUAdapterInfo#isFallbackAdapter}
attribute prior to requesting a {@link GPUDevice}.
'''
RequestAdapterOptions.fields.power_preference.doc = '''
Optionally provides a hint indicating what class of adapter should be selected from
the system's available adapters.
The value of this hint may influence which adapter is chosen, but it must not
influence whether an adapter is returned or not.
Note:
The primary utility of this hint is to influence which GPU is used in a multi-GPU system.
For instance, some laptops have a low-power integrated GPU and a high-performance
discrete GPU. This hint may also affect the power configuration of the selected GPU to
match the requested power preference.
Note:
Depending on the exact hardware configuration, such as battery status and attached displays
or removable GPUs, the user agent may select different adapters given the same power
preference.
Typically, given the same hardware configuration and state and
`powerPreference`, the user agent is likely to select the same adapter.
'''

SamplerBindingLayout.fields.type.doc = 'Indicates the required type of a sampler bound to this bindings.'

SamplerDescriptor.fields.address_mode_w.doc = '''
Specifies the {@link GPUAddressMode | address modes} for the texture width, height, and depth
coordinates, respectively.
'''
SamplerDescriptor.fields.compare.doc = '''
When provided the sampler will be a comparison sampler with the specified
{@link GPUCompareFunction}.
Note: Comparison samplers may use filtering, but the sampling results will be
implementation-dependent and may differ from the normal filtering rules.
'''
SamplerDescriptor.fields.lod_max_clamp.doc = '''
Specifies the minimum and maximum levels of detail, respectively, used internally when
sampling a texture.
'''
SamplerDescriptor.fields.mag_filter.doc = '''
Specifies the sampling behavior when the sampled area is smaller than or equal to one
texel.
'''
SamplerDescriptor.fields.max_anisotropy.doc = '''
Specifies the maximum anisotropy value clamp used by the sampler. Anisotropic filtering is
enabled when {@link GPUSamplerDescriptor#maxAnisotropy} is &gt; 1 and the implementation supports it.
Anisotropic filtering improves the image quality of textures sampled at oblique viewing
angles. Higher {@link GPUSamplerDescriptor#maxAnisotropy} values indicate the maximum ratio of
anisotropy supported when filtering.
<div class=note heading>
Most implementations support {@link GPUSamplerDescriptor#maxAnisotropy} values in range
between 1 and 16, inclusive. The used value of {@link GPUSamplerDescriptor#maxAnisotropy}
will be clamped to the maximum value that the platform supports.
The precise filtering behavior is implementation-dependent.
</div>
'''
SamplerDescriptor.fields.min_filter.doc = 'Specifies the sampling behavior when the sampled area is larger than one texel.'
SamplerDescriptor.fields.mipmap_filter.doc = 'Specifies behavior for sampling between mipmap levels.'

ShaderModuleCompilationHint.fields.layout.doc = '''
A {@link GPUPipelineLayout} that the {@link GPUShaderModule} may be used with in a future
{@link GPUDevice#createComputePipeline()} or {@link GPUDevice#createRenderPipeline} call.
If set to {@link GPUAutoLayoutMode} `"auto"` the layout will be the [$default pipeline layout$]
for the entry point associated with this hint will be used.
'''

ShaderModuleDescriptor.fields.code.doc = '''
The <a href="https://gpuweb.github.io/gpuweb/wgsl/">WGSL</a> source code for the shader
module.
'''
ShaderModuleDescriptor.fields.compilation_hints.doc = '''
A list of {@link GPUShaderModuleCompilationHint}s.
Any hint provided by an application **should** contain information about one entry point of
a pipeline that will eventually be created from the entry point.
Implementations **should** use any information present in the {@link GPUShaderModuleCompilationHint}
to perform as much compilation as is possible within {@link GPUDevice#createShaderModule}.
Aside from type-checking, these hints are not validated in any way.
<div class=note heading>
Supplying information in {@link GPUShaderModuleDescriptor#compilationHints} does not have any
observable effect, other than performance. It may be detrimental to performance to
provide hints for pipelines that never end up being created.
Because a single shader module can hold multiple entry points, and multiple pipelines
can be created from a single shader module, it can be more performant for an
implementation to do as much compilation as possible once in
{@link GPUDevice#createShaderModule} rather than multiple times in the multiple calls to
{@link GPUDevice#createComputePipeline()} or {@link GPUDevice#createRenderPipeline}.
Hints are only applied to the entry points they explicitly name.
Unlike {@link GPUProgrammableStage#entryPoint | GPUProgrammableStage.entryPoint},
there is no default, even if only one entry point is present in the module.
</div>
Note:
Hints are not validated in an observable way, but user agents **may** surface identifiable
errors (like unknown entry point names or incompatible pipeline layouts) to developers,
for example in the browser developer console.
'''

StencilFaceState.fields.compare.doc = '''
The {@link GPUCompareFunction} used when testing the RenderState.`[[stencilReference]]` value
against the fragment's {@link GPURenderPassDescriptor#depthStencilAttachment} stencil values.
'''
StencilFaceState.fields.depth_fail_op.doc = '''
The {@link GPUStencilOperation} performed if the fragment depth comparison described by
{@link GPUDepthStencilState#depthCompare} fails.
'''
StencilFaceState.fields.fail_op.doc = '''
The {@link GPUStencilOperation} performed if the fragment stencil comparison test described by
{@link GPUStencilFaceState#compare} fails.
'''
StencilFaceState.fields.pass_op.doc = '''
The {@link GPUStencilOperation} performed if the fragment stencil comparison test described by
{@link GPUStencilFaceState#compare} passes.
'''

StorageTextureBindingLayout.fields.access.doc = 'The access mode for this binding, indicating readability and writability.'
StorageTextureBindingLayout.fields.format.doc = 'The required {@link GPUTextureViewDescriptor#format} of texture views bound to this binding.'
StorageTextureBindingLayout.fields.view_dimension.doc = '''
Indicates the required {@link GPUTextureViewDescriptor#dimension} for texture views bound to
this binding.
'''

TexelCopyBufferInfo.fields.buffer.doc = '''
A buffer which either contains texel data to be copied or will store the texel data being
copied, depending on the method it is being passed to.
'''

TexelCopyBufferLayout.fields.bytes_per_row.doc = '''
The stride, in bytes, between the beginning of each texel block row and the subsequent
texel block row.
Required if there are multiple texel block rows (i.e. the copy height or depth is more
than one block).
'''
TexelCopyBufferLayout.fields.offset.doc = '''
The offset, in bytes, from the beginning of the texel data source (such as a
{@link GPUTexelCopyBufferInfo#buffer | GPUTexelCopyBufferInfo.buffer}) to the start of the texel data
within that source.
'''
TexelCopyBufferLayout.fields.rows_per_image.doc = '''
Number of texel block rows per single texel image of the texture.
{@link GPUTexelCopyBufferLayout#rowsPerImage} &times;
{@link GPUTexelCopyBufferLayout#bytesPerRow} is the stride, in bytes, between the beginning of each
texel image of data and the subsequent texel image.
Required if there are multiple texel images (i.e. the copy depth is more than one).
'''

TexelCopyTextureInfo.fields.aspect.doc = 'Defines which aspects of the {@link GPUTexelCopyTextureInfo#texture} to copy to/from.'
TexelCopyTextureInfo.fields.mip_level.doc = 'Mip-map level of the {@link GPUTexelCopyTextureInfo#texture} to copy to/from.'
TexelCopyTextureInfo.fields.origin.doc = '''
Defines the origin of the copy - the minimum corner of the texture sub-region to copy to/from.
Together with `copySize`, defines the full copy sub-region.
'''
TexelCopyTextureInfo.fields.texture.doc = 'Texture to copy to/from.'

TextureBindingLayout.fields.multisampled.doc = 'Indicates whether or not texture views bound to this binding must be multisampled.'
TextureBindingLayout.fields.sample_type.doc = 'Indicates the type required for texture views bound to this binding.'
TextureBindingLayout.fields.view_dimension.doc = '''
Indicates the required {@link GPUTextureViewDescriptor#dimension} for texture views bound to
