'''
fields.load.doc = 'Keep the existing contents of the attachment.'
fields.load.value = 'load'

fields.clear.doc = 'Clear the attachment to the clear value (e.g. the clear_value field of structs.RenderPassColorAttachment). Clearing is preferred over load when the old contents are not needed; it can be faster, especially on tiled GPUs.'
fields.clear.value = 'clear'

[enums.StoreOp]
doc = '''
What happens to the contents of an attachment at the end of a render pass.

Used in the store_op fields of structs.RenderPassColorAttachment and structs.RenderPassDepthStencilAttachment.
'''
fields.store.doc = 'Store the results of the render pass in the attachment.'
fields.store.value = 'store'

fields.discard.doc = 'Discard the results; the contents of the attachment become undefined (zero-initialized when next used).'
fields.discard.value = 'discard'

[enums.QueryType]
doc = '''
The type of queries in a GPUQuerySet.

Used in the type field of structs.QuerySetDescriptor.
'''
fields.occlusion.doc = 'Occlusion queries count the number of samples that pass the depth and stencil tests, see GPURenderPassEncoder.begin_occlusion_query().'
fields.occlusion.value = 'occlusion'

fields.timestamp.doc = 'Timestamp queries record GPU timestamps. Requires enums.FeatureName.timestamp_query.'
fields.timestamp.value = 'timestamp'

[enums.CanvasAlphaMode]
doc = '''
How the alpha channel of a canvas texture is interpreted when compositing with the page or window.

Used in the alpha_mode field of structs.CanvasConfiguration.
'''
fields.opaque.doc = 'The alpha channel is ignored and the canvas is treated as fully opaque.'
fields.opaque.value = 'opaque'

fields.premultiplied.doc = 'The color channels are expected to be premultiplied by the alpha channel.'
fields.premultiplied.value = 'premultiplied'

[enums.CanvasToneMappingMode]
doc = '''
How the content of a canvas is tone mapped when displayed.

Used in the mode field of structs.CanvasToneMapping.
'''
fields.standard.doc = 'Color values are clamped to the standard dynamic range (SDR) of the display.'
fields.standard.value = 'standard'

fields.extended.doc = 'Color values may exceed the SDR range, up to the dynamic range of the display (HDR).'
fields.extended.value = 'extended'

[enums.DeviceLostReason]
doc = '''
The reason a GPUDevice was lost.

Available via the reason property of GPUDeviceLostInfo.
'''
fields.unknown.doc = 'The device was lost for a reason other than being destroyed, e.g. a driver crash or hardware removal.'
fields.unknown.value = 'unknown'

fields.destroyed.doc = 'The device was lost because GPUDevice.destroy() was called.'
fields.destroyed.value = 'destroyed'

[enums.ErrorFilter]
doc = '''
The type of error that is captured by an error scope.

Used in the filter argument of the GPUDevice.push_error_scope() method.
'''
fields.validation.doc = 'Captures GPUValidationError errors, which signal incorrect API usage.'
fields.validation.value = 'validation'

fields.out_of_memory.doc = 'Captures GPUOutOfMemoryError errors, which signal that there was not enough memory for an operation.'
fields.out_of_memory.value = 'out-of-memory'

fields.internal.doc = 'Captures GPUInternalError errors, which signal failures not caused by incorrect usage (e.g. implementation limits).'
fields.internal.value = 'internal'

# ==== structs =====================================================================================
# ==================================================================================================

[structs.RequestAdapterOptions]
doc = '''
Options for requesting an adapter.

Used as the options argument of the GPU.request_adapter() method.
'''
fields.feature_level.doc = "The feature level to request: 'core' (default) or 'compatibility'. Core implies the default limits and enums.FeatureName.core_features_and_limits; compatibility has stricter, more widely supported defaults and no features. If the implementation cannot enforce the compatibility rules it treats the request as core. If the level is not supported, no adapter is returned."
fields.feature_level.type = 'str'
fields.feature_level.default = '"core"'

fields.power_preference.doc = 'Hint for the kind of adapter to select, see enums.PowerPreference. It may influence which adapter is chosen (mainly in multi-GPU systems), but never whether an adapter is returned.'
fields.power_preference.type = 'enums.PowerPreference | None'
fields.power_preference.default = 'None'

fields.force_fallback_adapter.doc = 'If true, only a fallback adapter may be returned (no adapter if unsupported). If false, a fallback adapter may still be returned; check the is_fallback_adapter property of GPUAdapterInfo to avoid it.'
fields.force_fallback_adapter.type = 'bool'
fields.force_fallback_adapter.default = 'False'

fields.canvas.type = 'CanvasLike | None'
fields.canvas.default = 'None'

[structs.DeviceDescriptor]
doc = '''
Descriptor for requesting a device.

Used as the descriptor argument of the GPUAdapter.request_device() method.
'''
fields.label.doc = 'A human-readable label for the device, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.required_features.doc = 'A list of enums.FeatureName that the device must support. The request fails if the adapter cannot provide them. Exactly this set of features, no more and no less, is allowed on the resulting device.'
fields.required_features.type = 'Sequence[enums.FeatureNameEnum]'
fields.required_features.default = '()'

fields.required_limits.doc = 'A mapping of limit names to the values the device requires; the request fails if the adapter cannot provide them. Unspecified limits get their default value. Validation on the device uses these exact limits, not the (possibly higher) limits of the adapter.'
fields.required_limits.type = 'dict[str, int | None] | None'
fields.required_limits.default = 'None'

fields.default_queue.doc = 'A structs.QueueDescriptor with options for the default queue of the device.'
fields.default_queue.type = 'structs.QueueDescriptorStruct | None'
fields.default_queue.default = 'None'

[structs.BufferDescriptor]
doc = '''
Descriptor for creating a GPUBuffer.

Used as the descriptor argument of the GPUDevice.create_buffer() method.
'''
fields.label.doc = 'A human-readable label for the buffer, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.size.doc = 'The size of the buffer in bytes.'
fields.size.type = 'int'
fields.size.default = ''

fields.usage.doc = 'The allowed usages of the buffer, a combination of flags.BufferUsage.'
fields.usage.type = 'flags.BufferUsageFlags'
fields.usage.default = ''

fields.mapped_at_creation.doc = 'If true, the buffer is created in a mapped state so GPUBuffer.get_mapped_range() can be called immediately, which is useful to set initial data. This is allowed even without flags.BufferUsage.MAP_READ or flags.BufferUsage.MAP_WRITE. The size must then be a multiple of 4.'
fields.mapped_at_creation.type = 'bool'
fields.mapped_at_creation.default = 'False'

[structs.TextureDescriptor]
doc = '''
Descriptor for creating a GPUTexture.

Used as the descriptor argument of the GPUDevice.create_texture() method.
'''
fields.label.doc = 'A human-readable label for the texture, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.size.doc = 'The size of the texture as a structs.Extent3D, or a tuple of (width, height, depth_or_array_layers). Height and depth default to 1.'
fields.size.type = 'tuple[int, int, int] | structs.Extent3DStruct'
fields.size.default = ''

fields.mip_level_count.doc = 'The number of mip levels. Defaults to 1.'
fields.mip_level_count.type = 'int'
fields.mip_level_count.default = '1'

fields.sample_count.doc = 'The number of samples per pixel, for multisampled textures. Must be 1 or 4. Defaults to 1.'
fields.sample_count.type = 'int'
fields.sample_count.default = '1'

fields.dimension.doc = 'The dimensionality of the texture, see enums.TextureDimension. Defaults to d2.'
fields.dimension.type = 'enums.TextureDimensionEnum'
fields.dimension.default = '"2d"'

fields.format.doc = 'The pixel format of the texture, see enums.TextureFormat.'
fields.format.type = 'enums.TextureFormatEnum'
fields.format.default = ''

fields.usage.doc = 'The allowed usages of the texture, a combination of flags.TextureUsage.'
fields.usage.type = 'flags.TextureUsageFlags'
fields.usage.default = ''

fields.view_formats.doc = 'Additional enums.TextureFormat values that views of this texture may use in GPUTexture.create_view(). They must be view-compatible with the texture format: equal, or (on devices with enums.FeatureName.core_features_and_limits) differing only in sRGB-ness. Adding formats can hurt performance on some systems, so only add what is needed.'
fields.view_formats.type = 'Sequence[enums.TextureFormatEnum]'
fields.view_formats.default = '()'

fields.texture_binding_view_dimension.doc = 'Compatibility mode only: on devices without enums.FeatureName.core_features_and_limits, views of this texture must have this enums.TextureViewDimension. A default is chosen if omitted. Ignored on core devices.'
fields.texture_binding_view_dimension.type = 'enums.TextureViewDimensionEnum | None'
fields.texture_binding_view_dimension.default = 'None'

[structs.TextureViewDescriptor]
doc = '''
Descriptor for creating a GPUTextureView.

Used as the descriptor argument of the GPUTexture.create_view() method. Unspecified fields
get a default derived from the texture, so by default the view covers the whole texture.
'''
fields.label.doc = 'A human-readable label for the texture view, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.format.doc = 'The format of the view, see enums.TextureFormat. Must be the texture format or one of its view_formats. Defaults to the texture format.'
fields.format.type = 'enums.TextureFormatEnum | None'
fields.format.default = 'None'

fields.dimension.doc = 'The dimensionality of the view, see enums.TextureViewDimension. Defaults to a dimension matching the texture.'
fields.dimension.type = 'enums.TextureViewDimensionEnum | None'
fields.dimension.default = 'None'

fields.usage.doc = 'The usages the view will be used for, a subset of the usage of the texture (see flags.TextureUsage). If 0 or omitted, defaults to all usages of the texture; this fails if the view format does not support all of them, in which case set it explicitly.'
fields.usage.type = 'flags.TextureUsageFlags'
fields.usage.default = '0'

fields.aspect.doc = 'Which aspect of the texture the view refers to, see enums.TextureAspect. Defaults to all.'
fields.aspect.type = 'enums.TextureAspectEnum'
fields.aspect.default = '"all"'

fields.base_mip_level.doc = 'The first mip level accessible via the view. Defaults to 0.'
fields.base_mip_level.type = 'int'
fields.base_mip_level.default = '0'

fields.mip_level_count.doc = 'The number of mip levels accessible via the view. Defaults to all levels from base_mip_level.'
fields.mip_level_count.type = 'int | None'
fields.mip_level_count.default = 'None'

fields.base_array_layer.doc = 'The first array layer accessible via the view. Defaults to 0.'
fields.base_array_layer.type = 'int'
fields.base_array_layer.default = '0'

fields.array_layer_count.doc = 'The number of array layers accessible via the view. Defaults to all layers from base_array_layer.'
fields.array_layer_count.type = 'int | None'
fields.array_layer_count.default = 'None'

fields.swizzle.doc = "A string of four characters (default 'rgba') that defines how the components of the view are mapped, e.g. 'bgra'. Allowed characters are r, g, b, a, 0 and 1. Requires enums.FeatureName.texture_component_swizzle."
fields.swizzle.type = 'str'
fields.swizzle.default = '"rgba"'

[structs.ExternalTextureDescriptor]
doc = '''
Descriptor for importing an external texture, such as a video frame.

Used as the descriptor argument of the GPUDevice.import_external_texture() method.
'''
fields.label.doc = 'A human-readable label for the external texture, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.source.doc = 'The source of the image data, e.g. a video element or video frame. Only meaningful in browser environments.'
fields.source.type = 'ArrayLike | object'
fields.source.default = ''

fields.color_space.doc = "The color space of the source image, e.g. 'srgb'. Defaults to 'srgb'."
fields.color_space.type = 'str'
fields.color_space.default = '"srgb"'

[structs.SamplerDescriptor]
doc = '''
Descriptor for creating a GPUSampler.

Used as the descriptor argument of the GPUDevice.create_sampler() method.
'''
fields.label.doc = 'A human-readable label for the sampler, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.address_mode_u.doc = 'How to handle texture coordinates outside 0..1 along the u (x) axis, see enums.AddressMode. Defaults to clamp_to_edge.'
fields.address_mode_u.type = 'enums.AddressModeEnum'
fields.address_mode_u.default = '"clamp-to-edge"'

fields.address_mode_v.doc = 'How to handle texture coordinates outside 0..1 along the v (y) axis, see enums.AddressMode. Defaults to clamp_to_edge.'
fields.address_mode_v.type = 'enums.AddressModeEnum'
fields.address_mode_v.default = '"clamp-to-edge"'

fields.address_mode_w.doc = 'How to handle texture coordinates outside 0..1 along the w (z) axis, see enums.AddressMode. Defaults to clamp_to_edge.'
fields.address_mode_w.type = 'enums.AddressModeEnum'
fields.address_mode_w.default = '"clamp-to-edge"'

fields.mag_filter.doc = 'The filter used when the sampled area is smaller than or equal to one texel (magnification), see enums.FilterMode. Defaults to nearest.'
fields.mag_filter.type = 'enums.FilterModeEnum'
fields.mag_filter.default = '"nearest"'

fields.min_filter.doc = 'The filter used when the sampled area is larger than one texel (minification), see enums.FilterMode. Defaults to nearest.'
fields.min_filter.type = 'enums.FilterModeEnum'
fields.min_filter.default = '"nearest"'

fields.mipmap_filter.doc = 'How to filter between mip levels, see enums.MipmapFilterMode. Defaults to nearest.'
fields.mipmap_filter.type = 'enums.MipmapFilterModeEnum'
fields.mipmap_filter.default = '"nearest"'

fields.lod_min_clamp.doc = 'The minimum level of detail used when sampling. Defaults to 0.'
fields.lod_min_clamp.type = 'float'
fields.lod_min_clamp.default = '0'

fields.lod_max_clamp.doc = 'The maximum level of detail used when sampling. Defaults to 32.'
fields.lod_max_clamp.type = 'float'
fields.lod_max_clamp.default = '32'

fields.compare.doc = 'If set, makes this a comparison sampler using this enums.CompareFunction. Used for sampling depth textures. Filtering results of comparison samplers are implementation-dependent.'
fields.compare.type = 'enums.CompareFunctionEnum | None'
fields.compare.default = 'None'

fields.max_anisotropy.doc = 'The maximum anisotropy for anisotropic filtering: 1 (default) disables it. Values above 1 require all filters to be linear. The value is clamped to the platform maximum (typically 16).'
fields.max_anisotropy.type = 'int'
fields.max_anisotropy.default = '1'

[structs.BindGroupLayoutDescriptor]
doc = '''
Descriptor for creating a GPUBindGroupLayout.

Used as the descriptor argument of the GPUDevice.create_bind_group_layout() method.
'''
fields.label.doc = 'A human-readable label for the bind group layout, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.entries.doc = 'A list of structs.BindGroupLayoutEntry describing the resources in the bind group.'
fields.entries.type = 'Sequence[structs.BindGroupLayoutEntryStruct]'
fields.entries.default = ''

[structs.BindGroupLayoutEntry]
doc = '''
Describes a single binding in a bind group layout.

Exactly one of buffer, sampler, texture, storage_texture and external_texture must be set,
which determines the type of resource that is bound.
'''
fields.binding.doc = 'The binding number, matching the @binding attribute in the shader.'
fields.binding.type = 'int'
fields.binding.default = ''

fields.visibility.doc = 'The shader stages in which the resource is visible, a combination of flags.ShaderStage.'
fields.visibility.type = 'flags.ShaderStageFlags'
fields.visibility.default = ''

fields.buffer.doc = 'If set, a structs.BufferBindingLayout: the entry is a buffer binding.'
fields.buffer.type = 'structs.BufferBindingLayoutStruct | None'
fields.buffer.default = 'None'

fields.sampler.doc = 'If set, a structs.SamplerBindingLayout: the entry is a sampler binding.'
fields.sampler.type = 'structs.SamplerBindingLayoutStruct | None'
fields.sampler.default = 'None'

fields.texture.doc = 'If set, a structs.TextureBindingLayout: the entry is a sampled texture binding.'
fields.texture.type = 'structs.TextureBindingLayoutStruct | None'
fields.texture.default = 'None'

fields.storage_texture.doc = 'If set, a structs.StorageTextureBindingLayout: the entry is a storage texture binding.'
fields.storage_texture.type = 'structs.StorageTextureBindingLayoutStruct | None'
fields.storage_texture.default = 'None'

[structs.BufferBindingLayout]
doc = '''
Describes the layout of a buffer binding.

Used in the buffer field of structs.BindGroupLayoutEntry.
'''
fields.type.doc = 'The type of buffer binding, see enums.BufferBindingType. Defaults to uniform.'
fields.type.type = 'enums.BufferBindingTypeEnum'
fields.type.default = '"uniform"'

fields.has_dynamic_offset.doc = 'If true, an offset can be given in GPUBindingCommandsMixin.set_bind_group() when binding. Defaults to false.'
fields.has_dynamic_offset.type = 'bool'
fields.has_dynamic_offset.default = 'False'

fields.min_binding_size.doc = 'The minimum size in bytes of a buffer bound to this entry; bindings are always validated against it in GPUDevice.create_bind_group(). If non-zero, pipeline creation also checks it against the minimum binding size of the shader variable. If 0 (default), that check is skipped at pipeline creation and done at draw/dispatch time instead.'
fields.min_binding_size.type = 'int'
fields.min_binding_size.default = '0'

[structs.SamplerBindingLayout]
doc = '''
Describes the layout of a sampler binding.

Used in the sampler field of structs.BindGroupLayoutEntry.
'''
fields.type.doc = 'The type of sampler binding, see enums.SamplerBindingType. Defaults to filtering.'
fields.type.type = 'enums.SamplerBindingTypeEnum'
fields.type.default = '"filtering"'

[structs.TextureBindingLayout]
doc = '''
Describes the layout of a sampled texture binding.

Used in the texture field of structs.BindGroupLayoutEntry.
'''
fields.sample_type.doc = 'The type of values returned when sampling, see enums.TextureSampleType. Defaults to float.'
fields.sample_type.type = 'enums.TextureSampleTypeEnum'
fields.sample_type.default = '"float"'

fields.view_dimension.doc = 'The dimension of texture views that can be bound, see enums.TextureViewDimension. Defaults to d2.'
fields.view_dimension.type = 'enums.TextureViewDimensionEnum'
fields.view_dimension.default = '"2d"'

fields.multisampled.doc = 'If true, the bound texture must be multisampled. Defaults to false.'
fields.multisampled.type = 'bool'
fields.multisampled.default = 'False'

[structs.StorageTextureBindingLayout]
doc = '''
Describes the layout of a storage texture binding.

Used in the storage_texture field of structs.BindGroupLayoutEntry.
'''
fields.access.doc = 'How the shader can access the texture, see enums.StorageTextureAccess. Defaults to write_only.'
fields.access.type = 'enums.StorageTextureAccessEnum'
fields.access.default = '"write-only"'

fields.format.doc = 'The enums.TextureFormat that the bound texture view must have.'
fields.format.type = 'enums.TextureFormatEnum'
fields.format.default = ''

fields.view_dimension.doc = 'The dimension of texture views that can be bound, see enums.TextureViewDimension. Defaults to d2.'
fields.view_dimension.type = 'enums.TextureViewDimensionEnum'
fields.view_dimension.default = '"2d"'

[structs.BindGroupDescriptor]
doc = '''
Descriptor for creating a GPUBindGroup.

Used as the descriptor argument of the GPUDevice.create_bind_group() method.
'''
fields.label.doc = 'A human-readable label for the bind group, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.layout.doc = 'The GPUBindGroupLayout that this bind group conforms to.'
fields.layout.type = 'GPUBindGroupLayout'
fields.layout.default = ''

fields.entries.doc = 'A list of structs.BindGroupEntry with the resources to bind. Must match the layout.'
fields.entries.type = 'Sequence[structs.BindGroupEntryStruct]'
fields.entries.default = ''

[structs.BindGroupEntry]
doc = '''
A single resource binding in a bind group.

Used in the entries field of structs.BindGroupDescriptor.
'''
fields.binding.doc = 'The binding number, matching the binding field of the corresponding structs.BindGroupLayoutEntry.'
fields.binding.type = 'int'
fields.binding.default = ''

fields.resource.doc = 'The resource to bind: a GPUSampler, GPUTexture (as its default view), GPUTextureView, GPUBuffer (the whole buffer), structs.BufferBinding, or GPUExternalTexture. Must match the type in the corresponding layout entry.'
fields.resource.type = 'GPUBuffer | GPUSampler | GPUTexture | GPUTextureView | object | structs.BufferBindingStruct'
fields.resource.default = ''

[structs.BufferBinding]
doc = '''
Describes a range of a GPUBuffer to bind.

Can be used as the resource field of structs.BindGroupEntry.
'''
fields.buffer.doc = 'The GPUBuffer to bind.'
fields.buffer.type = 'GPUBuffer'
fields.buffer.default = ''

fields.offset.doc = 'The offset in bytes into the buffer where the binding starts. Defaults to 0.'
fields.offset.type = 'int'
fields.offset.default = '0'

fields.size.doc = 'The size in bytes of the binding. Defaults to the remainder of the buffer after offset.'
fields.size.type = 'int | None'
fields.size.default = 'None'

[structs.PipelineLayoutDescriptor]
doc = '''
Descriptor for creating a GPUPipelineLayout.

Used as the descriptor argument of the GPUDevice.create_pipeline_layout() method.
'''
fields.label.doc = 'A human-readable label for the pipeline layout, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.bind_group_layouts.doc = 'A list of GPUBindGroupLayout (or None for unused groups) used by the pipeline. The Nth element corresponds to @group(N) in the shader.'
fields.bind_group_layouts.type = 'Sequence[GPUBindGroupLayout]'
fields.bind_group_layouts.default = ''

fields.immediate_size.doc = 'The size in bytes of the immediate data (small data set with GPUBindingCommandsMixin.set_immediates()). Defaults to 0.'
fields.immediate_size.type = 'int'
fields.immediate_size.default = '0'

[structs.ShaderModuleDescriptor]
doc = '''
Descriptor for creating a GPUShaderModule.

Used as the descriptor argument of the GPUDevice.create_shader_module() method.
'''
fields.label.doc = 'A human-readable label for the shader module, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.code.doc = 'The shader source code, in WGSL.'
fields.code.type = 'str'
fields.code.default = ''

fields.compilation_hints.doc = 'An optional list of structs.ShaderModuleCompilationHint that may help the implementation compile early. Hints only affect performance, are not validated, and only apply to the entry points they name (there is no default entry point).'
fields.compilation_hints.type = 'Sequence[structs.ShaderModuleCompilationHintStruct]'
fields.compilation_hints.default = '()'

[structs.ShaderModuleCompilationHint]
doc = '''
A hint for the compilation of a shader module.

Used in the compilation_hints field of structs.ShaderModuleDescriptor. These are optional and only
affect performance, not behavior.
'''
fields.entry_point.doc = 'The name of the shader entry point that the hint applies to.'
fields.entry_point.type = 'str'
fields.entry_point.default = ''

fields.layout.doc = 'The GPUPipelineLayout that the entry point will be used with, or enums.AutoLayoutMode.auto (the default pipeline layout for that entry point).'
fields.layout.type = 'GPUPipelineLayout | enums.AutoLayoutModeEnum | None'
fields.layout.default = 'None'

[structs.PipelineErrorInit]
doc = '''
Initialization options for a GPUPipelineError.

Used as the options argument of the GPUPipelineError constructor.
'''
fields.reason.doc = 'The reason for the error, see enums.PipelineErrorReason.'
fields.reason.type = 'enums.PipelineErrorReasonEnum'
fields.reason.default = ''

[structs.ProgrammableStage]
doc = '''
Describes a programmable (shader) stage of a pipeline.

This is the base for structs.VertexState, structs.FragmentState and the compute field of
structs.ComputePipelineDescriptor.
'''
fields.module.doc = 'The GPUShaderModule containing the shader code.'
fields.module.type = 'GPUShaderModule'
fields.module.default = ''

fields.entry_point.doc = 'The name of the entry point function in the shader. Optional if the module has only one entry point for this stage.'
fields.entry_point.type = 'str | None'
fields.entry_point.default = 'None'

fields.constants.doc = 'A mapping of the identifiers of pipeline-overridable constants in the shader to the values to use. A key is the numeric id (if the shader declares one) or the name of the constant. Values are converted to the WGSL type of the constant; a failed conversion is a validation error.'
fields.constants.type = 'dict[str, float] | None'
fields.constants.default = 'None'

[structs.ComputePipelineDescriptor]
doc = '''
Descriptor for creating a GPUComputePipeline.

Used as the descriptor argument of the GPUDevice.create_compute_pipeline() method.
'''
fields.label.doc = 'A human-readable label for the pipeline, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.layout.doc = 'The GPUPipelineLayout for the pipeline, or enums.AutoLayoutMode.auto to derive it from the shader(s). With auto, the pipeline cannot share bind groups with other pipelines.'
fields.layout.type = 'GPUPipelineLayout | enums.AutoLayoutModeEnum'
fields.layout.default = ''

fields.compute.doc = 'A structs.ProgrammableStage describing the compute shader.'
fields.compute.type = 'structs.ProgrammableStageStruct'
fields.compute.default = ''

[structs.RenderPipelineDescriptor]
doc = '''
Descriptor for creating a GPURenderPipeline.

Used as the descriptor argument of the GPUDevice.create_render_pipeline() method.
'''
fields.label.doc = 'A human-readable label for the pipeline, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.layout.doc = 'The GPUPipelineLayout for the pipeline, or enums.AutoLayoutMode.auto to derive it from the shader(s). With auto, the pipeline cannot share bind groups with other pipelines.'
fields.layout.type = 'GPUPipelineLayout | enums.AutoLayoutModeEnum'
fields.layout.default = ''

fields.vertex.doc = 'A structs.VertexState describing the vertex shader and vertex buffers.'
fields.vertex.type = 'structs.VertexStateStruct'
fields.vertex.default = ''

fields.primitive.doc = 'A structs.PrimitiveState describing how primitives are assembled and rasterized.'
fields.primitive.type = 'structs.PrimitiveStateStruct | None'
fields.primitive.default = 'None'

fields.depth_stencil.doc = 'An optional structs.DepthStencilState. If omitted, the pipeline does not use a depth-stencil attachment.'
fields.depth_stencil.type = 'structs.DepthStencilStateStruct | None'
fields.depth_stencil.default = 'None'

fields.multisample.doc = 'A structs.MultisampleState describing multisampling.'
fields.multisample.type = 'structs.MultisampleStateStruct | None'
fields.multisample.default = 'None'

fields.fragment.doc = 'An optional structs.FragmentState describing the fragment shader and render targets. If omitted, the pipeline has no color output (e.g. for depth-only passes).'
fields.fragment.type = 'structs.FragmentStateStruct | None'
fields.fragment.default = 'None'

[structs.PrimitiveState]
doc = '''
Describes how a render pipeline assembles and rasterizes primitives.

Used in the primitive field of structs.RenderPipelineDescriptor.
'''
fields.topology.doc = 'How vertices are assembled into primitives, see enums.PrimitiveTopology. Defaults to triangle_list.'
fields.topology.type = 'enums.PrimitiveTopologyEnum'
fields.topology.default = '"triangle-list"'

fields.strip_index_format.doc = 'The enums.IndexFormat of the index buffer, which sets the primitive restart value (0xFFFF for uint16, 0xFFFFFFFF for uint32). Only allowed for strip topologies, where it is required for indexed draws and must match the format given to GPURenderCommandsMixin.set_index_buffer().'
fields.strip_index_format.type = 'enums.IndexFormatEnum | None'
fields.strip_index_format.default = 'None'

fields.front_face.doc = 'Which winding order is front-facing, see enums.FrontFace. Defaults to ccw.'
fields.front_face.type = 'enums.FrontFaceEnum'
fields.front_face.default = '"ccw"'

fields.cull_mode.doc = 'Which faces to cull, see enums.CullMode. Defaults to none.'
fields.cull_mode.type = 'enums.CullModeEnum'
fields.cull_mode.default = '"none"'

fields.unclipped_depth.doc = 'If true, primitives are not clipped by the near and far planes. Requires enums.FeatureName.depth_clip_control.'
fields.unclipped_depth.type = 'bool'
fields.unclipped_depth.default = 'False'

[structs.MultisampleState]
doc = '''
Describes the multisampling of a render pipeline.

Used in the multisample field of structs.RenderPipelineDescriptor.
'''
fields.count.doc = 'The number of samples per pixel. Must be 1 or 4. The pipeline is only compatible with attachments that have a matching sample count. Defaults to 1.'
fields.count.type = 'int'
fields.count.default = '1'

fields.mask.doc = 'A bitmask that determines which samples are written to. Defaults to 0xFFFFFFFF.'
fields.mask.type = 'int'
fields.mask.default = '0xFFFFFFFF'

fields.alpha_to_coverage_enabled.doc = 'If true, the alpha output of the fragment shader is used to generate a coverage mask. Defaults to false.'
fields.alpha_to_coverage_enabled.type = 'bool'
fields.alpha_to_coverage_enabled.default = 'False'

[structs.FragmentState]
doc = '''
Describes the fragment shader stage and render targets of a render pipeline.

Used in the fragment field of structs.RenderPipelineDescriptor. Extends structs.ProgrammableStage.
'''
fields.module.doc = 'The GPUShaderModule containing the fragment shader code.'
fields.module.type = 'GPUShaderModule'
fields.module.default = ''

fields.entry_point.doc = 'The name of the fragment entry point in the shader. Optional if the module has only one fragment entry point.'
fields.entry_point.type = 'str | None'
fields.entry_point.default = 'None'

fields.constants.doc = 'A mapping of the identifiers of pipeline-overridable constants in the shader to the values to use. A key is the numeric id (if the shader declares one) or the name of the constant. Values are converted to the WGSL type of the constant; a failed conversion is a validation error.'
fields.constants.type = 'dict[str, float] | None'
fields.constants.default = 'None'

fields.targets.doc = 'A list of structs.ColorTargetState (or None for unused slots), one for each color attachment.'
fields.targets.type = 'Sequence[structs.ColorTargetStateStruct]'
fields.targets.default = ''

[structs.ColorTargetState]
doc = '''
Describes a color render target of a render pipeline.

Used in the targets field of structs.FragmentState.
'''
fields.format.doc = 'The enums.TextureFormat of this color target. The pipeline is only compatible with render passes that use a view of this format in the corresponding color attachment.'
fields.format.type = 'enums.TextureFormatEnum'
fields.format.default = ''

fields.blend.doc = 'An optional structs.BlendState. If omitted, blending is disabled and the fragment output replaces the target.'
fields.blend.type = 'structs.BlendStateStruct | None'
fields.blend.default = 'None'

fields.write_mask.doc = 'Which channels are written, a combination of flags.ColorWrite. Defaults to ALL.'
fields.write_mask.type = 'flags.ColorWriteFlags'
fields.write_mask.default = '0xF'

[structs.BlendState]
doc = '''
Describes how blending is performed for a color target.

Used in the blend field of structs.ColorTargetState.
'''
fields.color.doc = 'A structs.BlendComponent for the color (RGB) channels.'
fields.color.type = 'structs.BlendComponentStruct'
fields.color.default = ''

fields.alpha.doc = 'A structs.BlendComponent for the alpha channel.'
fields.alpha.type = 'structs.BlendComponentStruct'
fields.alpha.default = ''

[structs.BlendComponent]
doc = '''
Describes how the blending of a single component (color or alpha) is performed.

The result is: operation(src * src_factor, dst * dst_factor).
'''
fields.operation.doc = 'The enums.BlendOperation used to combine the scaled values. Defaults to add.'
fields.operation.type = 'enums.BlendOperationEnum'
fields.operation.default = '"add"'

fields.src_factor.doc = 'The enums.BlendFactor applied to the source (fragment shader output). Defaults to one.'
fields.src_factor.type = 'enums.BlendFactorEnum'
fields.src_factor.default = '"one"'

fields.dst_factor.doc = 'The enums.BlendFactor applied to the destination (existing target value). Defaults to zero.'
fields.dst_factor.type = 'enums.BlendFactorEnum'
fields.dst_factor.default = '"zero"'

[structs.DepthStencilState]
doc = '''
Describes the depth and stencil state of a render pipeline.

Used in the depth_stencil field of structs.RenderPipelineDescriptor.
'''
fields.format.doc = 'The enums.TextureFormat of the depth-stencil attachment that this pipeline is compatible with.'
fields.format.type = 'enums.TextureFormatEnum'
fields.format.default = ''

fields.depth_write_enabled.doc = 'If true, depth values of fragments that pass the depth test are written to the attachment.'
fields.depth_write_enabled.type = 'bool | None'
fields.depth_write_enabled.default = 'None'

fields.depth_compare.doc = 'The enums.CompareFunction used for the depth test.'
fields.depth_compare.type = 'enums.CompareFunctionEnum | None'
fields.depth_compare.default = 'None'

fields.stencil_front.doc = 'A structs.StencilFaceState for front-facing primitives.'
fields.stencil_front.type = 'structs.StencilFaceStateStruct | None'
fields.stencil_front.default = 'None'

fields.stencil_back.doc = 'A structs.StencilFaceState for back-facing primitives.'
fields.stencil_back.type = 'structs.StencilFaceStateStruct | None'
fields.stencil_back.default = 'None'

fields.stencil_read_mask.doc = 'Bitmask applied to the stencil values before comparison. Defaults to 0xFFFFFFFF.'
fields.stencil_read_mask.type = 'int'
fields.stencil_read_mask.default = '0xFFFFFFFF'

fields.stencil_write_mask.doc = 'Bitmask that determines which bits of the stencil buffer are written. Defaults to 0xFFFFFFFF.'
fields.stencil_write_mask.type = 'int'
fields.stencil_write_mask.default = '0xFFFFFFFF'

fields.depth_bias.doc = 'A constant depth value added to each fragment. Defaults to 0.'
fields.depth_bias.type = 'int'
fields.depth_bias.default = '0'

fields.depth_bias_slope_scale.doc = 'A depth bias that scales with the slope of the primitive. Defaults to 0.'
fields.depth_bias_slope_scale.type = 'float'
fields.depth_bias_slope_scale.default = '0'

fields.depth_bias_clamp.doc = 'The maximum (or minimum, if negative) depth bias of a fragment. Defaults to 0.'
fields.depth_bias_clamp.type = 'float'
fields.depth_bias_clamp.default = '0'

[structs.StencilFaceState]
doc = '''
Describes the stencil operations for one face (front or back) of primitives.

Used in the stencil_front and stencil_back fields of structs.DepthStencilState.
'''
fields.compare.doc = 'The enums.CompareFunction used to compare the stencil reference with the stencil value. Defaults to always.'
fields.compare.type = 'enums.CompareFunctionEnum'
fields.compare.default = '"always"'

fields.fail_op.doc = 'The enums.StencilOperation performed if the stencil test fails. Defaults to keep.'
fields.fail_op.type = 'enums.StencilOperationEnum'
fields.fail_op.default = '"keep"'

fields.depth_fail_op.doc = 'The enums.StencilOperation performed if the stencil test passes but the depth test fails. Defaults to keep.'
fields.depth_fail_op.type = 'enums.StencilOperationEnum'
fields.depth_fail_op.default = '"keep"'

fields.pass_op.doc = 'The enums.StencilOperation performed if both the stencil and depth tests pass. Defaults to keep.'
fields.pass_op.type = 'enums.StencilOperationEnum'
fields.pass_op.default = '"keep"'

[structs.VertexState]
doc = '''
Describes the vertex shader stage and vertex buffers of a render pipeline.

Used in the vertex field of structs.RenderPipelineDescriptor. Extends structs.ProgrammableStage.
'''
fields.module.doc = 'The GPUShaderModule containing the vertex shader code.'
fields.module.type = 'GPUShaderModule'
fields.module.default = ''

fields.entry_point.doc = 'The name of the vertex entry point in the shader. Optional if the module has only one vertex entry point.'
fields.entry_point.type = 'str | None'
fields.entry_point.default = 'None'

fields.constants.doc = 'A mapping of the identifiers of pipeline-overridable constants in the shader to the values to use. A key is the numeric id (if the shader declares one) or the name of the constant. Values are converted to the WGSL type of the constant; a failed conversion is a validation error.'
fields.constants.type = 'dict[str, float] | None'
fields.constants.default = 'None'

fields.buffers.doc = 'A list of structs.VertexBufferLayout (or None for unused slots) describing the vertex buffers.'
fields.buffers.type = 'Sequence[structs.VertexBufferLayoutStruct]'
fields.buffers.default = '()'

[structs.VertexBufferLayout]
doc = '''
Describes the layout of a vertex buffer.

Used in the buffers field of structs.VertexState.
'''
fields.array_stride.doc = 'The stride in bytes between consecutive elements in the buffer.'
fields.array_stride.type = 'int'
fields.array_stride.default = ''

fields.step_mode.doc = 'How often the buffer is advanced, see enums.VertexStepMode. Defaults to vertex.'
fields.step_mode.type = 'enums.VertexStepModeEnum'
fields.step_mode.default = '"vertex"'

fields.attributes.doc = 'A list of structs.VertexAttribute describing the attributes in each element.'
fields.attributes.type = 'Sequence[structs.VertexAttributeStruct]'
fields.attributes.default = ''

[structs.VertexAttribute]
doc = '''
Describes a single vertex attribute within a vertex buffer.

Used in the attributes field of structs.VertexBufferLayout.
'''
fields.format.doc = 'The enums.VertexFormat of the attribute.'
fields.format.type = 'enums.VertexFormatEnum'
fields.format.default = ''

fields.offset.doc = 'The offset in bytes of the attribute from the start of an element in the buffer.'
fields.offset.type = 'int'
fields.offset.default = ''

fields.shader_location.doc = 'The location number of the attribute in the vertex shader (the @location attribute).'
fields.shader_location.type = 'int'
fields.shader_location.default = ''

[structs.TexelCopyBufferLayout]
doc = '''
Describes the layout of texel data in a buffer or in a block of memory.

Used as the data_layout argument of the GPUQueue.write_texture() method. Also see structs.TexelCopyBufferInfo.
'''
fields.offset.doc = 'The offset in bytes into the data where the texel data starts. Defaults to 0.'
fields.offset.type = 'int'
fields.offset.default = '0'

fields.bytes_per_row.doc = 'The stride in bytes between the start of consecutive rows of texel blocks. Required if the copy has more than one row of texel blocks. Must be a multiple of 256 for buffer copies (not for GPUQueue.write_texture()).'
fields.bytes_per_row.type = 'int | None'
fields.bytes_per_row.default = 'None'

fields.rows_per_image.doc = 'The number of rows of texel blocks per image (layer or slice); times bytes_per_row it is the stride between images. Required if the copy has more than one image.'
fields.rows_per_image.type = 'int | None'
fields.rows_per_image.default = 'None'

[structs.TexelCopyBufferInfo]
doc = '''
Describes a buffer and the layout of texel data in it.

Used as source or destination in GPUCommandEncoder.copy_buffer_to_texture() and GPUCommandEncoder.copy_texture_to_buffer().
Extends structs.TexelCopyBufferLayout.
'''
fields.offset.doc = 'The offset in bytes into the buffer where the texel data starts. Defaults to 0.'
fields.offset.type = 'int'
fields.offset.default = '0'

fields.bytes_per_row.doc = 'The stride in bytes between the start of consecutive rows of texel blocks. Required if the copy has more than one row. Must be a multiple of 256.'
fields.bytes_per_row.type = 'int | None'
fields.bytes_per_row.default = 'None'

fields.rows_per_image.doc = 'The number of rows of texel blocks per image (layer or slice). Required if the copy has more than one image.'
fields.rows_per_image.type = 'int | None'
fields.rows_per_image.default = 'None'

fields.buffer.doc = 'The GPUBuffer that contains (or will contain) the texel data.'
fields.buffer.type = 'GPUBuffer'
fields.buffer.default = ''

[structs.TexelCopyTextureInfo]
doc = '''
Describes a texture and the part of it that is the source or destination of a copy.

Used in GPUCommandEncoder.copy_buffer_to_texture(), GPUCommandEncoder.copy_texture_to_buffer(),
GPUCommandEncoder.copy_texture_to_texture() and GPUQueue.write_texture().
'''
fields.texture.doc = 'The GPUTexture to copy to or from.'
fields.texture.type = 'GPUTexture'
fields.texture.default = ''

fields.mip_level.doc = 'The mip level to copy to or from. Defaults to 0.'
fields.mip_level.type = 'int'
fields.mip_level.default = '0'

fields.origin.doc = 'The origin of the copy in the texture, as a structs.Origin3D or a tuple (x, y, z). Defaults to (0, 0, 0).'
fields.origin.type = 'tuple[int, int, int] | structs.Origin3DStruct | None'
fields.origin.default = 'None'

fields.aspect.doc = 'Which aspect of the texture to copy, see enums.TextureAspect. Defaults to all.'
fields.aspect.type = 'enums.TextureAspectEnum'
fields.aspect.default = '"all"'

[structs.CommandBufferDescriptor]
doc = '''
Descriptor for a GPUCommandBuffer.

Used as the descriptor argument of the GPUCommandEncoder.finish() method.
'''
fields.label.doc = 'A human-readable label for the command buffer, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

[structs.CommandEncoderDescriptor]
doc = '''
Descriptor for creating a GPUCommandEncoder.

Used as the descriptor argument of the GPUDevice.create_command_encoder() method.
'''
fields.label.doc = 'A human-readable label for the command encoder, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

[structs.ComputePassTimestampWrites]
doc = '''
Describes where to write timestamps for a compute pass.

Used in the timestamp_writes field of structs.ComputePassDescriptor. Requires enums.FeatureName.timestamp_query.
'''
fields.query_set.doc = 'The GPUQuerySet (of type enums.QueryType.timestamp) to write the timestamps to.'
fields.query_set.type = 'GPUQuerySet'
fields.query_set.default = ''

fields.beginning_of_pass_write_index.doc = 'The index in the query set where the timestamp at the start of the pass is written. If omitted, no timestamp is written.'
fields.beginning_of_pass_write_index.type = 'int | None'
fields.beginning_of_pass_write_index.default = 'None'

fields.end_of_pass_write_index.doc = 'The index in the query set where the timestamp at the end of the pass is written. If omitted, no timestamp is written.'
fields.end_of_pass_write_index.type = 'int | None'
fields.end_of_pass_write_index.default = 'None'

[structs.ComputePassDescriptor]
doc = '''
Descriptor for beginning a compute pass.

Used as the descriptor argument of the GPUCommandEncoder.begin_compute_pass() method.
'''
fields.label.doc = 'A human-readable label for the compute pass, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.timestamp_writes.doc = 'An optional structs.ComputePassTimestampWrites for recording timestamps of the pass.'
fields.timestamp_writes.type = 'structs.ComputePassTimestampWritesStruct | None'
fields.timestamp_writes.default = 'None'

[structs.RenderPassTimestampWrites]
doc = '''
Describes where to write timestamps for a render pass.

Used in the timestamp_writes field of structs.RenderPassDescriptor. Requires enums.FeatureName.timestamp_query.
'''
fields.query_set.doc = 'The GPUQuerySet (of type enums.QueryType.timestamp) to write the timestamps to.'
fields.query_set.type = 'GPUQuerySet'
fields.query_set.default = ''

fields.beginning_of_pass_write_index.doc = 'The index in the query set where the timestamp at the start of the pass is written. If omitted, no timestamp is written.'
fields.beginning_of_pass_write_index.type = 'int | None'
fields.beginning_of_pass_write_index.default = 'None'

fields.end_of_pass_write_index.doc = 'The index in the query set where the timestamp at the end of the pass is written. If omitted, no timestamp is written.'
fields.end_of_pass_write_index.type = 'int | None'
fields.end_of_pass_write_index.default = 'None'

[structs.RenderPassDescriptor]
doc = '''
Descriptor for beginning a render pass.

Used as the descriptor argument of the GPUCommandEncoder.begin_render_pass() method.
'''
fields.label.doc = 'A human-readable label for the render pass, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.color_attachments.doc = 'A list of structs.RenderPassColorAttachment (or None for unused slots) that the pass renders to. Attachments may not alias each other or any resource used inside the pass.'
fields.color_attachments.type = 'Sequence[structs.RenderPassColorAttachmentStruct]'
fields.color_attachments.default = ''

fields.depth_stencil_attachment.doc = 'An optional structs.RenderPassDepthStencilAttachment for depth and stencil.'
fields.depth_stencil_attachment.type = 'structs.RenderPassDepthStencilAttachmentStruct | None'
fields.depth_stencil_attachment.default = 'None'

fields.occlusion_query_set.doc = 'An optional GPUQuerySet of type enums.QueryType.occlusion, to store occlusion query results in.'
fields.occlusion_query_set.type = 'GPUQuerySet | None'
fields.occlusion_query_set.default = 'None'

fields.timestamp_writes.doc = 'An optional structs.RenderPassTimestampWrites for recording timestamps of the pass.'
fields.timestamp_writes.type = 'structs.RenderPassTimestampWritesStruct | None'
fields.timestamp_writes.default = 'None'

fields.max_draw_count.doc = 'A hint for the maximum number of draw calls in the pass, used by some implementations to size internal work. The default is fine unless more draws are expected. Defaults to 50000000.'
fields.max_draw_count.type = 'int'
fields.max_draw_count.default = '50000000'

[structs.RenderPassColorAttachment]
doc = '''
Describes a color attachment of a render pass.

Used in the color_attachments field of structs.RenderPassDescriptor.
'''
fields.view.doc = 'The GPUTextureView to render to. Its texture must have flags.TextureUsage.RENDER_ATTACHMENT.'
fields.view.type = 'GPUTexture | GPUTextureView'
fields.view.default = ''

fields.depth_slice.doc = 'For 3D textures, the index of the depth slice to render to.'
fields.depth_slice.type = 'int | None'
fields.depth_slice.default = 'None'

fields.resolve_target.doc = 'An optional GPUTextureView to resolve the (multisampled) view into at the end of the pass.'
fields.resolve_target.type = 'GPUTexture | GPUTextureView | None'
fields.resolve_target.default = 'None'

fields.clear_value.doc = 'The color to clear the attachment to if load_op is clear, as a structs.Color or a tuple (r, g, b, a). Defaults to transparent black.'
fields.clear_value.type = 'tuple[float, float, float, float] | structs.ColorStruct | None'
fields.clear_value.default = 'None'

fields.load_op.doc = 'What to do with the existing contents at the start of the pass, see enums.LoadOp.'
fields.load_op.type = 'enums.LoadOpEnum'
fields.load_op.default = ''

fields.store_op.doc = 'What to do with the results at the end of the pass, see enums.StoreOp.'
fields.store_op.type = 'enums.StoreOpEnum'
fields.store_op.default = ''

[structs.RenderPassDepthStencilAttachment]
doc = '''
Describes the depth-stencil attachment of a render pass.

Used in the depth_stencil_attachment field of structs.RenderPassDescriptor.
'''
fields.view.doc = 'The GPUTextureView to use as depth-stencil attachment. Its texture must have flags.TextureUsage.RENDER_ATTACHMENT.'
fields.view.type = 'GPUTexture | GPUTextureView'
fields.view.default = ''

fields.depth_clear_value.doc = 'The value to clear the depth aspect to if depth_load_op is clear. Must be between 0 and 1.'
fields.depth_clear_value.type = 'float | None'
fields.depth_clear_value.default = 'None'

fields.depth_load_op.doc = 'What to do with the existing depth values at the start of the pass, see enums.LoadOp. Required unless depth_read_only is true.'
fields.depth_load_op.type = 'enums.LoadOpEnum | None'
fields.depth_load_op.default = 'None'

fields.depth_store_op.doc = 'What to do with the depth values at the end of the pass, see enums.StoreOp. Required unless depth_read_only is true.'
fields.depth_store_op.type = 'enums.StoreOpEnum | None'
fields.depth_store_op.default = 'None'

fields.depth_read_only.doc = 'If true, the depth aspect is read-only in the pass (it is not written to). Defaults to false.'
fields.depth_read_only.type = 'bool'
fields.depth_read_only.default = 'False'

fields.stencil_clear_value.doc = 'The value to clear the stencil aspect to if stencil_load_op is clear. Truncated to the bit size of the stencil aspect (the least significant bits are kept). Defaults to 0.'
fields.stencil_clear_value.type = 'int'
fields.stencil_clear_value.default = '0'

fields.stencil_load_op.doc = 'What to do with the existing stencil values at the start of the pass, see enums.LoadOp. Required unless stencil_read_only is true.'
fields.stencil_load_op.type = 'enums.LoadOpEnum | None'
fields.stencil_load_op.default = 'None'

fields.stencil_store_op.doc = 'What to do with the stencil values at the end of the pass, see enums.StoreOp. Required unless stencil_read_only is true.'
fields.stencil_store_op.type = 'enums.StoreOpEnum | None'
fields.stencil_store_op.default = 'None'

fields.stencil_read_only.doc = 'If true, the stencil aspect is read-only in the pass (it is not written to). Defaults to false.'
fields.stencil_read_only.type = 'bool'
fields.stencil_read_only.default = 'False'

[structs.RenderPassLayout]
doc = '''
Describes the attachment formats of a render pass or render bundle.

This is the base of structs.RenderBundleEncoderDescriptor. A render pipeline can only be used with
passes (or bundles) whose layout is compatible with the pipeline.
'''
fields.label.doc = 'A human-readable label, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.color_formats.doc = 'A list of enums.TextureFormat (or None for unused slots) of the color attachments.'
fields.color_formats.type = 'Sequence[enums.TextureFormatEnum]'
fields.color_formats.default = ''

fields.depth_stencil_format.doc = 'The enums.TextureFormat of the depth-stencil attachment, if any.'
fields.depth_stencil_format.type = 'enums.TextureFormatEnum | None'
fields.depth_stencil_format.default = 'None'

fields.sample_count.doc = 'The number of samples per pixel of the attachments. Defaults to 1.'
fields.sample_count.type = 'int'
fields.sample_count.default = '1'

[structs.RenderBundleDescriptor]
doc = '''
Descriptor for a GPURenderBundle.

Used as the descriptor argument of the GPURenderBundleEncoder.finish() method.
'''
fields.label.doc = 'A human-readable label for the render bundle, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

[structs.RenderBundleEncoderDescriptor]
doc = '''
Descriptor for creating a GPURenderBundleEncoder.

Used as the descriptor argument of the GPUDevice.create_render_bundle_encoder() method.
Extends structs.RenderPassLayout.
'''
fields.label.doc = 'A human-readable label for the render bundle encoder, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.color_formats.doc = 'A list of enums.TextureFormat (or None for unused slots) of the color attachments the bundle will be used with.'
fields.color_formats.type = 'Sequence[enums.TextureFormatEnum]'
fields.color_formats.default = ''

fields.depth_stencil_format.doc = 'The enums.TextureFormat of the depth-stencil attachment the bundle will be used with, if any.'
fields.depth_stencil_format.type = 'enums.TextureFormatEnum | None'
fields.depth_stencil_format.default = 'None'

fields.sample_count.doc = 'The number of samples per pixel of the attachments the bundle will be used with. Defaults to 1.'
fields.sample_count.type = 'int'
fields.sample_count.default = '1'

fields.depth_read_only.doc = 'If true, the bundle does not write to the depth aspect. Defaults to false.'
fields.depth_read_only.type = 'bool'
fields.depth_read_only.default = 'False'

fields.stencil_read_only.doc = 'If true, the bundle does not write to the stencil aspect. Defaults to false.'
fields.stencil_read_only.type = 'bool'
fields.stencil_read_only.default = 'False'

[structs.QueueDescriptor]
doc = '''
Descriptor for a GPUQueue.

Used in the default_queue field of structs.DeviceDescriptor.
'''
fields.label.doc = 'A human-readable label for the queue, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

[structs.QuerySetDescriptor]
doc = '''
Descriptor for creating a GPUQuerySet.

Used as the descriptor argument of the GPUDevice.create_query_set() method.
'''
fields.label.doc = 'A human-readable label for the query set, used in debugging and error messages.'
fields.label.type = 'str'
fields.label.default = '""'

fields.type.doc = 'The type of queries in the set, see enums.QueryType.'
fields.type.type = 'enums.QueryTypeEnum'
fields.type.default = ''

