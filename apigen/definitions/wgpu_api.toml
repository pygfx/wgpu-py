fields.bc6h_rgb_float.value = 'bc6h-rgb-float'

fields.bc7_rgba_unorm.doc = 'BC7 compressed RGBA, unsigned normalized. Requires enums.FeatureName.texture_compression_bc.'
fields.bc7_rgba_unorm.value = 'bc7-rgba-unorm'

fields.bc7_rgba_unorm_srgb.doc = 'BC7 compressed RGBA with sRGB encoding. Requires enums.FeatureName.texture_compression_bc.'
fields.bc7_rgba_unorm_srgb.value = 'bc7-rgba-unorm-srgb'

fields.etc2_rgb8unorm.doc = 'ETC2 compressed RGB, 8 bits per channel, unsigned normalized. Requires enums.FeatureName.texture_compression_etc2.'
fields.etc2_rgb8unorm.value = 'etc2-rgb8unorm'

fields.etc2_rgb8unorm_srgb.doc = 'ETC2 compressed RGB with sRGB encoding. Requires enums.FeatureName.texture_compression_etc2.'
fields.etc2_rgb8unorm_srgb.value = 'etc2-rgb8unorm-srgb'

fields.etc2_rgb8a1unorm.doc = 'ETC2 compressed RGB with 1-bit punch-through alpha, unsigned normalized. Requires enums.FeatureName.texture_compression_etc2.'
fields.etc2_rgb8a1unorm.value = 'etc2-rgb8a1unorm'

fields.etc2_rgb8a1unorm_srgb.doc = 'ETC2 compressed RGB with 1-bit alpha and sRGB encoding. Requires enums.FeatureName.texture_compression_etc2.'
fields.etc2_rgb8a1unorm_srgb.value = 'etc2-rgb8a1unorm-srgb'

fields.etc2_rgba8unorm.doc = 'ETC2 compressed RGBA, 8 bits per channel, unsigned normalized. Requires enums.FeatureName.texture_compression_etc2.'
fields.etc2_rgba8unorm.value = 'etc2-rgba8unorm'

fields.etc2_rgba8unorm_srgb.doc = 'ETC2 compressed RGBA with sRGB encoding. Requires enums.FeatureName.texture_compression_etc2.'
fields.etc2_rgba8unorm_srgb.value = 'etc2-rgba8unorm-srgb'

fields.eac_r11unorm.doc = 'EAC compressed single channel, 11-bit unsigned normalized. Requires enums.FeatureName.texture_compression_etc2.'
fields.eac_r11unorm.value = 'eac-r11unorm'

