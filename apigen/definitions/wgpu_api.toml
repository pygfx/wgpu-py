# ---- GPUCommandEncoder ---------------------------------------------------------------------------

[classes.GPUCommandEncoder]
doc = '''
Records GPU commands (render passes, compute passes and copy operations) into a GPUCommandBuffer.

Create one with GPUDevice.create_command_encoder(). Call finish() to obtain the command buffer, and submit it with GPUQueue.submit().
Only one pass can be active at a time; end the pass (using the end() method of the pass encoder) before recording other commands.
'''
bases = ['GPUObjectBase', 'GPUCommandsMixin', 'GPUDebugCommandsMixin']
properties = {}

[classes.GPUCommandEncoder.methods.begin_render_pass]
doc = '''
Begin a render pass, returning a GPURenderPassEncoder to record draw commands with.

The pass must be ended with GPURenderPassEncoder.end() before the encoder can be used again.
'''
returns.doc = 'A GPURenderPassEncoder.'
returns.type = 'GPURenderPassEncoder'

args.descriptor.doc = 'A structs.RenderPassDescriptor describing the attachments of the pass.'
args.descriptor.type = 'structs.RenderPassDescriptorStruct'
args.descriptor.default = ''

[classes.GPUCommandEncoder.methods.begin_compute_pass]
doc = '''
Begin a compute pass, returning a GPUComputePassEncoder to record dispatch commands with.

The pass must be ended with GPUComputePassEncoder.end() before the encoder can be used again.
'''
returns.doc = 'A GPUComputePassEncoder.'
returns.type = 'GPUComputePassEncoder'

args.descriptor.doc = 'A structs.ComputePassDescriptor. Optional.'
args.descriptor.type = 'structs.ComputePassDescriptorStruct | None'
args.descriptor.default = 'None'

[classes.GPUCommandEncoder.methods.copy_buffer_to_buffer]
doc = '''
Copy data from one GPUBuffer to another.

The source needs flags.BufferUsage.COPY_SRC and the destination flags.BufferUsage.COPY_DST.
Offsets and size must be multiples of 4, and the ranges must not overlap if the buffers are the same.
'''
returns.doc = 'None.'
returns.type = 'None'

args.source.doc = 'The GPUBuffer to copy from.'
args.source.type = 'GPUBuffer'
args.source.default = ''

args.source_offset.doc = 'The offset in bytes in the source buffer where the copy starts.'
args.source_offset.type = 'int'
args.source_offset.default = ''

args.destination.doc = 'The GPUBuffer to copy to.'
args.destination.type = 'GPUBuffer'
args.destination.default = ''

args.destination_offset.doc = 'The offset in bytes in the destination buffer where the data is written.'
args.destination_offset.type = 'int'
args.destination_offset.default = ''

args.size.doc = 'The number of bytes to copy. Defaults to the size of the source buffer minus the source_offset argument of this method.'
args.size.type = 'int | None'
args.size.default = 'None'

[classes.GPUCommandEncoder.methods.copy_buffer_to_texture]
doc = '''
Copy data from a GPUBuffer to a GPUTexture.

The source buffer needs flags.BufferUsage.COPY_SRC and the texture flags.TextureUsage.COPY_DST.
'''
returns.doc = 'None.'
returns.type = 'None'

args.source.doc = 'A structs.TexelCopyBufferInfo describing the buffer and the layout of the data in it.'
args.source.type = 'structs.TexelCopyBufferInfoStruct'
args.source.default = ''

args.destination.doc = 'A structs.TexelCopyTextureInfo describing the part of the texture to copy to.'
args.destination.type = 'structs.TexelCopyTextureInfoStruct'
args.destination.default = ''

args.copy_size.doc = 'A structs.Extent3D (or tuple) with the size of the region to copy, in texels.'
args.copy_size.type = 'tuple[int, int, int] | structs.Extent3DStruct'
args.copy_size.default = ''

[classes.GPUCommandEncoder.methods.copy_texture_to_buffer]
doc = '''
Copy data from a GPUTexture to a GPUBuffer.

The texture needs flags.TextureUsage.COPY_SRC and the destination buffer flags.BufferUsage.COPY_DST.
'''
returns.doc = 'None.'
returns.type = 'None'

args.source.doc = 'A structs.TexelCopyTextureInfo describing the part of the texture to copy from.'
args.source.type = 'structs.TexelCopyTextureInfoStruct'
args.source.default = ''

args.destination.doc = 'A structs.TexelCopyBufferInfo describing the buffer and the layout of the data in it.'
args.destination.type = 'structs.TexelCopyBufferInfoStruct'
args.destination.default = ''

args.copy_size.doc = 'A structs.Extent3D (or tuple) with the size of the region to copy, in texels.'
args.copy_size.type = 'tuple[int, int, int] | structs.Extent3DStruct'
args.copy_size.default = ''

[classes.GPUCommandEncoder.methods.copy_texture_to_texture]
doc = '''
Copy data from one GPUTexture to another.

The source needs flags.TextureUsage.COPY_SRC and the destination flags.TextureUsage.COPY_DST.
The formats must be compatible, and the sample counts equal.
'''
returns.doc = 'None.'
returns.type = 'None'

args.source.doc = 'A structs.TexelCopyTextureInfo describing the part of the texture to copy from.'
args.source.type = 'structs.TexelCopyTextureInfoStruct'
args.source.default = ''

args.destination.doc = 'A structs.TexelCopyTextureInfo describing the part of the texture to copy to.'
args.destination.type = 'structs.TexelCopyTextureInfoStruct'
args.destination.default = ''

args.copy_size.doc = 'A structs.Extent3D (or tuple) with the size of the region to copy, in texels.'
args.copy_size.type = 'tuple[int, int, int] | structs.Extent3DStruct'
args.copy_size.default = ''

[classes.GPUCommandEncoder.methods.clear_buffer]
doc = '''
Fill (a part of) a GPUBuffer with zeros.

The buffer needs flags.BufferUsage.COPY_DST.
'''
returns.doc = 'None.'
returns.type = 'None'

args.buffer.doc = 'The GPUBuffer to clear.'
args.buffer.type = 'GPUBuffer'
args.buffer.default = ''

args.offset.doc = 'The offset in bytes where the clearing starts. Must be a multiple of 4. Defaults to 0.'
args.offset.type = 'int'
args.offset.default = '0'

args.size.doc = 'The number of bytes to clear. Must be a multiple of 4. Defaults to the remainder of the buffer after offset.'
args.size.type = 'int | None'
args.size.default = 'None'

[classes.GPUCommandEncoder.methods.resolve_query_set]
doc = '''
Resolve the results of queries in a GPUQuerySet into a GPUBuffer.

The destination buffer needs flags.BufferUsage.QUERY_RESOLVE. Each result is written as a 64-bit unsigned integer.
'''
returns.doc = 'None.'
returns.type = 'None'

args.query_set.doc = 'The GPUQuerySet to read results from.'
args.query_set.type = 'GPUQuerySet'
args.query_set.default = ''

args.first_query.doc = 'The index of the first query to resolve.'
args.first_query.type = 'int'
args.first_query.default = ''

args.query_count.doc = 'The number of queries to resolve.'
args.query_count.type = 'int'
args.query_count.default = ''

args.destination.doc = 'The GPUBuffer to write the results to.'
args.destination.type = 'GPUBuffer'
args.destination.default = ''

args.destination_offset.doc = 'The offset in bytes in the destination buffer where the results are written. Must be a multiple of 256.'
args.destination_offset.type = 'int'
args.destination_offset.default = ''

[classes.GPUCommandEncoder.methods.finish]
doc = '''
Finish recording and return a GPUCommandBuffer.

The command buffer can be submitted with GPUQueue.submit(). The encoder cannot be used after this call.
'''
returns.doc = 'A GPUCommandBuffer.'
returns.type = 'GPUCommandBuffer'

args.descriptor.doc = 'A structs.CommandBufferDescriptor. Optional.'
args.descriptor.type = 'structs.CommandBufferDescriptorStruct | None'
args.descriptor.default = 'None'

# ---- GPUBindingCommandsMixin ---------------------------------------------------------------------

[classes.GPUBindingCommandsMixin]
doc = '''
A mixin class for pass encoders that can bind resources: GPUComputePassEncoder, GPURenderPassEncoder and GPURenderBundleEncoder.

It provides methods to set bind groups and immediate data.
'''
bases = []
properties = {}

[classes.GPUBindingCommandsMixin.methods.set_bind_group]
doc = '''
Set a GPUBindGroup for the given bind group index, to be used by subsequent draw or dispatch commands.

The bind group must be compatible with the layout of the pipeline. If the layout has entries with
dynamic offsets (see the has_dynamic_offset field of structs.BufferBindingLayout), offsets must be provided.
The dynamic offsets can be given as a list, or as a range of an array (using the start and length arguments).
'''
returns.doc = 'None.'
returns.type = 'None'

args.index.doc = 'The index of the bind group (the @group number in the shader).'
args.index.type = 'int'
args.index.default = ''

args.bind_group.doc = 'The GPUBindGroup to set, or None to unset it.'
args.bind_group.type = 'GPUBindGroup'
args.bind_group.default = ''

args.dynamic_offsets_data.doc = 'A list or array of offsets in bytes, one for each dynamic buffer binding, in order of binding number.'
args.dynamic_offsets_data.type = 'ArrayLike'
args.dynamic_offsets_data.default = ''

args.dynamic_offsets_data_start.doc = 'If dynamic_offsets_data is an array, the index of the first offset to use.'
args.dynamic_offsets_data_start.type = 'int'
args.dynamic_offsets_data_start.default = ''

args.dynamic_offsets_data_length.doc = 'If dynamic_offsets_data is an array, the number of offsets to use.'
args.dynamic_offsets_data_length.type = 'int'
args.dynamic_offsets_data_length.default = ''

[classes.GPUBindingCommandsMixin.methods.set_immediates]
doc = '''
Set immediate data: a small amount of data (typically a few hundred bytes at most) that is passed to shaders directly without a buffer.

The size of the immediate data is determined by the immediate_size field of structs.PipelineLayoutDescriptor.
'''
returns.doc = 'None.'
returns.type = 'None'

args.range_offset.doc = 'The offset in bytes in the immediate data range where the data is written. Must be a multiple of 4.'
args.range_offset.type = 'int'
args.range_offset.default = ''

args.data.doc = 'The data to write, as an object that supports the buffer protocol (e.g. bytes or a numpy array).'
args.data.type = 'ArrayLike'
args.data.default = ''

args.data_offset.doc = 'The offset in the data (in elements of the data type, or bytes) where reading starts. Defaults to 0.'
args.data_offset.type = 'int'
args.data_offset.default = '0'

args.data_size.doc = 'The amount of data to write (in elements of the data type, or bytes). Defaults to the remainder of the data after data_offset.'
args.data_size.type = 'int | None'
args.data_size.default = 'None'

