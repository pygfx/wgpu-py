# ==== classes =====================================================================================
# ==================================================================================================

# ---- GPUObjectBase -------------------------------------------------------------------------------

[classes.GPUObjectBase]
doc = '''
The base class of all GPU objects.

It provides the label property that is shared by all objects in the API.
'''
bases = []
methods = {}

[classes.GPUObjectBase.properties.label]
doc = 'A human-readable label for the object, used in debugging and error messages. Initially taken from the label field of the descriptor used to create it.'
type = 'str'

[classes.GPUObjectBase.properties.uid]
doc = '''
A unique id (integer) for this object.

The value is unique to the process; in contrast to ``id(ob)``, the numbers are never reused.'''
type = 'int'

# ---- GPUAdapterInfo ------------------------------------------------------------------------------

[classes.GPUAdapterInfo]
doc = '''
Information about a physical adapter (GPU).

An instance is available via the info property of GPUAdapter and the adapter_info property of GPUDevice.
The values are strings that are possibly empty if the information is not available.
'''
bases = ['dict']
methods = {}

[classes.GPUAdapterInfo.properties.vendor]
doc = "The name of the vendor of the adapter, e.g. 'nvidia' or 'amd'."
type = 'str'

[classes.GPUAdapterInfo.properties.architecture]
doc = 'The name of the family or class of GPUs the adapter belongs to.'
type = 'str'

[classes.GPUAdapterInfo.properties.device]
doc = 'A vendor-specific identifier for the type of adapter (e.g. a PCI device id), if available. It does not uniquely identify a piece of hardware like a serial number.'
type = 'str'

[classes.GPUAdapterInfo.properties.description]
doc = 'A human-readable description of the adapter as reported by the driver, e.g. the name of the GPU. Not formatted in any standard way, so parsing it is not recommended; prefer the other fields.'
type = 'str'

[classes.GPUAdapterInfo.properties.subgroup_min_size]
doc = 'The minimum supported subgroup size of the adapter. Only available if enums.FeatureName.subgroups is supported.'
type = 'int'

[classes.GPUAdapterInfo.properties.subgroup_max_size]
doc = 'The maximum supported subgroup size of the adapter. Only available if enums.FeatureName.subgroups is supported.'
type = 'int'

[classes.GPUAdapterInfo.properties.is_fallback_adapter]
doc = 'Whether this is a fallback adapter, e.g. a software renderer.'
type = 'bool'

# ---- GPU -----------------------------------------------------------------------------------------

[classes.GPU]
doc = '''
The entry point of the API.

It is used to request a GPUAdapter. In wgpu-py an instance is available as wgpu.gpu.
'''
bases = []

[classes.GPU.properties.wgsl_language_features]
doc = 'The set of WGSL language features that are supported by the implementation.'
type = 'set'

[classes.GPU.methods.request_adapter_async]
doc = '''
Request a GPUAdapter, which represents a physical GPU (or a software equivalent).

The adapter can be used to inspect the capabilities (features and limits) of the GPU,
and to request a GPUDevice. If no suitable adapter is available, None is returned.
'''
returns.doc = 'A GPUAdapter, or None if no suitable adapter was found.'
returns.type = 'GPUPromise[GPUAdapter]'

args.options.doc = 'A structs.RequestAdapterOptions with options for selecting the adapter.'
args.options.type = 'structs.RequestAdapterOptionsStruct | None'
args.options.default = 'None'

[classes.GPU.methods.request_adapter_sync]
doc = 'The synchronous variant of request_adapter_async().'
returns.doc = ''
returns.type = 'GPUAdapter'

args.options.doc = 'A structs.RequestAdapterOptions with options for selecting the adapter.'
args.options.type = 'structs.RequestAdapterOptionsStruct | None'
args.options.default = 'None'

[classes.GPU.methods.get_preferred_canvas_format]
doc = '''
Get the preferred texture format for presenting to a canvas.

Using this format for the format field of structs.CanvasConfiguration avoids a conversion when presenting.
'''
args = {}
returns.doc = 'An enums.TextureFormat, either rgba8unorm or bgra8unorm.'
returns.type = 'enums.TextureFormatEnum'

[classes.GPU.methods.enumerate_adapters_async]
doc = 'Get a list of adapter objects available on the current system.'
args = {}
returns.type = 'GPUPromise[list[GPUAdapter]]'

[classes.GPU.methods.enumerate_adapters_sync]
doc = 'Get a list of adapter objects available on the current system.'
args = {}
returns.type = 'list[GPUAdapter]'

[classes.GPU.methods.get_canvas_context]
doc = '''
Get the GPUCanvasContext object for the appropriate backend.

Note that the recommended way to get a context is to instead use the ``rendercanvas`` library.

The ``present_info`` dict should have a ``window`` field containing the window id. On Linux there should also be ``platform`` field to distinguish between 'wayland' and 'x11', and a ``display`` field for the display id. For the Pyodide backend, the ``window`` is the ``<canvas>`` object. This dict is an interface between `rendercanvas`` and ``wgpu-py``.'''
returns.type = 'GPUCanvasContext'

args.present_info.doc = 'The low-level presentation info.'
args.present_info.type = 'dict'
args.present_info.default = ''

# ---- GPUAdapter ----------------------------------------------------------------------------------

[classes.GPUAdapter]
doc = '''
Represents a physical GPU (or a software implementation of one).

An adapter can be used to inspect the capabilities of the GPU, and to request a GPUDevice,
which is used to do actual work. Adapters are obtained via GPU.request_adapter().
'''
bases = []

[classes.GPUAdapter.properties.features]
doc = 'The set of enums.FeatureName that the adapter supports.'
type = 'set'

[classes.GPUAdapter.properties.limits]
doc = 'A mapping of limit names to the maximum values supported by the adapter.'
type = 'dict'

[classes.GPUAdapter.properties.info]
doc = 'A GPUAdapterInfo with information about the adapter. The values are constant over time.'
type = 'GPUAdapterInfo'

[classes.GPUAdapter.properties.summary]
doc = 'A one-line summary of the info of this adapter (device, adapter_type, backend_type).'
type = 'str'

[classes.GPUAdapter.methods.request_device_async]
doc = '''
Request a GPUDevice from the adapter.

The device is the main object used to create resources and to submit work. An adapter can
only provide a single device; if it was already used, or if the requested features or limits
are not supported, the request fails.
'''
returns.doc = 'A GPUDevice.'
returns.type = 'GPUPromise[GPUDevice]'

args.descriptor.doc = 'A structs.DeviceDescriptor with the required features and limits.'
args.descriptor.type = 'structs.DeviceDescriptorStruct | None'
args.descriptor.default = 'None'

[classes.GPUAdapter.methods.request_device_sync]
doc = 'The synchronous variant of request_device_async().'
returns.doc = ''
returns.type = 'GPUDevice'

args.descriptor.doc = 'A structs.DeviceDescriptor with the required features and limits.'
args.descriptor.type = 'structs.DeviceDescriptorStruct | None'
args.descriptor.default = 'None'

# ---- GPUDevice -----------------------------------------------------------------------------------

[classes.GPUDevice]
doc = '''
The main object that is used to create GPU resources and to submit work.

A device is requested from a GPUAdapter. It is a GPUObjectBase, and has a GPUQueue
(the queue property) which is used to submit work to the GPU. Most resources
(buffers, textures, pipelines, etc.) are created using the create_* methods of the device.
'''
bases = ['GPUObjectBase']

[classes.GPUDevice.properties.features]
doc = 'The set of enums.FeatureName that are enabled on the device (exactly those it was created with).'
type = 'set'

[classes.GPUDevice.properties.limits]
doc = 'A mapping of limit names to the values that are in effect for the device (exactly those it was created with).'
type = 'dict'

[classes.GPUDevice.properties.adapter_info]
doc = 'A GPUAdapterInfo with information about the adapter that this device was created from. The values are constant over time.'
type = 'GPUAdapterInfo'

[classes.GPUDevice.properties.queue]
doc = 'The default GPUQueue of the device.'
type = 'GPUQueue'

[classes.GPUDevice.properties.lost]
doc = 'A promise or future that stays pending for the lifetime of the device and resolves to a GPUDeviceLostInfo when the device is lost.'
type = 'GPUPromise[GPUDeviceLostInfo]'

[classes.GPUDevice.properties.onuncapturederror]
doc = 'A callback that is called with an event (see structs.UncapturedErrorEventInit) when an error occurs that is not captured by an error scope.'
type = 'None'

[classes.GPUDevice.properties.adapter]
doc = 'The adapter object corresponding to this device.'
type = 'GPUAdapter'

[classes.GPUDevice.methods.destroy]
doc = '''
Destroy the device, preventing further operations on it.

Outstanding asynchronous operations fail. The device is lost with the reason enums.DeviceLostReason.destroyed, and all resources
created by the device become unusable. Destroying a device multiple times is allowed.
'''
args = {}
returns.doc = 'None.'
returns.type = 'None'

[classes.GPUDevice.methods.create_buffer]
doc = '''
Create a GPUBuffer, a block of memory that can be used by the GPU.

Data can be written to the buffer using GPUQueue.write_buffer(), copy commands, or by mapping it (see GPUBuffer.map_async()).
'''
returns.doc = 'A GPUBuffer.'
returns.type = 'GPUBuffer'

args.descriptor.doc = 'A structs.BufferDescriptor describing the buffer.'
args.descriptor.type = 'structs.BufferDescriptorStruct'
args.descriptor.default = ''

[classes.GPUDevice.methods.create_texture]
doc = '''
Create a GPUTexture, an image resource (1D, 2D or 3D) that can be sampled or rendered to.

Textures are not accessed directly by shaders; use GPUTexture.create_view() to obtain a GPUTextureView.
'''
returns.doc = 'A GPUTexture.'
returns.type = 'GPUTexture'

args.descriptor.doc = 'A structs.TextureDescriptor describing the texture.'
args.descriptor.type = 'structs.TextureDescriptorStruct'
args.descriptor.default = ''

[classes.GPUDevice.methods.create_sampler]
doc = '''
Create a GPUSampler, which defines how a texture is sampled (filtering and addressing) in a shader.
'''
returns.doc = 'A GPUSampler.'
returns.type = 'GPUSampler'

args.descriptor.doc = 'A structs.SamplerDescriptor describing the sampler. If omitted, the defaults are used.'
args.descriptor.type = 'structs.SamplerDescriptorStruct | None'
args.descriptor.default = 'None'

[classes.GPUDevice.methods.create_bind_group_layout]
doc = '''
Create a GPUBindGroupLayout, which describes the types and visibility of the resources in a bind group.

A bind group layout is used in create_bind_group() and create_pipeline_layout().
'''
returns.doc = 'A GPUBindGroupLayout.'
returns.type = 'GPUBindGroupLayout'

args.descriptor.doc = 'A structs.BindGroupLayoutDescriptor describing the entries of the layout.'
args.descriptor.type = 'structs.BindGroupLayoutDescriptorStruct'
args.descriptor.default = ''

[classes.GPUDevice.methods.create_pipeline_layout]
doc = '''
Create a GPUPipelineLayout, which describes all bind groups (and immediate data) used by a pipeline.
'''
returns.doc = 'A GPUPipelineLayout.'
returns.type = 'GPUPipelineLayout'

args.descriptor.doc = 'A structs.PipelineLayoutDescriptor describing the bind group layouts.'
args.descriptor.type = 'structs.PipelineLayoutDescriptorStruct'
args.descriptor.default = ''

[classes.GPUDevice.methods.create_bind_group]
doc = '''
Create a GPUBindGroup, which binds actual resources (buffers, textures, samplers) to the slots described by a layout.

Bind groups are set on a pass encoder with GPUBindingCommandsMixin.set_bind_group().
'''
returns.doc = 'A GPUBindGroup.'
returns.type = 'GPUBindGroup'

args.descriptor.doc = 'A structs.BindGroupDescriptor with the layout and the resources to bind.'
args.descriptor.type = 'structs.BindGroupDescriptorStruct'
args.descriptor.default = ''

[classes.GPUDevice.methods.create_shader_module]
doc = '''
Create a GPUShaderModule from shader source code (WGSL).

Compilation errors do not raise immediately; use GPUShaderModule.get_compilation_info() to inspect messages,
or use error scopes (see push_error_scope()).
'''
returns.doc = 'A GPUShaderModule.'
returns.type = 'GPUShaderModule'

args.descriptor.doc = 'A structs.ShaderModuleDescriptor containing the shader code.'
args.descriptor.type = 'structs.ShaderModuleDescriptorStruct'
args.descriptor.default = ''

[classes.GPUDevice.methods.create_compute_pipeline]
doc = '''
Create a GPUComputePipeline, which describes a compute shader and its resources.

The pipeline is created immediately, which may block while the shader is compiled. Prefer create_compute_pipeline_async() when possible.
'''
returns.doc = 'A GPUComputePipeline.'
returns.type = 'GPUComputePipeline'

args.descriptor.doc = 'A structs.ComputePipelineDescriptor describing the pipeline.'
args.descriptor.type = 'structs.ComputePipelineDescriptorStruct'
args.descriptor.default = ''

[classes.GPUDevice.methods.create_render_pipeline]
doc = '''
Create a GPURenderPipeline, which describes the full state of the graphics pipeline: shaders, vertex layout, rasterization, depth/stencil, blending and render targets.

The pipeline is created immediately, which may block while the shaders are compiled. Prefer create_render_pipeline_async() when possible.
'''
returns.doc = 'A GPURenderPipeline.'
returns.type = 'GPURenderPipeline'

args.descriptor.doc = 'A structs.RenderPipelineDescriptor describing the pipeline.'
args.descriptor.type = 'structs.RenderPipelineDescriptorStruct'
args.descriptor.default = ''

[classes.GPUDevice.methods.create_compute_pipeline_async]
doc = '''
Asynchronous version of create_compute_pipeline().

The result is ready to be used without additional delay once the promise (or future) resolves. If creation fails, a GPUPipelineError is raised instead of an error being generated on the device.
Using this method is preferred whenever possible, as it avoids blocking queue work on pipeline compilation.
'''
returns.doc = 'A GPUComputePipeline (awaitable).'
returns.type = 'GPUPromise[GPUComputePipeline]'

args.descriptor.doc = 'A structs.ComputePipelineDescriptor describing the pipeline.'
args.descriptor.type = 'structs.ComputePipelineDescriptorStruct'
args.descriptor.default = ''

[classes.GPUDevice.methods.create_render_pipeline_async]
doc = '''
Asynchronous version of create_render_pipeline().

The result is ready to be used without additional delay once the promise (or future) resolves. If creation fails, a GPUPipelineError is raised instead of an error being generated on the device.
Using this method is preferred whenever possible, as it avoids blocking queue work on pipeline compilation.
'''
returns.doc = 'A GPURenderPipeline (awaitable).'
returns.type = 'GPUPromise[GPURenderPipeline]'

args.descriptor.doc = 'A structs.RenderPipelineDescriptor describing the pipeline.'
args.descriptor.type = 'structs.RenderPipelineDescriptorStruct'
args.descriptor.default = ''

[classes.GPUDevice.methods.create_command_encoder]
doc = '''
Create a GPUCommandEncoder, used to record GPU commands (passes and copies).

Finish the encoder with GPUCommandEncoder.finish() and submit the result with GPUQueue.submit().
'''
returns.doc = 'A GPUCommandEncoder.'
returns.type = 'GPUCommandEncoder'

args.descriptor.doc = 'A structs.CommandEncoderDescriptor. Optional.'
args.descriptor.type = 'structs.CommandEncoderDescriptorStruct | None'
args.descriptor.default = 'None'

[classes.GPUDevice.methods.create_render_bundle_encoder]
doc = '''
Create a GPURenderBundleEncoder, used to pre-record a sequence of render commands that can be replayed in many render passes.

The attachment formats given in the descriptor determine in which render passes the resulting bundle can be used.
'''
returns.doc = 'A GPURenderBundleEncoder.'
returns.type = 'GPURenderBundleEncoder'

args.descriptor.doc = 'A structs.RenderBundleEncoderDescriptor describing the attachment formats.'
args.descriptor.type = 'structs.RenderBundleEncoderDescriptorStruct'
args.descriptor.default = ''

[classes.GPUDevice.methods.create_query_set]
doc = '''
Create a GPUQuerySet, a set of queries that hold e.g. occlusion or timestamp results.

Results are written during passes and can be retrieved with GPUCommandEncoder.resolve_query_set().
'''
returns.doc = 'A GPUQuerySet.'
returns.type = 'GPUQuerySet'

args.descriptor.doc = 'A structs.QuerySetDescriptor describing the type and count of queries.'
args.descriptor.type = 'structs.QuerySetDescriptorStruct'
args.descriptor.default = ''

[classes.GPUDevice.methods.push_error_scope]
doc = '''
Push a new error scope onto the device's error scope stack.

While the scope is active, errors of the given type that are generated by operations on this device are
captured by the scope (instead of triggering the onuncapturederror callback). Retrieve them with pop_error_scope().
'''
returns.doc = 'None.'
returns.type = 'None'

args.filter.doc = 'The type of error to capture, see enums.ErrorFilter.'
args.filter.type = 'enums.ErrorFilterEnum'
args.filter.default = ''

[classes.GPUDevice.methods.pop_error_scope_async]
doc = '''
Pop the most recent error scope from the stack and return an error observed by it.

Fails if there is no error scope to pop. Errors are only reported once all operations in the scope have been processed.
'''
args = {}
returns.doc = 'A GPUError (GPUValidationError, GPUOutOfMemoryError or GPUInternalError), or None if no error was captured.'
returns.type = 'GPUPromise[GPUError]'

[classes.GPUDevice.methods.pop_error_scope_sync]
doc = 'The synchronous variant of pop_error_scope_async().'
args = {}
returns.doc = ''
returns.type = 'GPUError'

[classes.GPUDevice.methods.create_buffer_with_data]
returns.type = 'GPUBuffer'

args.label.type = 'str'
args.label.default = '""'

args.data.type = 'ArrayLike'
args.data.default = ''

args.usage.type = 'flags.BufferUsageFlags'
args.usage.default = ''

# ---- GPUBuffer -----------------------------------------------------------------------------------

[classes.GPUBuffer]
doc = '''
A block of memory that can be used by the GPU for e.g. vertex data, uniform data or general storage.

Buffers are created with GPUDevice.create_buffer(). Data can be uploaded with GPUQueue.write_buffer() or
copy commands, or by mapping the buffer. Mapping makes the memory accessible to the CPU, but the
buffer cannot be used by the GPU while it is mapped.
'''
bases = ['GPUObjectBase']

[classes.GPUBuffer.properties.size]
doc = 'The size of the buffer in bytes.'
type = 'int'

[classes.GPUBuffer.properties.usage]
doc = 'The usage of the buffer, a combination of flags.BufferUsage.'
type = 'int'

[classes.GPUBuffer.properties.map_state]
doc = 'The current mapping state of the buffer, see enums.BufferMapState.'
type = 'enums.BufferMapStateEnum'

[classes.GPUBuffer.methods.map_async]
doc = '''
Map (a part of) the buffer so its memory can be accessed by the CPU.

The returned promise or future resolves when the buffer is mapped. Once mapped, use get_mapped_range()
to access the data, and call unmap() when done to give the buffer back to the GPU.
Resolving only indicates that this buffer is mapped, not that other work has completed. However, when GPUQueue.on_submitted_work_done()
resolves, earlier map_async() calls on buffers last used exclusively on that queue have completed.
'''
returns.doc = 'None (awaitable); resolves when the buffer is mapped.'
returns.type = 'GPUPromise[None]'

args.mode.doc = 'Whether to map for reading or writing, see flags.MapMode.'
args.mode.type = 'flags.MapModeFlags'
args.mode.default = ''

args.offset.doc = 'The offset in bytes of the range to map. Must be a multiple of 8. Defaults to 0.'
args.offset.type = 'int'
args.offset.default = '0'

args.size.doc = 'The size in bytes of the range to map. Must be a multiple of 4. Defaults to the remainder of the buffer after offset.'
args.size.type = 'int | None'
args.size.default = 'None'

[classes.GPUBuffer.methods.map_sync]
doc = 'The synchronous variant of map_async().'
returns.doc = ''
returns.type = 'None'

args.mode.doc = 'Whether to map for reading or writing, see flags.MapMode.'
args.mode.type = 'flags.MapModeFlags'
args.mode.default = ''

args.offset.doc = 'The offset in bytes of the range to map. Must be a multiple of 8. Defaults to 0.'
args.offset.type = 'int'
args.offset.default = '0'

args.size.doc = 'The size in bytes of the range to map. Must be a multiple of 4. Defaults to the remainder of the buffer after offset.'
args.size.type = 'int | None'
args.size.default = 'None'

[classes.GPUBuffer.methods.get_mapped_range]
doc = '''
Get a view on the memory of a mapped part of the buffer.

The buffer must be mapped (see map_async() or the mapped_at_creation field of structs.BufferDescriptor).
The returned memory becomes invalid when the buffer is unmapped.
'''
returns.doc = 'A writable memory view (e.g. a memoryview) on the mapped range.'
returns.type = 'ArrayLike'

args.offset.doc = 'The offset in bytes of the range, relative to the start of the buffer. Must be a multiple of 8. Defaults to 0.'
args.offset.type = 'int'
args.offset.default = '0'

args.size.doc = 'The size in bytes of the range. Must be a multiple of 4. Defaults to the remainder of the mapped range after offset.'
args.size.type = 'int | None'
args.size.default = 'None'

[classes.GPUBuffer.methods.unmap]
doc = '''
Unmap the buffer, making any mapped memory invalid, and handing the buffer back to the GPU.

If the buffer was mapped for writing, the written data becomes visible to the GPU.
'''
args = {}
returns.doc = 'None.'
returns.type = 'None'

[classes.GPUBuffer.methods.destroy]
doc = '''
Destroy the buffer and free its memory.

The buffer can no longer be used. Calling this multiple times is allowed.
'''
args = {}
returns.doc = 'None.'
returns.type = 'None'

# ---- GPUTexture ----------------------------------------------------------------------------------

[classes.GPUTexture]
doc = '''
An image resource of one, two or three dimensions, optionally with mip levels and array layers.

Textures are created with GPUDevice.create_texture(). To use a texture in a shader or as a render
attachment, create a GPUTextureView with create_view().
'''
bases = ['GPUObjectBase']

[classes.GPUTexture.properties.width]
doc = 'The width of the texture in texels.'
type = 'int'

[classes.GPUTexture.properties.height]
doc = 'The height of the texture in texels.'
type = 'int'

[classes.GPUTexture.properties.depth_or_array_layers]
doc = 'The depth (for 3D textures) or the number of array layers of the texture.'
type = 'int'

[classes.GPUTexture.properties.mip_level_count]
doc = 'The number of mip levels of the texture.'
type = 'int'

[classes.GPUTexture.properties.sample_count]
doc = 'The number of samples per pixel of the texture (1 unless multisampled).'
type = 'int'

