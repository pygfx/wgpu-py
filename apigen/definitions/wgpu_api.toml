fields.depth32float_stencil8.doc = 'A depth-stencil format with 32-bit floating point depth and 8 bits of stencil. Requires enums.FeatureName.depth32float_stencil8.'
fields.depth32float_stencil8.value = 'depth32float-stencil8'

fields.bc1_rgba_unorm.doc = 'BC1 (DXT1) compressed RGBA, unsigned normalized. 4x4 blocks of 8 bytes. Requires enums.FeatureName.texture_compression_bc.'
fields.bc1_rgba_unorm.value = 'bc1-rgba-unorm'

fields.bc1_rgba_unorm_srgb.doc = 'BC1 (DXT1) compressed RGBA with sRGB encoding. Requires enums.FeatureName.texture_compression_bc.'
fields.bc1_rgba_unorm_srgb.value = 'bc1-rgba-unorm-srgb'

fields.bc2_rgba_unorm.doc = 'BC2 (DXT3) compressed RGBA, unsigned normalized. 4x4 blocks of 16 bytes. Requires enums.FeatureName.texture_compression_bc.'
fields.bc2_rgba_unorm.value = 'bc2-rgba-unorm'

fields.bc2_rgba_unorm_srgb.doc = 'BC2 (DXT3) compressed RGBA with sRGB encoding. Requires enums.FeatureName.texture_compression_bc.'
fields.bc2_rgba_unorm_srgb.value = 'bc2-rgba-unorm-srgb'

fields.bc3_rgba_unorm.doc = 'BC3 (DXT5) compressed RGBA, unsigned normalized. 4x4 blocks of 16 bytes. Requires enums.FeatureName.texture_compression_bc.'
fields.bc3_rgba_unorm.value = 'bc3-rgba-unorm'

fields.bc3_rgba_unorm_srgb.doc = 'BC3 (DXT5) compressed RGBA with sRGB encoding. Requires enums.FeatureName.texture_compression_bc.'
fields.bc3_rgba_unorm_srgb.value = 'bc3-rgba-unorm-srgb'

fields.bc4_r_unorm.doc = 'BC4 compressed single channel, unsigned normalized. Requires enums.FeatureName.texture_compression_bc.'
fields.bc4_r_unorm.value = 'bc4-r-unorm'

fields.bc4_r_snorm.doc = 'BC4 compressed single channel, signed normalized. Requires enums.FeatureName.texture_compression_bc.'
fields.bc4_r_snorm.value = 'bc4-r-snorm'

fields.bc5_rg_unorm.doc = 'BC5 compressed two channels, unsigned normalized. Requires enums.FeatureName.texture_compression_bc.'
fields.bc5_rg_unorm.value = 'bc5-rg-unorm'

fields.bc5_rg_snorm.doc = 'BC5 compressed two channels, signed normalized. Requires enums.FeatureName.texture_compression_bc.'
fields.bc5_rg_snorm.value = 'bc5-rg-snorm'

fields.bc6h_rgb_ufloat.doc = 'BC6H compressed HDR RGB, unsigned float. Requires enums.FeatureName.texture_compression_bc.'
fields.bc6h_rgb_ufloat.value = 'bc6h-rgb-ufloat'

