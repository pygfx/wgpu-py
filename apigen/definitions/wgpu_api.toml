[meta]
filename = 'wgpu_api.toml'
description = "Definition of the base wgpu API, derived from 'webgpu.toml', 'diff_base.toml', 'diff_docs.toml'."
notes = 'The full API, including docs, in one file. This does *not* include enums/flags/structs from any of the backends.'

# ==== flags =======================================================================================
# ==================================================================================================

[flags.BufferUsage]
doc = '''
Bit flags describing how a GPUBuffer can be used. Combine them with the bitwise OR operator.

The usage is set when creating the buffer (see the usage field of structs.BufferDescriptor) and cannot be changed afterwards.
Using a buffer in a way that was not declared here results in a validation error.
'''
fields.MAP_READ.doc = 'The buffer can be mapped for reading by the CPU (see flags.MapMode.READ). Can only be combined with COPY_DST.'
fields.MAP_READ.value = 1

fields.MAP_WRITE.doc = 'The buffer can be mapped for writing by the CPU (see flags.MapMode.WRITE). Can only be combined with COPY_SRC.'
fields.MAP_WRITE.value = 2

fields.COPY_SRC.doc = 'The buffer can be the source of a copy operation, e.g. the source of GPUCommandEncoder.copy_buffer_to_buffer().'
fields.COPY_SRC.value = 4

fields.COPY_DST.doc = 'The buffer can be the destination of a copy or write operation, e.g. GPUQueue.write_buffer() or GPUCommandEncoder.clear_buffer().'
fields.COPY_DST.value = 8

fields.INDEX.doc = 'The buffer can be used as an index buffer, see GPURenderCommandsMixin.set_index_buffer().'
fields.INDEX.value = 16

fields.VERTEX.doc = 'The buffer can be used as a vertex buffer, see GPURenderCommandsMixin.set_vertex_buffer().'
fields.VERTEX.value = 32

fields.UNIFORM.doc = 'The buffer can be bound as a uniform buffer, see enums.BufferBindingType.uniform.'
fields.UNIFORM.value = 64

fields.STORAGE.doc = 'The buffer can be bound as a storage buffer, see enums.BufferBindingType.storage.'
fields.STORAGE.value = 128

fields.INDIRECT.doc = 'The buffer can be used to source indirect draw or dispatch parameters, e.g. GPURenderCommandsMixin.draw_indirect().'
fields.INDIRECT.value = 256

fields.QUERY_RESOLVE.doc = 'The buffer can be the destination of GPUCommandEncoder.resolve_query_set().'
fields.QUERY_RESOLVE.value = 512

[flags.MapMode]
doc = '''
Bit flags that specify whether a buffer is mapped for reading or writing.

Used in the mode argument of the GPUBuffer.map_async() method. The mode must match the
flags.BufferUsage of the buffer: READ requires flags.BufferUsage.MAP_READ, WRITE requires flags.BufferUsage.MAP_WRITE.
'''
fields.READ.doc = 'Map the buffer for reading. Requires the buffer to have flags.BufferUsage.MAP_READ.'
fields.READ.value = 1

fields.WRITE.doc = 'Map the buffer for writing. Requires the buffer to have flags.BufferUsage.MAP_WRITE.'
fields.WRITE.value = 2

[flags.TextureUsage]
doc = '''
Bit flags describing how a GPUTexture can be used. Combine them with the bitwise OR operator.

The usage is set when creating the texture (see the usage field of structs.TextureDescriptor).
Texture views can restrict the usage further (see the usage field of structs.TextureViewDescriptor).
'''
fields.COPY_SRC.doc = 'The texture can be the source of a copy operation, e.g. GPUCommandEncoder.copy_texture_to_buffer().'
fields.COPY_SRC.value = 1

fields.COPY_DST.doc = 'The texture can be the destination of a copy or write operation, e.g. GPUQueue.write_texture().'
fields.COPY_DST.value = 2

fields.TEXTURE_BINDING.doc = 'The texture can be bound for sampling in a shader, see structs.TextureBindingLayout.'
fields.TEXTURE_BINDING.value = 4

fields.STORAGE_BINDING.doc = 'The texture can be bound as a storage texture in a shader, see structs.StorageTextureBindingLayout.'
fields.STORAGE_BINDING.value = 8

fields.RENDER_ATTACHMENT.doc = 'The texture can be used as a color or depth/stencil attachment in a render pass, see structs.RenderPassDescriptor.'
fields.RENDER_ATTACHMENT.value = 16

fields.TRANSIENT_ATTACHMENT.doc = 'The texture is a transient attachment: its contents only live for the duration of a render pass and may never be written to memory. Must be combined with RENDER_ATTACHMENT only, and used with enums.StoreOp.discard.'
fields.TRANSIENT_ATTACHMENT.value = 32

[flags.ShaderStage]
doc = '''
Bit flags that specify in which shader stages a resource is visible.

Used in the visibility field of structs.BindGroupLayoutEntry.
'''
fields.VERTEX.doc = 'The vertex shader stage.'
fields.VERTEX.value = 1

fields.FRAGMENT.doc = 'The fragment shader stage.'
fields.FRAGMENT.value = 2

fields.COMPUTE.doc = 'The compute shader stage.'
fields.COMPUTE.value = 4

[flags.ColorWrite]
doc = '''
Bit flags that specify which color channels of a render target are written to.

Used in the write_mask field of structs.ColorTargetState.
'''
fields.RED.doc = 'Write the red channel.'
fields.RED.value = 1

fields.GREEN.doc = 'Write the green channel.'
fields.GREEN.value = 2

fields.BLUE.doc = 'Write the blue channel.'
fields.BLUE.value = 4

fields.ALPHA.doc = 'Write the alpha channel.'
fields.ALPHA.value = 8

fields.ALL.doc = 'Write all channels (RED, GREEN, BLUE and ALPHA).'
fields.ALL.value = 15

# ==== enums =======================================================================================
# ==================================================================================================

[enums.PowerPreference]
doc = '''
Hint for which kind of adapter to select.

Used in the power_preference field of structs.RequestAdapterOptions. This is only a hint;
the implementation may ignore it.
'''
fields.low_power.doc = 'Prefer an adapter that uses little power, e.g. an integrated GPU.'
fields.low_power.value = 'low-power'

fields.high_performance.doc = 'Prefer an adapter with the highest performance, e.g. a discrete GPU.'
fields.high_performance.value = 'high-performance'

[enums.FeatureName]
doc = '''
Names of optional features that an adapter may support and a device may request.

Available features can be inspected via the features property of GPUAdapter. Features
are enabled by listing them in the required_features field of structs.DeviceDescriptor.
The features of the device are available via the features property of GPUDevice.
'''
fields.core_features_and_limits.doc = 'Indicates that the adapter supports the core WebGPU features and limits (as opposed to compatibility mode).'
fields.core_features_and_limits.value = 'core-features-and-limits'

fields.depth_clip_control.doc = 'Allows disabling depth clipping, see the unclipped_depth field of structs.PrimitiveState.'
fields.depth_clip_control.value = 'depth-clip-control'

fields.depth32float_stencil8.doc = 'Enables enums.TextureFormat.depth32float_stencil8.'
fields.depth32float_stencil8.value = 'depth32float-stencil8'

fields.texture_compression_bc.doc = 'Enables the BC (S3TC, RGTC, BPTC) compressed texture formats, e.g. enums.TextureFormat.bc1_rgba_unorm.'
fields.texture_compression_bc.value = 'texture-compression-bc'

fields.texture_compression_bc_sliced_d3.doc = 'Allows the BC compressed formats to be used with enums.TextureDimension.d3 textures. Requires enums.FeatureName.texture_compression_bc.'
fields.texture_compression_bc_sliced_d3.value = 'texture-compression-bc-sliced-3d'

fields.texture_compression_etc2.doc = 'Enables the ETC2 and EAC compressed texture formats, e.g. enums.TextureFormat.etc2_rgb8unorm.'
fields.texture_compression_etc2.value = 'texture-compression-etc2'

fields.texture_compression_astc.doc = 'Enables the ASTC compressed texture formats, e.g. enums.TextureFormat.astc_4x4_unorm.'
fields.texture_compression_astc.value = 'texture-compression-astc'

fields.texture_compression_astc_sliced_d3.doc = 'Allows the ASTC compressed formats to be used with enums.TextureDimension.d3 textures. Requires enums.FeatureName.texture_compression_astc.'
fields.texture_compression_astc_sliced_d3.value = 'texture-compression-astc-sliced-3d'

fields.timestamp_query.doc = 'Enables timestamp queries, see enums.QueryType.timestamp and structs.RenderPassTimestampWrites.'
fields.timestamp_query.value = 'timestamp-query'

fields.indirect_first_instance.doc = 'Allows a non-zero first_instance in indirect draw commands, e.g. GPURenderCommandsMixin.draw_indirect().'
fields.indirect_first_instance.value = 'indirect-first-instance'

fields.shader_f16.doc = 'Allows the use of the f16 type in WGSL shaders (the enable f16 directive).'
fields.shader_f16.value = 'shader-f16'

fields.rg11b10ufloat_renderable.doc = 'Allows enums.TextureFormat.rg11b10ufloat to be used as a render attachment, with blending and multisampling.'
fields.rg11b10ufloat_renderable.value = 'rg11b10ufloat-renderable'

fields.bgra8unorm_storage.doc = 'Allows enums.TextureFormat.bgra8unorm to be used as a storage texture.'
fields.bgra8unorm_storage.value = 'bgra8unorm-storage'

fields.float32_filterable.doc = 'Allows 32-bit float textures to be filtered, i.e. used with a filtering sampler.'
fields.float32_filterable.value = 'float32-filterable'

fields.float32_blendable.doc = 'Allows 32-bit float color attachments to be used with blending.'
fields.float32_blendable.value = 'float32-blendable'

fields.clip_distances.doc = 'Allows the clip_distances built-in in WGSL vertex shaders, for user-defined clip planes.'
fields.clip_distances.value = 'clip-distances'

fields.dual_source_blending.doc = 'Allows blending with a second fragment shader output, see enums.BlendFactor.src1.'
fields.dual_source_blending.value = 'dual-source-blending'

fields.subgroups.doc = 'Allows the use of subgroup operations in WGSL shaders.'
fields.subgroups.value = 'subgroups'

fields.texture_formats_tier1.doc = 'Enables additional texture format capabilities, including the 16-bit normalized formats (e.g. enums.TextureFormat.r16unorm), and more storage and render support for existing formats.'
fields.texture_formats_tier1.value = 'texture-formats-tier1'

fields.texture_formats_tier2.doc = 'Enables further texture format capabilities, such as read-write storage access for more formats. Requires enums.FeatureName.texture_formats_tier1.'
fields.texture_formats_tier2.value = 'texture-formats-tier2'

fields.primitive_index.doc = 'Allows the primitive_index built-in in WGSL fragment shaders.'
fields.primitive_index.value = 'primitive-index'

fields.texture_component_swizzle.doc = 'Allows swizzling the components of a texture view, see the swizzle field of structs.TextureViewDescriptor.'
fields.texture_component_swizzle.value = 'texture-component-swizzle'

[enums.BufferMapState]
doc = '''
The mapping state of a GPUBuffer, available via the map_state property of GPUBuffer.
'''
fields.unmapped.doc = 'The buffer is not mapped; it can be used by the GPU.'
fields.unmapped.value = 'unmapped'

fields.pending.doc = 'A GPUBuffer.map_async() call is in progress but has not yet completed.'
fields.pending.value = 'pending'

fields.mapped.doc = 'The buffer is mapped and its memory can be accessed using GPUBuffer.get_mapped_range().'
fields.mapped.value = 'mapped'

[enums.TextureDimension]
doc = '''
The dimensionality of a GPUTexture.

Used in the dimension field of structs.TextureDescriptor.
'''
fields.d1.doc = 'A one-dimensional texture, with only a width.'
fields.d1.value = '1d'

fields.d2.doc = 'A two-dimensional texture, with width and height. Also used for 2D array textures and cube maps (via layers).'
fields.d2.value = '2d'

fields.d3.doc = 'A three-dimensional (volume) texture, with width, height and depth.'
fields.d3.value = '3d'

[enums.TextureViewDimension]
doc = '''
The dimensionality of a GPUTextureView, i.e. how a texture is interpreted when bound to a shader.

Used in the dimension field of structs.TextureViewDescriptor and the view_dimension field of
structs.TextureBindingLayout and structs.StorageTextureBindingLayout.
'''
fields.d1.doc = 'A one-dimensional view; corresponds to texture_1d in WGSL.'
fields.d1.value = '1d'

fields.d2.doc = 'A two-dimensional view of a single layer; corresponds to texture_2d in WGSL.'
fields.d2.value = '2d'

fields.d2_array.doc = 'A view of an array of 2D layers; corresponds to texture_2d_array in WGSL.'
fields.d2_array.value = '2d-array'

fields.cube.doc = 'A cube map view consisting of six 2D layers; corresponds to texture_cube in WGSL.'
fields.cube.value = 'cube'

fields.cube_array.doc = 'A view of an array of cube maps (a multiple of six layers); corresponds to texture_cube_array in WGSL.'
fields.cube_array.value = 'cube-array'

fields.d3.doc = 'A three-dimensional view; corresponds to texture_3d in WGSL.'
fields.d3.value = '3d'

[enums.TextureAspect]
doc = '''
Which aspect (part) of a texture a view or copy operation refers to.

This is mostly relevant for depth-stencil formats, which have separate depth and stencil aspects.
'''
fields.all.doc = 'All available aspects of the texture format.'
fields.all.value = 'all'

fields.stencil_only.doc = 'Only the stencil aspect of a depth-stencil format.'
fields.stencil_only.value = 'stencil-only'

fields.depth_only.doc = 'Only the depth aspect of a depth-stencil format.'
fields.depth_only.value = 'depth-only'

[enums.TextureFormat]
doc = '''
The pixel format of a GPUTexture.

Names are of the form: channels, bit size per channel, and a type suffix.
The suffixes mean: unorm = unsigned normalized (0..1), snorm = signed normalized (-1..1),
uint/sint = unsigned/signed integer, float = floating point, and srgb = the color
is stored in sRGB and automatically converted to linear when sampled (and back when written).
Some formats require a feature (see enums.FeatureName), and not all formats can be used with all usages (see flags.TextureUsage).
'''
fields.r8unorm.doc = 'One channel (red), 8-bit unsigned normalized.'
fields.r8unorm.value = 'r8unorm'

fields.r8snorm.doc = 'One channel (red), 8-bit signed normalized.'
fields.r8snorm.value = 'r8snorm'

fields.r8uint.doc = 'One channel (red), 8-bit unsigned integer.'
fields.r8uint.value = 'r8uint'

fields.r8sint.doc = 'One channel (red), 8-bit signed integer.'
fields.r8sint.value = 'r8sint'

fields.r16unorm.doc = 'One channel (red), 16-bit unsigned normalized. Requires enums.FeatureName.texture_formats_tier1.'
fields.r16unorm.value = 'r16unorm'

fields.r16snorm.doc = 'One channel (red), 16-bit signed normalized. Requires enums.FeatureName.texture_formats_tier1.'
fields.r16snorm.value = 'r16snorm'

fields.r16uint.doc = 'One channel (red), 16-bit unsigned integer.'
fields.r16uint.value = 'r16uint'

fields.r16sint.doc = 'One channel (red), 16-bit signed integer.'
fields.r16sint.value = 'r16sint'

fields.r16float.doc = 'One channel (red), 16-bit floating point.'
fields.r16float.value = 'r16float'

fields.rg8unorm.doc = 'Two channels (red, green), 8-bit unsigned normalized each.'
fields.rg8unorm.value = 'rg8unorm'

fields.rg8snorm.doc = 'Two channels (red, green), 8-bit signed normalized each.'
fields.rg8snorm.value = 'rg8snorm'

fields.rg8uint.doc = 'Two channels (red, green), 8-bit unsigned integer each.'
fields.rg8uint.value = 'rg8uint'

fields.rg8sint.doc = 'Two channels (red, green), 8-bit signed integer each.'
fields.rg8sint.value = 'rg8sint'

fields.r32uint.doc = 'One channel (red), 32-bit unsigned integer.'
fields.r32uint.value = 'r32uint'

fields.r32sint.doc = 'One channel (red), 32-bit signed integer.'
fields.r32sint.value = 'r32sint'

fields.r32float.doc = 'One channel (red), 32-bit floating point.'
fields.r32float.value = 'r32float'

fields.rg16unorm.doc = 'Two channels (red, green), 16-bit unsigned normalized each. Requires enums.FeatureName.texture_formats_tier1.'
fields.rg16unorm.value = 'rg16unorm'

fields.rg16snorm.doc = 'Two channels (red, green), 16-bit signed normalized each. Requires enums.FeatureName.texture_formats_tier1.'
fields.rg16snorm.value = 'rg16snorm'

fields.rg16uint.doc = 'Two channels (red, green), 16-bit unsigned integer each.'
fields.rg16uint.value = 'rg16uint'

fields.rg16sint.doc = 'Two channels (red, green), 16-bit signed integer each.'
fields.rg16sint.value = 'rg16sint'

fields.rg16float.doc = 'Two channels (red, green), 16-bit floating point each.'
fields.rg16float.value = 'rg16float'

fields.rgba8unorm.doc = 'Four channels (red, green, blue, alpha), 8-bit unsigned normalized each.'
fields.rgba8unorm.value = 'rgba8unorm'

fields.rgba8unorm_srgb.doc = 'Four channels (RGBA), 8-bit unsigned normalized each, with sRGB encoding of the color channels.'
fields.rgba8unorm_srgb.value = 'rgba8unorm-srgb'

fields.rgba8snorm.doc = 'Four channels (RGBA), 8-bit signed normalized each.'
fields.rgba8snorm.value = 'rgba8snorm'

fields.rgba8uint.doc = 'Four channels (RGBA), 8-bit unsigned integer each.'
fields.rgba8uint.value = 'rgba8uint'

fields.rgba8sint.doc = 'Four channels (RGBA), 8-bit signed integer each.'
fields.rgba8sint.value = 'rgba8sint'

fields.bgra8unorm.doc = 'Four channels in blue, green, red, alpha order, 8-bit unsigned normalized each. Often the preferred canvas format, see GPU.get_preferred_canvas_format().'
fields.bgra8unorm.value = 'bgra8unorm'

fields.bgra8unorm_srgb.doc = 'Four channels in BGRA order, 8-bit unsigned normalized each, with sRGB encoding of the color channels.'
fields.bgra8unorm_srgb.value = 'bgra8unorm-srgb'

fields.rgb9e5ufloat.doc = 'Packed 32-bit format with three 9-bit unsigned float mantissas (RGB) and a shared 5-bit exponent. Not renderable.'
fields.rgb9e5ufloat.value = 'rgb9e5ufloat'

fields.rgb10a2uint.doc = 'Packed 32-bit format with 10-bit unsigned integer RGB channels and a 2-bit unsigned integer alpha.'
fields.rgb10a2uint.value = 'rgb10a2uint'

fields.rgb10a2unorm.doc = 'Packed 32-bit format with 10-bit unsigned normalized RGB channels and a 2-bit unsigned normalized alpha.'
fields.rgb10a2unorm.value = 'rgb10a2unorm'

fields.rg11b10ufloat.doc = 'Packed 32-bit format with unsigned floating point R and G (11 bits each) and B (10 bits). Renderable only with enums.FeatureName.rg11b10ufloat_renderable.'
fields.rg11b10ufloat.value = 'rg11b10ufloat'

fields.rg32uint.doc = 'Two channels (red, green), 32-bit unsigned integer each.'
fields.rg32uint.value = 'rg32uint'

fields.rg32sint.doc = 'Two channels (red, green), 32-bit signed integer each.'
fields.rg32sint.value = 'rg32sint'

fields.rg32float.doc = 'Two channels (red, green), 32-bit floating point each.'
fields.rg32float.value = 'rg32float'

fields.rgba16unorm.doc = 'Four channels (RGBA), 16-bit unsigned normalized each. Requires enums.FeatureName.texture_formats_tier1.'
fields.rgba16unorm.value = 'rgba16unorm'

fields.rgba16snorm.doc = 'Four channels (RGBA), 16-bit signed normalized each. Requires enums.FeatureName.texture_formats_tier1.'
fields.rgba16snorm.value = 'rgba16snorm'

fields.rgba16uint.doc = 'Four channels (RGBA), 16-bit unsigned integer each.'
fields.rgba16uint.value = 'rgba16uint'

fields.rgba16sint.doc = 'Four channels (RGBA), 16-bit signed integer each.'
fields.rgba16sint.value = 'rgba16sint'

fields.rgba16float.doc = 'Four channels (RGBA), 16-bit floating point each.'
fields.rgba16float.value = 'rgba16float'

fields.rgba32uint.doc = 'Four channels (RGBA), 32-bit unsigned integer each.'
fields.rgba32uint.value = 'rgba32uint'

fields.rgba32sint.doc = 'Four channels (RGBA), 32-bit signed integer each.'
fields.rgba32sint.value = 'rgba32sint'

fields.rgba32float.doc = 'Four channels (RGBA), 32-bit floating point each.'
fields.rgba32float.value = 'rgba32float'

fields.stencil8.doc = 'A stencil-only format with 8 bits per pixel.'
fields.stencil8.value = 'stencil8'

fields.depth16unorm.doc = 'A depth-only format with 16-bit unsigned normalized depth.'
fields.depth16unorm.value = 'depth16unorm'

fields.depth24plus.doc = 'A depth-only format with at least 24 bits of depth. The exact representation is implementation-defined and cannot be copied to a buffer.'
fields.depth24plus.value = 'depth24plus'

fields.depth24plus_stencil8.doc = 'A depth-stencil format with at least 24 bits of depth and 8 bits of stencil. The depth aspect cannot be copied to a buffer.'
fields.depth24plus_stencil8.value = 'depth24plus-stencil8'

fields.depth32float.doc = 'A depth-only format with 32-bit floating point depth.'
