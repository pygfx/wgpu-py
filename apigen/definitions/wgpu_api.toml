[classes.GPURenderPassEncoder.methods.execute_bundles]
doc = '''
Execute pre-recorded GPURenderBundle objects as part of this pass.

Bundles do not inherit the pipeline, bind groups or vertex/index buffers of the pass. After executing bundles (even zero of them),
that state is cleared, not restored, so it needs to be set again.
'''
returns.doc = 'None.'
returns.type = 'None'

args.bundles.doc = 'A list of GPURenderBundle objects to execute, in order.'
args.bundles.type = 'Sequence[GPURenderBundle]'
args.bundles.default = ''

[classes.GPURenderPassEncoder.methods.end]
doc = '''
End the render pass. The encoder can no longer be used afterwards.
'''
args = {}
returns.doc = 'None.'
returns.type = 'None'

# ---- GPURenderCommandsMixin ----------------------------------------------------------------------

[classes.GPURenderCommandsMixin]
doc = '''
A mixin class for objects that record render commands: GPURenderPassEncoder and GPURenderBundleEncoder.

It provides methods to set the pipeline, vertex and index buffers, and to draw.
'''
bases = []
properties = {}

[classes.GPURenderCommandsMixin.methods.set_pipeline]
doc = '''
Set the GPURenderPipeline to use for subsequent draw commands.
'''
returns.doc = 'None.'
returns.type = 'None'

args.pipeline.doc = 'The GPURenderPipeline to use.'
args.pipeline.type = 'GPURenderPipeline'
args.pipeline.default = ''

[classes.GPURenderCommandsMixin.methods.set_index_buffer]
doc = '''
Set the index buffer to use for subsequent indexed draw commands.

The buffer needs flags.BufferUsage.INDEX.
'''
returns.doc = 'None.'
returns.type = 'None'

args.buffer.doc = 'The GPUBuffer that contains the indices.'
args.buffer.type = 'GPUBuffer'
args.buffer.default = ''

args.index_format.doc = 'The data type of the indices, see enums.IndexFormat.'
args.index_format.type = 'enums.IndexFormatEnum'
args.index_format.default = ''

args.offset.doc = 'The offset in bytes in the buffer where the indices start. Defaults to 0.'
args.offset.type = 'int'
args.offset.default = '0'

args.size.doc = 'The size in bytes of the range to use. Defaults to the remainder of the buffer after offset.'
args.size.type = 'int | None'
args.size.default = 'None'

[classes.GPURenderCommandsMixin.methods.set_vertex_buffer]
doc = '''
Set a vertex buffer for the given slot, to be used by subsequent draw commands.

The buffer needs flags.BufferUsage.VERTEX. The layout is defined by the buffers field of structs.VertexState.
'''
returns.doc = 'None.'
returns.type = 'None'

args.slot.doc = 'The index of the vertex buffer slot, matching the index in the buffers field of structs.VertexState.'
args.slot.type = 'int'
args.slot.default = ''

args.buffer.doc = 'The GPUBuffer that contains the vertex data, or None to unset the slot.'
args.buffer.type = 'GPUBuffer'
args.buffer.default = ''

args.offset.doc = 'The offset in bytes in the buffer where the vertex data starts. Defaults to 0.'
args.offset.type = 'int'
args.offset.default = '0'

args.size.doc = 'The size in bytes of the range to use. Defaults to the remainder of the buffer after offset.'
args.size.type = 'int | None'
args.size.default = 'None'

[classes.GPURenderCommandsMixin.methods.draw]
doc = '''
Draw primitives using the current pipeline and vertex buffers.
'''
returns.doc = 'None.'
returns.type = 'None'

args.vertex_count.doc = 'The number of vertices to draw.'
args.vertex_count.type = 'int'
args.vertex_count.default = ''

args.instance_count.doc = 'The number of instances to draw. Defaults to 1.'
args.instance_count.type = 'int'
args.instance_count.default = '1'

args.first_vertex.doc = 'The index of the first vertex to draw (the offset into the vertex buffers, in vertices). Defaults to 0.'
args.first_vertex.type = 'int'
args.first_vertex.default = '0'

args.first_instance.doc = 'The instance index of the first instance to draw. Defaults to 0.'
args.first_instance.type = 'int'
args.first_instance.default = '0'

[classes.GPURenderCommandsMixin.methods.draw_indexed]
doc = '''
Draw primitives using the current pipeline, vertex buffers and index buffer (see set_index_buffer()).
'''
returns.doc = 'None.'
returns.type = 'None'

args.index_count.doc = 'The number of indices to draw.'
args.index_count.type = 'int'
args.index_count.default = ''

args.instance_count.doc = 'The number of instances to draw. Defaults to 1.'
args.instance_count.type = 'int'
args.instance_count.default = '1'

args.first_index.doc = 'The position in the index buffer (in indices, not bytes) where drawing starts. Defaults to 0.'
args.first_index.type = 'int'
args.first_index.default = '0'

args.base_vertex.doc = 'A value added to each index before looking up the vertex. Defaults to 0.'
args.base_vertex.type = 'int'
args.base_vertex.default = '0'

args.first_instance.doc = 'The instance index of the first instance to draw. Defaults to 0.'
args.first_instance.type = 'int'
args.first_instance.default = '0'

[classes.GPURenderCommandsMixin.methods.draw_indirect]
doc = '''
Like draw(), but the parameters are read from a GPUBuffer.

The buffer must have flags.BufferUsage.INDIRECT, and contain a tightly packed block of four 32-bit unsigned integers (16 bytes)
at the given offset: vertex_count, instance_count, first_vertex and first_instance.
A non-zero first_instance requires enums.FeatureName.indirect_first_instance.
'''
returns.doc = 'None.'
returns.type = 'None'

args.indirect_buffer.doc = 'The GPUBuffer that contains the draw parameters.'
args.indirect_buffer.type = 'GPUBuffer'
args.indirect_buffer.default = ''

args.indirect_offset.doc = 'The offset in bytes in the buffer where the parameters start. Must be a multiple of 4.'
args.indirect_offset.type = 'int'
args.indirect_offset.default = ''

[classes.GPURenderCommandsMixin.methods.draw_indexed_indirect]
doc = '''
Like draw_indexed(), but the parameters are read from a GPUBuffer.

The buffer must have flags.BufferUsage.INDIRECT, and contain a tightly packed block of five 32-bit values (20 bytes) at the given offset:
index_count, instance_count, first_index, base_vertex and first_instance.
A non-zero first_instance requires enums.FeatureName.indirect_first_instance.
'''
returns.doc = 'None.'
returns.type = 'None'

args.indirect_buffer.doc = 'The GPUBuffer that contains the draw parameters.'
args.indirect_buffer.type = 'GPUBuffer'
args.indirect_buffer.default = ''

args.indirect_offset.doc = 'The offset in bytes in the buffer where the parameters start. Must be a multiple of 4.'
args.indirect_offset.type = 'int'
args.indirect_offset.default = ''

