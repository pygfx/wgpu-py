args.descriptor.type = 'structs.RenderBundleDescriptorStruct | None'
args.descriptor.default = 'None'

# ---- GPUQueue ------------------------------------------------------------------------------------

[classes.GPUQueue]
doc = '''
The queue on which work is submitted to the GPU.

Each GPUDevice has a default queue, available via the queue property of GPUDevice.
It is used to submit command buffers and to upload data to buffers and textures.
'''
bases = ['GPUObjectBase']
properties = {}

[classes.GPUQueue.methods.submit]
doc = '''
Submit a list of command buffers for execution on the GPU.

Each command buffer can only be submitted once.
'''
returns.doc = 'None.'
returns.type = 'None'

args.command_buffers.doc = 'A list of GPUCommandBuffer objects, executed in order.'
args.command_buffers.type = 'Sequence[GPUCommandBuffer]'
args.command_buffers.default = ''

[classes.GPUQueue.methods.on_submitted_work_done_async]
doc = '''
Wait until all work that was submitted so far has been completed by the GPU.

Resolving also implies completion of earlier GPUBuffer.map_async() calls on buffers last used exclusively on this queue.
'''
args = {}
returns.doc = 'None (awaitable); resolves when the submitted work is done.'
returns.type = 'GPUPromise[None]'

[classes.GPUQueue.methods.on_submitted_work_done_sync]
doc = 'The synchronous variant of on_submitted_work_done_async().'
args = {}
returns.doc = ''
returns.type = 'None'

[classes.GPUQueue.methods.write_buffer]
doc = '''
Write data to a GPUBuffer.

This is a convenient way to upload data. The buffer needs flags.BufferUsage.COPY_DST.
The size of the data to write and the offset must be multiples of 4.
'''
returns.doc = 'None.'
returns.type = 'None'

args.buffer.doc = 'The GPUBuffer to write to.'
args.buffer.type = 'GPUBuffer'
args.buffer.default = ''

args.buffer_offset.doc = 'The offset in bytes in the buffer where the data is written.'
args.buffer_offset.type = 'int'
args.buffer_offset.default = ''

args.data.doc = 'The data to write, as an object that supports the buffer protocol (e.g. bytes or a numpy array).'
args.data.type = 'ArrayLike'
args.data.default = ''

args.data_offset.doc = 'The offset in the data (in elements of the data type, or bytes) where reading starts. Defaults to 0.'
args.data_offset.type = 'int'
args.data_offset.default = '0'

args.size.doc = 'The amount of data to write (in elements of the data type, or bytes). Defaults to the remainder of the data after data_offset.'
args.size.type = 'int | None'
args.size.default = 'None'

[classes.GPUQueue.methods.write_texture]
doc = '''
Write data to a GPUTexture.

This is a convenient way to upload texture data. The texture needs flags.TextureUsage.COPY_DST.
'''
returns.doc = 'None.'
returns.type = 'None'

args.destination.doc = 'A structs.TexelCopyTextureInfo describing the part of the texture to write to.'
args.destination.type = 'structs.TexelCopyTextureInfoStruct'
args.destination.default = ''

args.data.doc = 'The data to write, as an object that supports the buffer protocol (e.g. bytes or a numpy array).'
args.data.type = 'ArrayLike'
args.data.default = ''

args.data_layout.doc = 'A structs.TexelCopyBufferLayout describing the layout of the texel data in data.'
args.data_layout.type = 'structs.TexelCopyBufferLayoutStruct'
args.data_layout.default = ''

args.size.doc = 'A structs.Extent3D (or tuple) with the size of the region to write, in texels.'
args.size.type = 'tuple[int, int, int] | structs.Extent3DStruct'
args.size.default = ''

