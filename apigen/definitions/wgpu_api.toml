Destroy the query set and free its resources.

The query set can no longer be used. Calling this multiple times is allowed.
'''
args = {}
returns.doc = 'None.'
returns.type = 'None'

# ---- GPUCanvasContext ----------------------------------------------------------------------------

[classes.GPUCanvasContext]
doc = '''
The connection between a canvas (or window) and the GPU, used to present rendered images.

Configure it with configure(), then each frame obtain a texture with get_current_texture(),
render to it, and submit the work. The result is presented when the frame ends.
'''
bases = []

[classes.GPUCanvasContext.properties.canvas]
doc = 'The canvas (or window/surface object) that this context belongs to.'
type = 'CanvasLike'

[classes.GPUCanvasContext.properties.physical_size]
doc = 'Get the physical size of the current framebuffer.'
type = 'tuple[int, int]'

[classes.GPUCanvasContext.methods.configure]
doc = '''
Configure the context for use with a device, so that textures can be obtained from it.

Calling this again replaces the previous configuration. It also clears the drawing buffer to transparent black.
Use get_configuration() to detect support for optional configuration members.
'''
returns.doc = 'None.'
returns.type = 'None'

args.configuration.doc = 'A structs.CanvasConfiguration with the device, format and other settings.'
args.configuration.type = 'structs.CanvasConfigurationStruct'
args.configuration.default = ''

[classes.GPUCanvasContext.methods.unconfigure]
doc = '''
Remove the configuration and destroy any textures produced while configured.

After this, get_current_texture() cannot be used until the context is configured again.
'''
args = {}
returns.doc = 'None.'
returns.type = 'None'

[classes.GPUCanvasContext.methods.get_configuration]
doc = '''
Get the current configuration of the context, or None if it is not configured.

This is mainly useful for feature detection of optional members of structs.CanvasConfiguration; for supported members it returns the originally supplied values.
'''
args = {}
returns.doc = 'The structs.CanvasConfiguration that was last passed to configure(), or None if the context is not configured.'
returns.type = 'structs.CanvasConfigurationStruct'

[classes.GPUCanvasContext.methods.get_current_texture]
doc = '''
Get the GPUTexture to render to for the current frame.

The texture has the size of the canvas, and is the texture that will be composited to the canvas next. The same GPUTexture object is returned
until the frame is presented (even if it was destroyed or failed validation); a new one is returned for the next frame.
'''
args = {}
returns.doc = 'A GPUTexture.'
returns.type = 'GPUTexture'

[classes.GPUCanvasContext.methods.set_physical_size]
doc = 'Set the current framebuffer physical size.'
returns.type = 'None'

args.width.doc = 'The new width of the framebuffer.'
args.width.type = 'int'
args.width.default = ''

args.height.doc = 'The new height of the framebuffer.'
args.height.type = 'int'
args.height.default = ''

[classes.GPUCanvasContext.methods.get_preferred_format]
doc = 'Get the preferred surface texture format.'
returns.type = 'enums.TextureFormat'

args.adapter.type = 'GPUAdapter'
args.adapter.default = ''

[classes.GPUCanvasContext.methods.present]
doc = 'Present what has been drawn to the current texture, by compositing it to the canvas.'
args = {}
returns.type = 'None'

