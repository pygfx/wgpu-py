may alias another attachment or any resource used inside the render pass.
"""
fields.occlusion_query_set.doc = """The {@link GPUQuerySet} value defines where the occlusion query results will be stored for this pass."""
fields.timestamp_writes.doc = """Defines which timestamp values will be written for this pass, and where to write them to."""
fields.max_draw_count.doc = """The maximum number of draw calls that will be done in the render pass. Used by some
implementations to size work injected before the render pass. Keeping the default value
is a good default, unless it is known that more draw calls will be done.
"""

[structs.RenderPassColorAttachment]
doc = """Describes a color attachment of a render pass.

Used in the color_attachments field of structs.RenderPassDescriptor.
"""
fields.view.doc = """Describes the texture subresource that will be output to for this color attachment.
The subresource is determined by calling [$get as texture view$]({@link GPURenderPassColorAttachment#view}).
"""
fields.depth_slice.doc = """Indicates the depth slice index of {@link GPUTextureViewDimension} `"3d"` {@link GPURenderPassColorAttachment#view}
that will be output to for this color attachment.
"""
fields.resolve_target.doc = """Describes the texture subresource that will receive the resolved output for this color
