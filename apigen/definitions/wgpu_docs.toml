fields.stencil_write_mask.doc = """Bitmask controlling which {@link GPURenderPassDescriptor#depthStencilAttachment} stencil value
bits are written to when performing stencil operations.
"""
fields.depth_bias.doc = """Constant depth bias added to each triangle fragment. See [$biased fragment depth$] for details."""
fields.depth_bias_slope_scale.doc = """Depth bias that scales with the triangle fragment’s slope. See [$biased fragment depth$] for details."""
fields.depth_bias_clamp.doc = """The maximum depth bias of a triangle fragment. See [$biased fragment depth$] for details."""

[structs.StencilFaceState]
doc = """Describes the stencil operations for one face (front or back) of primitives.

