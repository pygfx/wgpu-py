fields.primitive.doc = """Describes the primitive-related properties of the pipeline."""
fields.depth_stencil.doc = """Describes the optional depth-stencil properties, including the testing, operations, and bias."""
fields.multisample.doc = """Describes the multi-sampling properties of the pipeline."""
fields.fragment.doc = """Describes the fragment shader entry point of the pipeline and its output colors. If
not map/exist|provided, the {@link https://www.w3.org/TR/webgpu/#no-color-output} mode is enabled.
"""

[structs.PrimitiveState]
doc = """Describes how a render pipeline assembles and rasterizes primitives.

Used in the primitive field of structs.RenderPipelineDescriptor.
"""
fields.topology.doc = """The type of primitive to be constructed from the vertex inputs."""
fields.strip_index_format.doc = """For pipelines with strip topologies
({@link GPUPrimitiveTopology} `"line-strip"` or {@link GPUPrimitiveTopology} `"triangle-strip"`),
this determines the index buffer format and primitive restart value
({@link GPUIndexFormat} `"uint16"`/`0xFFFF` or {@link GPUIndexFormat} `"uint32"`/`0xFFFFFFFF`).
It is not allowed on pipelines with non-strip topologies.
Note: Some implementations require knowledge of the primitive restart value to compile
pipeline state objects.
To use a strip-topology pipeline with an indexed draw call
({@link GPURenderCommandsMixin#drawIndexed()} or {@link GPURenderCommandsMixin#drawIndexedIndirect}),
this must be set, and it must match the index buffer format used with the draw call
(set in {@link GPURenderCommandsMixin#setIndexBuffer}).
See {@link https://www.w3.org/TR/webgpu/#primitive-assembly} for additional details.
"""
fields.front_face.doc = """Defines which polygons are considered front-facing."""
fields.cull_mode.doc = """Defines which polygon orientation will be culled, if any."""
fields.unclipped_depth.doc = """If true, indicates that depth clipping is disabled.
Requires the {@link GPUFeatureName} `"depth-clip-control"` feature to be enabled.
"""

[structs.MultisampleState]
doc = """Describes the multisampling of a render pipeline.

Used in the multisample field of structs.RenderPipelineDescriptor.
"""
fields.count.doc = """Number of samples per pixel. This {@link GPURenderPipeline} will be compatible only
with attachment textures ({@link GPURenderPassDescriptor#colorAttachments}
and {@link GPURenderPassDescriptor#depthStencilAttachment})
with matching {@link GPUTextureDescriptor#sampleCount}s.
"""
fields.mask.doc = """Mask determining which samples are written to."""
fields.alpha_to_coverage_enabled.doc = """When `true` indicates that a fragment's alpha channel should be used to generate a sample
coverage mask.
