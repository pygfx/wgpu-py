# wgpu_docs.toml
# Documentation for the wgpu-py API, composed from 'docs_ai.toml', 'docs_ts.toml', and 'docs_dev.toml'

# --------------------------------------------------------------------------------
# --------------------------------------------------------------------------------
# --------------------------------------------------------------------------------
[flags]

[flags.BufferUsage]
doc = """Bit flags describing how a GPUBuffer can be used. Combine them with the bitwise OR operator.

The usage is set when creating the buffer (see the usage field of structs.BufferDescriptor) and cannot be changed afterwards.
Using a buffer in a way that was not declared here results in a validation error.
"""
fields.MAP_READ.doc = """The buffer can be mapped for reading by the CPU (see flags.MapMode.READ). Can only be combined with COPY_DST."""
fields.MAP_WRITE.doc = """The buffer can be mapped for writing by the CPU (see flags.MapMode.WRITE). Can only be combined with COPY_SRC."""
fields.COPY_SRC.doc = """The buffer can be the source of a copy operation, e.g. the source of GPUCommandEncoder.copy_buffer_to_buffer()."""
fields.COPY_DST.doc = """The buffer can be the destination of a copy or write operation, e.g. GPUQueue.write_buffer() or GPUCommandEncoder.clear_buffer()."""
fields.INDEX.doc = """The buffer can be used as an index buffer, see GPURenderCommandsMixin.set_index_buffer()."""
fields.VERTEX.doc = """The buffer can be used as a vertex buffer, see GPURenderCommandsMixin.set_vertex_buffer()."""
fields.UNIFORM.doc = """The buffer can be bound as a uniform buffer, see enums.BufferBindingType.uniform."""
fields.STORAGE.doc = """The buffer can be bound as a storage buffer, see enums.BufferBindingType.storage."""
fields.INDIRECT.doc = """The buffer can be used to source indirect draw or dispatch parameters, e.g. GPURenderCommandsMixin.draw_indirect()."""
fields.QUERY_RESOLVE.doc = """The buffer can be the destination of GPUCommandEncoder.resolve_query_set()."""

[flags.MapMode]
doc = """Bit flags that specify whether a buffer is mapped for reading or writing.

Used in the mode argument of the GPUBuffer.map_async() method. The mode must match the
flags.BufferUsage of the buffer: READ requires flags.BufferUsage.MAP_READ, WRITE requires flags.BufferUsage.MAP_WRITE.
"""
fields.READ.doc = """Map the buffer for reading. Requires the buffer to have flags.BufferUsage.MAP_READ."""
fields.WRITE.doc = """Map the buffer for writing. Requires the buffer to have flags.BufferUsage.MAP_WRITE."""

[flags.TextureUsage]
doc = """Bit flags describing how a GPUTexture can be used. Combine them with the bitwise OR operator.

The usage is set when creating the texture (see the usage field of structs.TextureDescriptor).
Texture views can restrict the usage further (see the usage field of structs.TextureViewDescriptor).
"""
fields.COPY_SRC.doc = """The texture can be the source of a copy operation, e.g. GPUCommandEncoder.copy_texture_to_buffer()."""
fields.COPY_DST.doc = """The texture can be the destination of a copy or write operation, e.g. GPUQueue.write_texture()."""
fields.TEXTURE_BINDING.doc = """The texture can be bound for sampling in a shader, see structs.TextureBindingLayout."""
fields.STORAGE_BINDING.doc = """The texture can be bound as a storage texture in a shader, see structs.StorageTextureBindingLayout."""
fields.RENDER_ATTACHMENT.doc = """The texture can be used as a color or depth/stencil attachment in a render pass, see structs.RenderPassDescriptor."""
fields.TRANSIENT_ATTACHMENT.doc = """The texture is a transient attachment: its contents only live for the duration of a render pass and may never be written to memory. Must be combined with RENDER_ATTACHMENT only, and used with enums.StoreOp.discard."""

[flags.ShaderStage]
doc = """Bit flags that specify in which shader stages a resource is visible.

Used in the visibility field of structs.BindGroupLayoutEntry.
"""
fields.VERTEX.doc = """The vertex shader stage."""
fields.FRAGMENT.doc = """The fragment shader stage."""
fields.COMPUTE.doc = """The compute shader stage."""

[flags.ColorWrite]
doc = """Bit flags that specify which color channels of a render target are written to.

Used in the write_mask field of structs.ColorTargetState.
"""
fields.RED.doc = """Write the red channel."""
fields.GREEN.doc = """Write the green channel."""
fields.BLUE.doc = """Write the blue channel."""
fields.ALPHA.doc = """Write the alpha channel."""
fields.ALL.doc = """Write all channels (RED, GREEN, BLUE and ALPHA)."""

# --------------------------------------------------------------------------------
# --------------------------------------------------------------------------------
# --------------------------------------------------------------------------------
[enums]

[enums.PowerPreference]
doc = """Hint for which kind of adapter to select.

Used in the power_preference field of structs.RequestAdapterOptions. This is only a hint;
the implementation may ignore it.
"""
fields.low_power.doc = """Prefer an adapter that uses little power, e.g. an integrated GPU."""
fields.high_performance.doc = """Prefer an adapter with the highest performance, e.g. a discrete GPU."""

[enums.FeatureName]
doc = """Names of optional features that an adapter may support and a device may request.

Available features can be inspected via the features property of GPUAdapter. Features
are enabled by listing them in the required_features field of structs.DeviceDescriptor.
The features of the device are available via the features property of GPUDevice.
"""
fields.core_features_and_limits.doc = """Indicates that the adapter supports the core WebGPU features and limits (as opposed to compatibility mode)."""
fields.depth_clip_control.doc = """Allows disabling depth clipping, see the unclipped_depth field of structs.PrimitiveState."""
fields.depth32float_stencil8.doc = """Enables enums.TextureFormat.depth32float_stencil8."""
fields.texture_compression_bc.doc = """Enables the BC (S3TC, RGTC, BPTC) compressed texture formats, e.g. enums.TextureFormat.bc1_rgba_unorm."""
fields.texture_compression_bc_sliced_d3.doc = """Allows the BC compressed formats to be used with enums.TextureDimension.d3 textures. Requires texture_compression_bc."""
fields.texture_compression_etc2.doc = """Enables the ETC2 and EAC compressed texture formats, e.g. enums.TextureFormat.etc2_rgb8unorm."""
fields.texture_compression_astc.doc = """Enables the ASTC compressed texture formats, e.g. enums.TextureFormat.astc_4x4_unorm."""
fields.texture_compression_astc_sliced_d3.doc = """Allows the ASTC compressed formats to be used with enums.TextureDimension.d3 textures. Requires texture_compression_astc."""
fields.timestamp_query.doc = """Enables timestamp queries, see enums.QueryType.timestamp and structs.RenderPassTimestampWrites."""
fields.indirect_first_instance.doc = """Allows a non-zero first_instance in indirect draw commands, e.g. GPURenderCommandsMixin.draw_indirect()."""
fields.shader_f16.doc = """Allows the use of the f16 type in WGSL shaders (the enable f16 directive)."""
fields.rg11b10ufloat_renderable.doc = """Allows enums.TextureFormat.rg11b10ufloat to be used as a render attachment, with blending and multisampling."""
fields.bgra8unorm_storage.doc = """Allows enums.TextureFormat.bgra8unorm to be used as a storage texture."""
fields.float32_filterable.doc = """Allows 32-bit float textures to be filtered, i.e. used with a filtering sampler."""
fields.float32_blendable.doc = """Allows 32-bit float color attachments to be used with blending."""
fields.clip_distances.doc = """Allows the clip_distances built-in in WGSL vertex shaders, for user-defined clip planes."""
fields.dual_source_blending.doc = """Allows blending with a second fragment shader output, see enums.BlendFactor.src1."""
fields.subgroups.doc = """Allows the use of subgroup operations in WGSL shaders."""
fields.texture_formats_tier1.doc = """Enables additional texture format capabilities, including the 16-bit normalized formats (e.g. enums.TextureFormat.r16unorm), and more storage and render support for existing formats."""
fields.texture_formats_tier2.doc = """Enables further texture format capabilities, such as read-write storage access for more formats. Requires texture_formats_tier1."""
fields.primitive_index.doc = """Allows the primitive_index built-in in WGSL fragment shaders."""
fields.texture_component_swizzle.doc = """Allows swizzling the components of a texture view, see the swizzle field of structs.TextureViewDescriptor."""

[enums.BufferMapState]
doc = """The mapping state of a GPUBuffer, available via the map_state property of GPUBuffer.
"""
fields.unmapped.doc = """The buffer is not mapped; it can be used by the GPU."""
fields.pending.doc = """A GPUBuffer.map_async() call is in progress but has not yet completed."""
fields.mapped.doc = """The buffer is mapped and its memory can be accessed using GPUBuffer.get_mapped_range()."""

[enums.TextureDimension]
doc = """The dimensionality of a GPUTexture.

Used in the dimension field of structs.TextureDescriptor.
"""
fields.d1.doc = """A one-dimensional texture, with only a width."""
fields.d2.doc = """A two-dimensional texture, with width and height. Also used for 2D array textures and cube maps (via layers)."""
fields.d3.doc = """A three-dimensional (volume) texture, with width, height and depth."""

[enums.TextureViewDimension]
doc = """The dimensionality of a GPUTextureView, i.e. how a texture is interpreted when bound to a shader.

Used in the dimension field of structs.TextureViewDescriptor and the view_dimension field of
structs.TextureBindingLayout and structs.StorageTextureBindingLayout.
"""
fields.d1.doc = """A one-dimensional view; corresponds to texture_1d in WGSL."""
fields.d2.doc = """A two-dimensional view of a single layer; corresponds to texture_2d in WGSL."""
fields.d2_array.doc = """A view of an array of 2D layers; corresponds to texture_2d_array in WGSL."""
fields.cube.doc = """A cube map view consisting of six 2D layers; corresponds to texture_cube in WGSL."""
fields.cube_array.doc = """A view of an array of cube maps (a multiple of six layers); corresponds to texture_cube_array in WGSL."""
fields.d3.doc = """A three-dimensional view; corresponds to texture_3d in WGSL."""

[enums.TextureAspect]
doc = """Which aspect (part) of a texture a view or copy operation refers to.

This is mostly relevant for depth-stencil formats, which have separate depth and stencil aspects.
"""
fields.all.doc = """All available aspects of the texture format."""
fields.stencil_only.doc = """Only the stencil aspect of a depth-stencil format."""
fields.depth_only.doc = """Only the depth aspect of a depth-stencil format."""

[enums.TextureFormat]
doc = """The pixel format of a GPUTexture.

Names are of the form: channels, bit size per channel, and a type suffix.
The suffixes mean: unorm = unsigned normalized (0..1), snorm = signed normalized (-1..1),
uint/sint = unsigned/signed integer, float = floating point, and srgb = the color
is stored in sRGB and automatically converted to linear when sampled (and back when written).
Some formats require a feature (see enums.FeatureName), and not all formats can be used with all usages (see flags.TextureUsage).
"""
fields.r8unorm.doc = """One channel (red), 8-bit unsigned normalized."""
fields.r8snorm.doc = """One channel (red), 8-bit signed normalized."""
fields.r8uint.doc = """One channel (red), 8-bit unsigned integer."""
fields.r8sint.doc = """One channel (red), 8-bit signed integer."""
fields.r16unorm.doc = """One channel (red), 16-bit unsigned normalized. Requires feature texture_formats_tier1."""
fields.r16snorm.doc = """One channel (red), 16-bit signed normalized. Requires feature texture_formats_tier1."""
fields.r16uint.doc = """One channel (red), 16-bit unsigned integer."""
fields.r16sint.doc = """One channel (red), 16-bit signed integer."""
fields.r16float.doc = """One channel (red), 16-bit floating point."""
fields.rg8unorm.doc = """Two channels (red, green), 8-bit unsigned normalized each."""
fields.rg8snorm.doc = """Two channels (red, green), 8-bit signed normalized each."""
fields.rg8uint.doc = """Two channels (red, green), 8-bit unsigned integer each."""
fields.rg8sint.doc = """Two channels (red, green), 8-bit signed integer each."""
fields.r32uint.doc = """One channel (red), 32-bit unsigned integer."""
fields.r32sint.doc = """One channel (red), 32-bit signed integer."""
fields.r32float.doc = """One channel (red), 32-bit floating point."""
fields.rg16unorm.doc = """Two channels (red, green), 16-bit unsigned normalized each. Requires feature texture_formats_tier1."""
fields.rg16snorm.doc = """Two channels (red, green), 16-bit signed normalized each. Requires feature texture_formats_tier1."""
fields.rg16uint.doc = """Two channels (red, green), 16-bit unsigned integer each."""
fields.rg16sint.doc = """Two channels (red, green), 16-bit signed integer each."""
fields.rg16float.doc = """Two channels (red, green), 16-bit floating point each."""
fields.rgba8unorm.doc = """Four channels (red, green, blue, alpha), 8-bit unsigned normalized each."""
fields.rgba8unorm_srgb.doc = """Four channels (RGBA), 8-bit unsigned normalized each, with sRGB encoding of the color channels."""
fields.rgba8snorm.doc = """Four channels (RGBA), 8-bit signed normalized each."""
fields.rgba8uint.doc = """Four channels (RGBA), 8-bit unsigned integer each."""
fields.rgba8sint.doc = """Four channels (RGBA), 8-bit signed integer each."""
fields.bgra8unorm.doc = """Four channels in blue, green, red, alpha order, 8-bit unsigned normalized each. Often the preferred canvas format, see GPU.get_preferred_canvas_format()."""
fields.bgra8unorm_srgb.doc = """Four channels in BGRA order, 8-bit unsigned normalized each, with sRGB encoding of the color channels."""
fields.rgb9e5ufloat.doc = """Packed 32-bit format with three 9-bit unsigned float mantissas (RGB) and a shared 5-bit exponent. Not renderable."""
fields.rgb10a2uint.doc = """Packed 32-bit format with 10-bit unsigned integer RGB channels and a 2-bit unsigned integer alpha."""
fields.rgb10a2unorm.doc = """Packed 32-bit format with 10-bit unsigned normalized RGB channels and a 2-bit unsigned normalized alpha."""
fields.rg11b10ufloat.doc = """Packed 32-bit format with unsigned floating point R and G (11 bits each) and B (10 bits). Renderable only with feature rg11b10ufloat_renderable."""
fields.rg32uint.doc = """Two channels (red, green), 32-bit unsigned integer each."""
fields.rg32sint.doc = """Two channels (red, green), 32-bit signed integer each."""
fields.rg32float.doc = """Two channels (red, green), 32-bit floating point each."""
fields.rgba16unorm.doc = """Four channels (RGBA), 16-bit unsigned normalized each. Requires feature texture_formats_tier1."""
fields.rgba16snorm.doc = """Four channels (RGBA), 16-bit signed normalized each. Requires feature texture_formats_tier1."""
fields.rgba16uint.doc = """Four channels (RGBA), 16-bit unsigned integer each."""
fields.rgba16sint.doc = """Four channels (RGBA), 16-bit signed integer each."""
fields.rgba16float.doc = """Four channels (RGBA), 16-bit floating point each."""
fields.rgba32uint.doc = """Four channels (RGBA), 32-bit unsigned integer each."""
fields.rgba32sint.doc = """Four channels (RGBA), 32-bit signed integer each."""
fields.rgba32float.doc = """Four channels (RGBA), 32-bit floating point each."""
fields.stencil8.doc = """A stencil-only format with 8 bits per pixel."""
fields.depth16unorm.doc = """A depth-only format with 16-bit unsigned normalized depth."""
fields.depth24plus.doc = """A depth-only format with at least 24 bits of depth. The exact representation is implementation-defined and cannot be copied to a buffer."""
fields.depth24plus_stencil8.doc = """A depth-stencil format with at least 24 bits of depth and 8 bits of stencil. The depth aspect cannot be copied to a buffer."""
fields.depth32float.doc = """A depth-only format with 32-bit floating point depth."""
fields.depth32float_stencil8.doc = """A depth-stencil format with 32-bit floating point depth and 8 bits of stencil. Requires feature depth32float_stencil8."""
fields.bc1_rgba_unorm.doc = """BC1 (DXT1) compressed RGBA, unsigned normalized. 4x4 blocks of 8 bytes. Requires feature texture_compression_bc."""
fields.bc1_rgba_unorm_srgb.doc = """BC1 (DXT1) compressed RGBA with sRGB encoding. Requires feature texture_compression_bc."""
fields.bc2_rgba_unorm.doc = """BC2 (DXT3) compressed RGBA, unsigned normalized. 4x4 blocks of 16 bytes. Requires feature texture_compression_bc."""
fields.bc2_rgba_unorm_srgb.doc = """BC2 (DXT3) compressed RGBA with sRGB encoding. Requires feature texture_compression_bc."""
fields.bc3_rgba_unorm.doc = """BC3 (DXT5) compressed RGBA, unsigned normalized. 4x4 blocks of 16 bytes. Requires feature texture_compression_bc."""
fields.bc3_rgba_unorm_srgb.doc = """BC3 (DXT5) compressed RGBA with sRGB encoding. Requires feature texture_compression_bc."""
fields.bc4_r_unorm.doc = """BC4 compressed single channel, unsigned normalized. Requires feature texture_compression_bc."""
fields.bc4_r_snorm.doc = """BC4 compressed single channel, signed normalized. Requires feature texture_compression_bc."""
fields.bc5_rg_unorm.doc = """BC5 compressed two channels, unsigned normalized. Requires feature texture_compression_bc."""
fields.bc5_rg_snorm.doc = """BC5 compressed two channels, signed normalized. Requires feature texture_compression_bc."""
fields.bc6h_rgb_ufloat.doc = """BC6H compressed HDR RGB, unsigned float. Requires feature texture_compression_bc."""
fields.bc6h_rgb_float.doc = """BC6H compressed HDR RGB, signed float. Requires feature texture_compression_bc."""
fields.bc7_rgba_unorm.doc = """BC7 compressed RGBA, unsigned normalized. Requires feature texture_compression_bc."""
fields.bc7_rgba_unorm_srgb.doc = """BC7 compressed RGBA with sRGB encoding. Requires feature texture_compression_bc."""
fields.etc2_rgb8unorm.doc = """ETC2 compressed RGB, 8 bits per channel, unsigned normalized. Requires feature texture_compression_etc2."""
fields.etc2_rgb8unorm_srgb.doc = """ETC2 compressed RGB with sRGB encoding. Requires feature texture_compression_etc2."""
fields.etc2_rgb8a1unorm.doc = """ETC2 compressed RGB with 1-bit punch-through alpha, unsigned normalized. Requires feature texture_compression_etc2."""
fields.etc2_rgb8a1unorm_srgb.doc = """ETC2 compressed RGB with 1-bit alpha and sRGB encoding. Requires feature texture_compression_etc2."""
fields.etc2_rgba8unorm.doc = """ETC2 compressed RGBA, 8 bits per channel, unsigned normalized. Requires feature texture_compression_etc2."""
fields.etc2_rgba8unorm_srgb.doc = """ETC2 compressed RGBA with sRGB encoding. Requires feature texture_compression_etc2."""
fields.eac_r11unorm.doc = """EAC compressed single channel, 11-bit unsigned normalized. Requires feature texture_compression_etc2."""
fields.eac_r11snorm.doc = """EAC compressed single channel, 11-bit signed normalized. Requires feature texture_compression_etc2."""
fields.eac_rg11unorm.doc = """EAC compressed two channels, 11-bit unsigned normalized each. Requires feature texture_compression_etc2."""
fields.eac_rg11snorm.doc = """EAC compressed two channels, 11-bit signed normalized each. Requires feature texture_compression_etc2."""
fields.astc_4x4_unorm.doc = """ASTC compressed RGBA with 4x4 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_4x4_unorm_srgb.doc = """ASTC compressed RGBA with 4x4 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_5x4_unorm.doc = """ASTC compressed RGBA with 5x4 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_5x4_unorm_srgb.doc = """ASTC compressed RGBA with 5x4 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_5x5_unorm.doc = """ASTC compressed RGBA with 5x5 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_5x5_unorm_srgb.doc = """ASTC compressed RGBA with 5x5 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_6x5_unorm.doc = """ASTC compressed RGBA with 6x5 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_6x5_unorm_srgb.doc = """ASTC compressed RGBA with 6x5 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_6x6_unorm.doc = """ASTC compressed RGBA with 6x6 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_6x6_unorm_srgb.doc = """ASTC compressed RGBA with 6x6 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_8x5_unorm.doc = """ASTC compressed RGBA with 8x5 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_8x5_unorm_srgb.doc = """ASTC compressed RGBA with 8x5 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_8x6_unorm.doc = """ASTC compressed RGBA with 8x6 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_8x6_unorm_srgb.doc = """ASTC compressed RGBA with 8x6 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_8x8_unorm.doc = """ASTC compressed RGBA with 8x8 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_8x8_unorm_srgb.doc = """ASTC compressed RGBA with 8x8 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_10x5_unorm.doc = """ASTC compressed RGBA with 10x5 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_10x5_unorm_srgb.doc = """ASTC compressed RGBA with 10x5 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_10x6_unorm.doc = """ASTC compressed RGBA with 10x6 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_10x6_unorm_srgb.doc = """ASTC compressed RGBA with 10x6 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_10x8_unorm.doc = """ASTC compressed RGBA with 10x8 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_10x8_unorm_srgb.doc = """ASTC compressed RGBA with 10x8 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_10x10_unorm.doc = """ASTC compressed RGBA with 10x10 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_10x10_unorm_srgb.doc = """ASTC compressed RGBA with 10x10 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_12x10_unorm.doc = """ASTC compressed RGBA with 12x10 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_12x10_unorm_srgb.doc = """ASTC compressed RGBA with 12x10 blocks and sRGB encoding. Requires feature texture_compression_astc."""
fields.astc_12x12_unorm.doc = """ASTC compressed RGBA with 12x12 blocks, unsigned normalized. Requires feature texture_compression_astc."""
fields.astc_12x12_unorm_srgb.doc = """ASTC compressed RGBA with 12x12 blocks and sRGB encoding. Requires feature texture_compression_astc."""

[enums.AddressMode]
doc = """How a sampler handles texture coordinates outside the 0..1 range, per axis.

Used in the address_mode_u, address_mode_v and address_mode_w fields of structs.SamplerDescriptor.
"""
fields.clamp_to_edge.doc = """Coordinates are clamped to the range 0..1, so the edge texels are repeated."""
fields.repeat.doc = """The texture tiles: only the fractional part of the coordinate is used."""
fields.mirror_repeat.doc = """The texture tiles, but is mirrored every other repetition."""

[enums.FilterMode]
doc = """How a sampler filters texels when a texture is magnified or minified.

Used in the mag_filter and min_filter fields of structs.SamplerDescriptor.
"""
fields.nearest.doc = """Use the value of the nearest texel."""
fields.linear.doc = """Linearly interpolate between the nearest texels."""

[enums.MipmapFilterMode]
doc = """How a sampler filters between mip levels.

Used in the mipmap_filter field of structs.SamplerDescriptor.
"""
fields.nearest.doc = """Use the nearest mip level."""
fields.linear.doc = """Linearly interpolate between the two nearest mip levels."""

[enums.CompareFunction]
doc = """A comparison function, used for depth testing, stencil testing and comparison samplers.

The comparison is made as: new_value (the incoming fragment, or the sampled reference) compared to
the existing value. If the comparison is true, the test passes.
"""
fields.never.doc = """The comparison never passes."""
fields.less.doc = """Passes if the new value is less than the existing value."""
fields.equal.doc = """Passes if the new value is equal to the existing value."""
fields.less_equal.doc = """Passes if the new value is less than or equal to the existing value."""
fields.greater.doc = """Passes if the new value is greater than the existing value."""
fields.not_equal.doc = """Passes if the new value is not equal to the existing value."""
fields.greater_equal.doc = """Passes if the new value is greater than or equal to the existing value."""
fields.always.doc = """The comparison always passes."""

[enums.BufferBindingType]
doc = """The type of a buffer binding in a bind group layout.

Used in the type field of structs.BufferBindingLayout.
"""
fields.uniform.doc = """A uniform buffer: read-only, limited in size, and fast. Requires flags.BufferUsage.UNIFORM."""
fields.storage.doc = """A read-write storage buffer. Requires flags.BufferUsage.STORAGE."""
fields.read_only_storage.doc = """A read-only storage buffer. Requires flags.BufferUsage.STORAGE."""

[enums.SamplerBindingType]
doc = """The type of a sampler binding in a bind group layout.

Used in the type field of structs.SamplerBindingLayout.
"""
fields.filtering.doc = """A sampler that may filter (linear) texels. Can be used with textures of sample type float, but not unfilterable_float."""
fields.non_filtering.doc = """A sampler that only uses nearest filtering. Can be used with any float texture."""
fields.comparison.doc = """A comparison sampler, used for depth textures (see the compare field of structs.SamplerDescriptor)."""

[enums.TextureSampleType]
doc = """The type of values that is returned when sampling a texture in a shader.

Used in the sample_type field of structs.TextureBindingLayout.
"""
fields.float.doc = """Floating point values; the texture can be sampled with a filtering sampler."""
fields.unfilterable_float.doc = """Floating point values, but the texture cannot be filtered (e.g. 32-bit float without the float32_filterable feature)."""
fields.depth.doc = """Depth values, as returned from depth textures. Can be sampled as float, or with a comparison sampler."""
fields.sint.doc = """Signed integer values."""
fields.uint.doc = """Unsigned integer values."""

[enums.StorageTextureAccess]
doc = """How a storage texture can be accessed by a shader.

Used in the access field of structs.StorageTextureBindingLayout.
"""
fields.write_only.doc = """The shader can only write to the texture."""
fields.read_only.doc = """The shader can only read from the texture."""
fields.read_write.doc = """The shader can both read from and write to the texture."""

[enums.CompilationMessageType]
doc = """The severity of a GPUCompilationMessage.
"""
fields.error.doc = """An error; the shader module is invalid."""
fields.warning.doc = """A warning; the shader module is valid but something may be wrong."""
fields.info.doc = """An informational message."""

[enums.PipelineErrorReason]
doc = """The reason for a GPUPipelineError.

Available via the reason property of GPUPipelineError.
"""
fields.validation.doc = """The pipeline failed validation, e.g. because of an invalid descriptor or shader."""
fields.internal.doc = """An internal error occurred when creating the pipeline, e.g. the shader could not be compiled by the backend."""

[enums.AutoLayoutMode]
doc = """Indicates that a pipeline layout should be derived automatically from the shader code.

Used as the layout field of structs.ComputePipelineDescriptor and structs.RenderPipelineDescriptor.
The resulting bind group layouts can be retrieved with GPUPipelineBase.get_bind_group_layout().
"""
fields.auto.doc = """Derive the pipeline layout from the shader."""

[enums.PrimitiveTopology]
doc = """How vertices are assembled into primitives.

Used in the topology field of structs.PrimitiveState.
"""
fields.point_list.doc = """Each vertex defines a point."""
fields.line_list.doc = """Each pair of vertices defines a separate line."""
fields.line_strip.doc = """Each vertex after the first defines a line to the previous vertex."""
fields.triangle_list.doc = """Each triple of vertices defines a separate triangle."""
fields.triangle_strip.doc = """Each vertex after the first two defines a triangle with the previous two vertices."""

[enums.FrontFace]
doc = """Defines which winding order of a triangle is considered front-facing.

Used in the front_face field of structs.PrimitiveState.
"""
fields.ccw.doc = """Triangles with counter-clockwise vertices (in framebuffer space) are front-facing."""
fields.cw.doc = """Triangles with clockwise vertices (in framebuffer space) are front-facing."""

[enums.CullMode]
doc = """Defines which faces of triangles are culled (not drawn).

Used in the cull_mode field of structs.PrimitiveState.
"""
fields.none.doc = """No faces are culled."""
fields.front.doc = """Front-facing triangles are culled."""
fields.back.doc = """Back-facing triangles are culled."""

[enums.BlendFactor]
doc = """A factor that is multiplied with the source or destination color or alpha in blending.

Used in the src_factor and dst_factor fields of structs.BlendComponent. In the descriptions,
src is the output of the fragment shader and dst is the existing value in the render target.
"""
fields.zero.doc = """Factor 0."""
fields.one.doc = """Factor 1."""
fields.src.doc = """The source color, per component."""
fields.one_minus_src.doc = """One minus the source color, per component."""
fields.src_alpha.doc = """The source alpha."""
fields.one_minus_src_alpha.doc = """One minus the source alpha."""
fields.dst.doc = """The destination color, per component."""
fields.one_minus_dst.doc = """One minus the destination color, per component."""
fields.dst_alpha.doc = """The destination alpha."""
fields.one_minus_dst_alpha.doc = """One minus the destination alpha."""
fields.src_alpha_saturated.doc = """The minimum of the source alpha and one minus the destination alpha (for color), and 1 for alpha."""
fields.constant.doc = """The blend constant color, see GPURenderPassEncoder.set_blend_constant()."""
fields.one_minus_constant.doc = """One minus the blend constant color."""
fields.src1.doc = """The second source color output of the fragment shader. Requires feature dual_source_blending."""
fields.one_minus_src1.doc = """One minus the second source color. Requires feature dual_source_blending."""
fields.src1_alpha.doc = """The second source alpha. Requires feature dual_source_blending."""
fields.one_minus_src1_alpha.doc = """One minus the second source alpha. Requires feature dual_source_blending."""

[enums.BlendOperation]
doc = """The operation used to combine the scaled source and destination values in blending.

Used in the operation field of structs.BlendComponent.
"""
fields.add.doc = """Result is source plus destination."""
fields.subtract.doc = """Result is source minus destination."""
fields.reverse_subtract.doc = """Result is destination minus source."""
fields.min.doc = """Result is the minimum of source and destination (blend factors are ignored)."""
fields.max.doc = """Result is the maximum of source and destination (blend factors are ignored)."""

[enums.StencilOperation]
doc = """The operation performed on the stencil buffer value after a stencil or depth test.

Used in the fail_op, depth_fail_op and pass_op fields of structs.StencilFaceState.
"""
fields.keep.doc = """Keep the current stencil value."""
fields.zero.doc = """Set the stencil value to zero."""
fields.replace.doc = """Replace the stencil value with the stencil reference value, see GPURenderPassEncoder.set_stencil_reference()."""
fields.invert.doc = """Bitwise invert the current stencil value."""
fields.increment_clamp.doc = """Increment the stencil value, clamping to the maximum."""
fields.decrement_clamp.doc = """Decrement the stencil value, clamping to zero."""
fields.increment_wrap.doc = """Increment the stencil value, wrapping to zero on overflow."""
fields.decrement_wrap.doc = """Decrement the stencil value, wrapping to the maximum on underflow."""

[enums.IndexFormat]
doc = """The data type of the indices in an index buffer.

Used in the index_format argument of the GPURenderCommandsMixin.set_index_buffer() method
and the strip_index_format field of structs.PrimitiveState.
"""
fields.uint16.doc = """Indices are 16-bit unsigned integers."""
fields.uint32.doc = """Indices are 32-bit unsigned integers."""

[enums.VertexFormat]
doc = """The format of a vertex attribute in a vertex buffer.

Used in the format field of structs.VertexAttribute. The name consists of the component type and
bit size, optionally followed by xN for the number of components. The shader sees the data as
float (for unorm, snorm and float formats), i32 (for sint) or u32 (for uint), with the same number of components.
"""
fields.uint8.doc = """One 8-bit unsigned integer."""
fields.uint8x2.doc = """Two 8-bit unsigned integers."""
fields.uint8x4.doc = """Four 8-bit unsigned integers."""
fields.sint8.doc = """One 8-bit signed integer."""
fields.sint8x2.doc = """Two 8-bit signed integers."""
fields.sint8x4.doc = """Four 8-bit signed integers."""
fields.unorm8.doc = """One 8-bit unsigned normalized value (0..1)."""
fields.unorm8x2.doc = """Two 8-bit unsigned normalized values (0..1)."""
fields.unorm8x4.doc = """Four 8-bit unsigned normalized values (0..1)."""
fields.snorm8.doc = """One 8-bit signed normalized value (-1..1)."""
fields.snorm8x2.doc = """Two 8-bit signed normalized values (-1..1)."""
fields.snorm8x4.doc = """Four 8-bit signed normalized values (-1..1)."""
fields.uint16.doc = """One 16-bit unsigned integer."""
fields.uint16x2.doc = """Two 16-bit unsigned integers."""
fields.uint16x4.doc = """Four 16-bit unsigned integers."""
fields.sint16.doc = """One 16-bit signed integer."""
fields.sint16x2.doc = """Two 16-bit signed integers."""
fields.sint16x4.doc = """Four 16-bit signed integers."""
fields.unorm16.doc = """One 16-bit unsigned normalized value (0..1)."""
fields.unorm16x2.doc = """Two 16-bit unsigned normalized values (0..1)."""
fields.unorm16x4.doc = """Four 16-bit unsigned normalized values (0..1)."""
fields.snorm16.doc = """One 16-bit signed normalized value (-1..1)."""
fields.snorm16x2.doc = """Two 16-bit signed normalized values (-1..1)."""
fields.snorm16x4.doc = """Four 16-bit signed normalized values (-1..1)."""
fields.float16.doc = """One 16-bit float."""
fields.float16x2.doc = """Two 16-bit floats."""
fields.float16x4.doc = """Four 16-bit floats."""
fields.float32.doc = """One 32-bit float."""
fields.float32x2.doc = """Two 32-bit floats."""
fields.float32x3.doc = """Three 32-bit floats."""
fields.float32x4.doc = """Four 32-bit floats."""
fields.uint32.doc = """One 32-bit unsigned integer."""
fields.uint32x2.doc = """Two 32-bit unsigned integers."""
fields.uint32x3.doc = """Three 32-bit unsigned integers."""
fields.uint32x4.doc = """Four 32-bit unsigned integers."""
fields.sint32.doc = """One 32-bit signed integer."""
fields.sint32x2.doc = """Two 32-bit signed integers."""
fields.sint32x3.doc = """Three 32-bit signed integers."""
fields.sint32x4.doc = """Four 32-bit signed integers."""
fields.unorm10_10_10_2.doc = """A packed 32-bit value with three 10-bit and one 2-bit unsigned normalized components, presented as a vec4 of float."""
fields.unorm8x4_bgra.doc = """Four 8-bit unsigned normalized values stored in BGRA order, presented to the shader in RGBA order."""

[enums.VertexStepMode]
doc = """How often a vertex buffer is advanced.

Used in the step_mode field of structs.VertexBufferLayout.
"""
fields.vertex.doc = """The buffer is advanced for each vertex."""
fields.instance.doc = """The buffer is advanced for each instance."""

[enums.LoadOp]
doc = """What happens to the contents of an attachment at the start of a render pass.

Used in the load_op fields of structs.RenderPassColorAttachment and structs.RenderPassDepthStencilAttachment.
"""
fields.load.doc = """Keep the existing contents of the attachment."""
fields.clear.doc = """Clear the attachment to the clear value (e.g. the clear_value field of structs.RenderPassColorAttachment)."""

[enums.StoreOp]
doc = """What happens to the contents of an attachment at the end of a render pass.

Used in the store_op fields of structs.RenderPassColorAttachment and structs.RenderPassDepthStencilAttachment.
"""
fields.store.doc = """Store the results of the render pass in the attachment."""
fields.discard.doc = """Discard the results; the contents of the attachment become undefined (zero-initialized when next used)."""

[enums.QueryType]
doc = """The type of queries in a GPUQuerySet.

Used in the type field of structs.QuerySetDescriptor.
"""
fields.occlusion.doc = """Occlusion queries count the number of samples that pass the depth and stencil tests, see GPURenderPassEncoder.begin_occlusion_query()."""
fields.timestamp.doc = """Timestamp queries record GPU timestamps. Requires feature timestamp_query."""

[enums.CanvasAlphaMode]
doc = """How the alpha channel of a canvas texture is interpreted when compositing with the page or window.

Used in the alpha_mode field of structs.CanvasConfiguration.
"""
fields.opaque.doc = """The alpha channel is ignored and the canvas is treated as fully opaque."""
fields.premultiplied.doc = """The color channels are expected to be premultiplied by the alpha channel."""

[enums.CanvasToneMappingMode]
doc = """How the content of a canvas is tone mapped when displayed.

Used in the mode field of structs.CanvasToneMapping.
"""
fields.standard.doc = """Color values are clamped to the standard dynamic range (SDR) of the display."""
fields.extended.doc = """Color values may exceed the SDR range, up to the dynamic range of the display (HDR)."""

[enums.DeviceLostReason]
doc = """The reason a GPUDevice was lost.

Available via the reason property of GPUDeviceLostInfo.
"""
fields.unknown.doc = """The device was lost for a reason other than being destroyed, e.g. a driver crash or hardware removal."""
fields.destroyed.doc = """The device was lost because GPUDevice.destroy() was called."""

[enums.ErrorFilter]
doc = """The type of error that is captured by an error scope.

Used in the filter argument of the GPUDevice.push_error_scope() method.
"""
fields.validation.doc = """Captures GPUValidationError errors, which signal incorrect API usage."""
fields.out_of_memory.doc = """Captures GPUOutOfMemoryError errors, which signal that there was not enough memory for an operation."""
fields.internal.doc = """Captures GPUInternalError errors, which signal failures not caused by incorrect usage (e.g. implementation limits)."""

# --------------------------------------------------------------------------------
# --------------------------------------------------------------------------------
# --------------------------------------------------------------------------------
[structs]

[structs.RequestAdapterOptions]
doc = """Options for requesting an adapter.

Used as the options argument of the GPU.request_adapter() method.
"""
fields.feature_level.doc = """Requests an adapter that supports at least a particular set of capabilities.
This influences the {@link adapter#[[default feature level]]} of devices created
from this adapter. The capabilities for each level are defined below, and the exact
steps are defined in {@link GPU#requestAdapter} and "a new device".
If the implementation or system does not support all of the capabilities in the
requested feature level, {@link GPU#requestAdapter} will return `null`.
Note:
Applications should typically make a single {@link GPU#requestAdapter} call with the lowest
feature level they support, then inspect the adapter for additional capabilities they can
use optionally, and request those in {@link GPUAdapter#requestDevice}.
The allowed <dfn dfn for="">feature level string</dfn> values are:
<dl dfn-type=dfn dfn-for="feature level string">
: <dfn noexport>"core"</dfn>
The following set of capabilities:
- The limit/Default limits.
- {@link GPUFeatureName} `"core-features-and-limits"`.
Note:
Adapters with this {@link adapter#[[default feature level]]} may
conventionally be referred to as "Core-defaulting".
: <dfn noexport>"compatibility"</dfn>
The following set of capabilities:
- The limit/Compatibility Mode Default limits.
- No features. (It excludes the {@link GPUFeatureName} `"core-features-and-limits"` feature.)
If the implementation cannot enforce the stricter "Compatibility Mode"
validation rules, {@link GPU#requestAdapter} will ignore this request and
treat it as a request for feature level string/"core".
Note:
Adapters with this {@link adapter#[[default feature level]]} may
conventionally be referred to as "Compatibility-defaulting".
"""
fields.power_preference.doc = """Optionally provides a hint indicating what class of adapter should be selected from
the system's available adapters.
The value of this hint may influence which adapter is chosen, but it must not
influence whether an adapter is returned or not.
Note:
The primary utility of this hint is to influence which GPU is used in a multi-GPU system.
For instance, some laptops have a low-power integrated GPU and a high-performance
discrete GPU. This hint may also affect the power configuration of the selected GPU to
match the requested power preference.
Note:
Depending on the exact hardware configuration, such as battery status and attached displays
or removable GPUs, the user agent may select different adapters given the same power
preference.
Typically, given the same hardware configuration and state and
`powerPreference`, the user agent is likely to select the same adapter.
"""
fields.force_fallback_adapter.doc = """When set to `true` indicates that only a fallback adapter may be returned. If the user
agent does not support a fallback adapter, will cause {@link GPU#requestAdapter} to
resolve to `null`.
Note:
{@link GPU#requestAdapter} may still return a fallback adapter if
{@link GPURequestAdapterOptions#forceFallbackAdapter} is set to `false` and either no
other appropriate adapter is available or the user agent chooses to return a
fallback adapter. Developers that wish to prevent their applications from running on
fallback adapters should check the {@link GPUAdapter#info}.{@link GPUAdapterInfo#isFallbackAdapter}
attribute prior to requesting a {@link GPUDevice}.
"""
fields.xr_compatible.doc = """If true, the adapter must be compatible with XR (virtual/augmented reality) sessions. Mostly relevant in browsers."""

[structs.DeviceDescriptor]
doc = """Descriptor for requesting a device.

Used as the descriptor argument of the GPUAdapter.request_device() method.
"""
fields.label.doc = """A human-readable label for the device, used in debugging and error messages."""
fields.required_features.doc = """Specifies the features that are required by the device request.
The request will fail if the adapter cannot provide these features.
Exactly the specified set of features, and no more or less, will be allowed in validation
of API calls on the resulting device.
"""
fields.required_limits.doc = """Specifies the limits that are required by the device request.
The request will fail if the adapter cannot provide these limits.
Each key with a non-`undefined` value must be the name of a member of supported limits.
API calls on the resulting device perform validation according to the exact limits of the
device (not the adapter; see {@link https://www.w3.org/TR/webgpu/#limits}).
<!-- If we ever need limit types other than GPUSize32/GPUSize64, we can change the value
type to `double` or `any` in the future and write out the type conversion explicitly (by
reference to WebIDL spec). Or change the entire type to `any` and add back a `dictionary
GPULimits` and define the conversion of the whole object by reference to WebIDL. -->
"""
fields.default_queue.doc = """The descriptor for the default {@link GPUQueue}."""

[structs.BufferDescriptor]
doc = """Descriptor for creating a GPUBuffer.

Used as the descriptor argument of the GPUDevice.create_buffer() method.
"""
fields.label.doc = """A human-readable label for the buffer, used in debugging and error messages."""
fields.size.doc = """The size of the buffer in bytes."""
fields.usage.doc = """The allowed usages for the buffer."""
fields.mapped_at_creation.doc = """If `true` creates the buffer in an already mapped state, allowing
{@link GPUBuffer#getMappedRange} to be called immediately. It is valid to set
{@link GPUBufferDescriptor#mappedAtCreation} to `true` even if {@link GPUBufferDescriptor#usage}
does not contain {@link GPUBufferUsage#MAP_READ} or {@link GPUBufferUsage#MAP_WRITE}. This can be
used to set the buffer's initial data.
Guarantees that even if the buffer creation eventually fails, it will still appear as if the
mapped range can be written/read to until it is unmapped.
"""

[structs.TextureDescriptor]
doc = """Descriptor for creating a GPUTexture.

Used as the descriptor argument of the GPUDevice.create_texture() method.
"""
fields.label.doc = """A human-readable label for the texture, used in debugging and error messages."""
fields.size.doc = """The width, height, and depth or layer count of the texture."""
fields.mip_level_count.doc = """The number of mip levels the texture will contain."""
fields.sample_count.doc = """The sample count of the texture. A {@link GPUTextureDescriptor#sampleCount} &gt; `1` indicates
a multisampled texture.
"""
fields.dimension.doc = """Whether the texture is one-dimensional, an array of two-dimensional layers, or three-dimensional."""
fields.format.doc = """The format of the texture."""
fields.usage.doc = """The allowed usages for the texture."""
fields.view_formats.doc = """Specifies what view {@link GPUTextureViewDescriptor#format} values will be allowed when calling
{@link GPUTexture#createView} on this texture (in addition to the texture's actual
{@link GPUTextureDescriptor#format}).
<div class=note heading>
Adding a format to this list may have a significant performance impact, so it is best
to avoid adding formats unnecessarily.
The actual performance impact is highly dependent on the target system; developers must
test various systems to find out the impact on their particular application.
For example, on some systems any texture with a {@link GPUTextureDescriptor#format} or
{@link GPUTextureDescriptor#viewFormats} entry including
{@link GPUTextureFormat} `"rgba8unorm-srgb"` will perform less optimally than a
{@link GPUTextureFormat} `"rgba8unorm"` texture which does not.
Similar caveats exist for other formats and pairs of formats on other systems.
</div>
Formats in this list must be texture view format compatible with the texture format.
<div algorithm data-timeline=const>
Two {@link GPUTextureFormat}s `format` and `viewFormat` are <dfn dfn for="">texture view format compatible</dfn> on a given `device` if:
- `format` equals `viewFormat`, or
- `format` and `viewFormat` differ only in whether they are `srgb` formats (have the `-srgb` suffix) and `device.features` list/contains {@link GPUFeatureName} `"core-features-and-limits"`.
</div>
"""
fields.texture_binding_view_dimension.doc = """<div class=compatmode>
On devices without {@link GPUFeatureName} `"core-features-and-limits"`,
views created from this texture must have this as their {@link GPUTextureViewDescriptor#dimension}.
If not specified, a default is chosen.
</div>
On devices with {@link GPUFeatureName} `"core-features-and-limits"`,
this is ignored, and there is no such restriction.
"""

[structs.TextureViewDescriptor]
doc = """Descriptor for creating a GPUTextureView.

Used as the descriptor argument of the GPUTexture.create_view() method. Unspecified fields
get a default derived from the texture, so by default the view covers the whole texture.
"""
fields.label.doc = """A human-readable label for the texture view, used in debugging and error messages."""
fields.format.doc = """The format of the texture view. Must be either the {@link GPUTextureDescriptor#format} of the
texture or one of the {@link GPUTextureDescriptor#viewFormats} specified during its creation.
"""
fields.dimension.doc = """The dimension to view the texture as."""
fields.usage.doc = """The allowed {@link GPUTextureUsage | usage(s)} for the texture view. Must be a subset of the
{@link GPUTexture#usage} flags of the texture. If 0, defaults to the full set of
{@link GPUTexture#usage} flags of the texture.
Note: If the view's {@link GPUTextureViewDescriptor#format} doesn't support all of the
texture's {@link GPUTextureDescriptor#usage}s, the default will fail,
and the view's {@link GPUTextureViewDescriptor#usage} must be specified explicitly.
"""
fields.aspect.doc = """Which {@link GPUTextureAspect | aspect(s)} of the texture are accessible to the texture view."""
fields.base_mip_level.doc = """The first (most detailed) mipmap level accessible to the texture view."""
fields.mip_level_count.doc = """How many mipmap levels, starting with {@link GPUTextureViewDescriptor#baseMipLevel}, are accessible to
the texture view.
"""
fields.base_array_layer.doc = """The index of the first array layer accessible to the texture view."""
fields.array_layer_count.doc = """How many array layers, starting with {@link GPUTextureViewDescriptor#baseArrayLayer}, are accessible
to the texture view.
"""
fields.swizzle.doc = """A string of length four, with each character mapping to the texture view's red/green/blue/alpha
channels, respectively.
When accessed by a shader, the red/green/blue/alpha channels are replaced by the value
corresponding to the component specified in `swizzle[0]`, `swizzle[1]`, `swizzle[2]`, and
`swizzle[3]`, respectively:
- `"r"`: Take its value from the red channel of the texture.
- `"g"`: Take its value from the green channel of the texture.
- `"b"`: Take its value from the blue channel of the texture.
- `"a"`: Take its value from the alpha channel of the texture.
- `"0"`: Force its value to 0.
- `"1"`: Force its value to 1.
Requires the {@link GPUFeatureName} `"texture-component-swizzle"` feature to be enabled.
"""

[structs.ExternalTextureDescriptor]
doc = """Descriptor for importing an external texture, such as a video frame.

Used as the descriptor argument of the GPUDevice.import_external_texture() method.
"""
fields.label.doc = """A human-readable label for the external texture, used in debugging and error messages."""
fields.source.doc = """The video source to import the external texture from. Source size is determined as described
by the external source dimensions table.
"""
fields.color_space.doc = """The color space the image contents of {@link GPUExternalTextureDescriptor#source} will be
converted into when reading.
"""

[structs.SamplerDescriptor]
doc = """Descriptor for creating a GPUSampler.

Used as the descriptor argument of the GPUDevice.create_sampler() method.
"""
fields.label.doc = """A human-readable label for the sampler, used in debugging and error messages."""
fields.address_mode_u.doc = """How to handle texture coordinates outside 0..1 along the u (x) axis, see enums.AddressMode. Defaults to clamp_to_edge."""
fields.address_mode_v.doc = """How to handle texture coordinates outside 0..1 along the v (y) axis, see enums.AddressMode. Defaults to clamp_to_edge."""
fields.address_mode_w.doc = """Specifies the {@link GPUAddressMode | address modes} for the texture width, height, and depth
coordinates, respectively.
"""
fields.mag_filter.doc = """Specifies the sampling behavior when the sampled area is smaller than or equal to one
texel.
"""
fields.min_filter.doc = """Specifies the sampling behavior when the sampled area is larger than one texel."""
fields.mipmap_filter.doc = """Specifies behavior for sampling between mipmap levels."""
fields.lod_min_clamp.doc = """The minimum level of detail used when sampling. Defaults to 0."""
fields.lod_max_clamp.doc = """Specifies the minimum and maximum levels of detail, respectively, used internally when
sampling a texture.
"""
fields.compare.doc = """When provided the sampler will be a comparison sampler with the specified
{@link GPUCompareFunction}.
Note: Comparison samplers may use filtering, but the sampling results will be
implementation-dependent and may differ from the normal filtering rules.
"""
fields.max_anisotropy.doc = """Specifies the maximum anisotropy value clamp used by the sampler. Anisotropic filtering is
enabled when {@link GPUSamplerDescriptor#maxAnisotropy} is &gt; 1 and the implementation supports it.
Anisotropic filtering improves the image quality of textures sampled at oblique viewing
angles. Higher {@link GPUSamplerDescriptor#maxAnisotropy} values indicate the maximum ratio of
anisotropy supported when filtering.
<div class=note heading>
Most implementations support {@link GPUSamplerDescriptor#maxAnisotropy} values in range
between 1 and 16, inclusive. The used value of {@link GPUSamplerDescriptor#maxAnisotropy}
will be clamped to the maximum value that the platform supports.
The precise filtering behavior is implementation-dependent.
</div>
"""

[structs.BindGroupLayoutDescriptor]
doc = """Descriptor for creating a GPUBindGroupLayout.

Used as the descriptor argument of the GPUDevice.create_bind_group_layout() method.
"""
fields.label.doc = """A human-readable label for the bind group layout, used in debugging and error messages."""
fields.entries.doc = """A list of entries describing the shader resource bindings for a bind group."""

[structs.BindGroupLayoutEntry]
doc = """Describes a single binding in a bind group layout.

Exactly one of buffer, sampler, texture, storage_texture and external_texture must be set,
which determines the type of resource that is bound.
"""
fields.binding.doc = """A unique identifier for a resource binding within the {@link GPUBindGroupLayout}, corresponding
to a {@link GPUBindGroupEntry#binding | GPUBindGroupEntry.binding} and a @binding
attribute in the {@link GPUShaderModule}.
"""
fields.visibility.doc = """A bitset of the members of {@link GPUShaderStage}.
Each set bit indicates that a {@link GPUBindGroupLayoutEntry}'s resource
will be accessible from the associated shader stage.
"""
fields.buffer.doc = """If set, a structs.BufferBindingLayout: the entry is a buffer binding."""
fields.sampler.doc = """If set, a structs.SamplerBindingLayout: the entry is a sampler binding."""
fields.texture.doc = """If set, a structs.TextureBindingLayout: the entry is a sampled texture binding."""
fields.storage_texture.doc = """If set, a structs.StorageTextureBindingLayout: the entry is a storage texture binding."""

[structs.BufferBindingLayout]
doc = """Describes the layout of a buffer binding.

Used in the buffer field of structs.BindGroupLayoutEntry.
"""
fields.type.doc = """Indicates the type required for buffers bound to this binding."""
fields.has_dynamic_offset.doc = """Indicates whether this binding requires a dynamic offset."""
fields.min_binding_size.doc = """Indicates the minimum {@link GPUBufferBinding#size} of a buffer binding used with this bind point.
Bindings are always validated against this size in {@link GPUDevice#createBindGroup}.
If this *is not* `0`, pipeline creation additionally [$validating shader binding|validates$]
that this value &ge; the minimum buffer binding size of the variable.
If this *is* `0`, it is ignored by pipeline creation, and instead draw/dispatch commands
[$Validate encoder bind groups|validate$] that each binding in the {@link GPUBindGroup}
satisfies the minimum buffer binding size of the variable.
Note:
Similar execution-time validation is theoretically possible for other
binding-related fields specified for early validation, like
{@link GPUTextureBindingLayout#sampleType} and {@link GPUStorageTextureBindingLayout#format},
which currently can only be validated in pipeline creation.
However, such execution-time validation could be costly or unnecessarily complex, so it is
available only for {@link GPUBufferBindingLayout#minBindingSize} which is expected to have the
most ergonomic impact.
"""

[structs.SamplerBindingLayout]
doc = """Describes the layout of a sampler binding.

Used in the sampler field of structs.BindGroupLayoutEntry.
"""
fields.type.doc = """Indicates the required type of a sampler bound to this bindings."""

[structs.TextureBindingLayout]
doc = """Describes the layout of a sampled texture binding.

Used in the texture field of structs.BindGroupLayoutEntry.
"""
fields.sample_type.doc = """Indicates the type required for texture views bound to this binding."""
fields.view_dimension.doc = """Indicates the required {@link GPUTextureViewDescriptor#dimension} for texture views bound to
this binding.
"""
fields.multisampled.doc = """Indicates whether or not texture views bound to this binding must be multisampled."""

[structs.StorageTextureBindingLayout]
doc = """Describes the layout of a storage texture binding.

Used in the storage_texture field of structs.BindGroupLayoutEntry.
"""
fields.access.doc = """The access mode for this binding, indicating readability and writability."""
fields.format.doc = """The required {@link GPUTextureViewDescriptor#format} of texture views bound to this binding."""
fields.view_dimension.doc = """Indicates the required {@link GPUTextureViewDescriptor#dimension} for texture views bound to
this binding.
