fields.alpha.doc = """Defines the blending behavior of the corresponding render target for the alpha channel."""

[structs.BlendComponent]
doc = """Describes how the blending of a single component (color or alpha) is performed.

The result is: operation(src * src_factor, dst * dst_factor).
