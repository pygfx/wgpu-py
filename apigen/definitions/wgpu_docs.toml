fields.rows_per_image.doc = """Number of texel block rows per single texel image of the texture.
{@link GPUTexelCopyBufferLayout#rowsPerImage} &times;
{@link GPUTexelCopyBufferLayout#bytesPerRow} is the stride, in bytes, between the beginning of each
texel image of data and the subsequent texel image.
Required if there are multiple texel images (i.e. the copy depth is more than one).
"""

[structs.TexelCopyBufferInfo]
doc = """Describes a buffer and the layout of texel data in it.

Used as source or destination in GPUCommandEncoder.copy_buffer_to_texture() and GPUCommandEncoder.copy_texture_to_buffer().
Extends structs.TexelCopyBufferLayout.
"""
fields.offset.doc = """The offset in bytes into the buffer where the texel data starts. Defaults to 0."""
fields.bytes_per_row.doc = """The stride in bytes between rows of texels. Required if there is more than one row. Must be a multiple of 256."""
fields.rows_per_image.doc = """The number of rows per image (layer or slice). Required if there is more than one image."""
fields.buffer.doc = """A buffer which either contains texel data to be copied or will store the texel data being
copied, depending on the method it is being passed to.
