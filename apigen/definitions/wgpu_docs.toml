fields.entry_point.doc = """The name of the fragment entry point in the shader. Optional if the module has only one fragment entry point."""
fields.constants.doc = """A mapping of the names (or ids) of pipeline-overridable constants in the shader to the values to use."""
fields.targets.doc = """A list of {@link GPUColorTargetState} defining the formats and behaviors of the color targets
this pipeline writes to.
"""

[structs.ColorTargetState]
doc = """Describes a color render target of a render pipeline.

Used in the targets field of structs.FragmentState.
"""
