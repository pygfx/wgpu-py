The subresource is determined by calling [$get as texture view$]({@link GPURenderPassDepthStencilAttachment#view}).
"""
fields.depth_clear_value.doc = """Indicates the value to clear {@link GPURenderPassDepthStencilAttachment#view}'s depth component
to prior to executing the render pass. Ignored if {@link GPURenderPassDepthStencilAttachment#depthLoadOp}
is not {@link GPULoadOp} `"clear"`. Must be between 0.0 and 1.0, inclusive.
<!-- POSTV1(unrestricted-depth): unless unrestricted depth is enabled -->
"""
fields.depth_load_op.doc = """Indicates the load operation to perform on {@link GPURenderPassDepthStencilAttachment#view}'s
depth component prior to executing the render pass.
Note: It is recommended to prefer clearing; see {@link GPULoadOp} `"clear"` for details.
"""
fields.depth_store_op.doc = """The store operation to perform on {@link GPURenderPassDepthStencilAttachment#view}'s
depth component after executing the render pass.
"""
fields.depth_read_only.doc = """Indicates that the depth component of {@link GPURenderPassDepthStencilAttachment#view}
is read only.
"""
fields.stencil_clear_value.doc = """Indicates the value to clear {@link GPURenderPassDepthStencilAttachment#view}'s stencil component
to prior to executing the render pass. Ignored if {@link GPURenderPassDepthStencilAttachment#stencilLoadOp}
is not {@link GPULoadOp} `"clear"`.
The value will be converted to the type of the stencil aspect of `view` by taking the same
number of LSBs as the number of bits in the stencil aspect of one texel block|texel of `view`.
"""
fields.stencil_load_op.doc = """Indicates the load operation to perform on {@link GPURenderPassDepthStencilAttachment#view}'s
stencil component prior to executing the render pass.
Note: It is recommended to prefer clearing; see {@link GPULoadOp} `"clear"` for details.
"""
fields.stencil_store_op.doc = """The store operation to perform on {@link GPURenderPassDepthStencilAttachment#view}'s
stencil component after executing the render pass.
"""
fields.stencil_read_only.doc = """Indicates that the stencil component of {@link GPURenderPassDepthStencilAttachment#view}
is read only.
"""

[structs.RenderPassLayout]
doc = """Describes the attachment formats of a render pass or render bundle.

This is the base of structs.RenderBundleEncoderDescriptor. A render pipeline can only be used with
passes (or bundles) whose layout is compatible with the pipeline.
"""
fields.label.doc = """A human-readable label, used in debugging and error messages."""
fields.color_formats.doc = """A list of the {@link GPUTextureFormat}s of the color attachments for this pass or bundle."""
fields.depth_stencil_format.doc = """The {@link GPUTextureFormat} of the depth/stencil attachment for this pass or bundle."""
fields.sample_count.doc = """Number of samples per pixel in the attachments for this pass or bundle."""

[structs.RenderBundleDescriptor]
doc = """Descriptor for a GPURenderBundle.

Used as the descriptor argument of the GPURenderBundleEncoder.finish() method.
"""
fields.label.doc = """A human-readable label for the render bundle, used in debugging and error messages."""

[structs.RenderBundleEncoderDescriptor]
doc = """Descriptor for creating a GPURenderBundleEncoder.

Used as the descriptor argument of the GPUDevice.create_render_bundle_encoder() method.
Extends structs.RenderPassLayout.
"""
fields.label.doc = """A human-readable label for the render bundle encoder, used in debugging and error messages."""
fields.color_formats.doc = """A list of enums.TextureFormat (or None for unused slots) of the color attachments the bundle will be used with."""
fields.depth_stencil_format.doc = """The enums.TextureFormat of the depth-stencil attachment the bundle will be used with, if any."""
fields.sample_count.doc = """The number of samples per pixel of the attachments the bundle will be used with. Defaults to 1."""
fields.depth_read_only.doc = """If `true`, indicates that the render bundle does not modify the depth component of the
{@link GPURenderPassDepthStencilAttachment} of any render pass the render bundle is executed
in.
See read-only depth-stencil.
"""
fields.stencil_read_only.doc = """If `true`, indicates that the render bundle does not modify the stencil component of the
{@link GPURenderPassDepthStencilAttachment} of any render pass the render bundle is executed
in.
See read-only depth-stencil.
"""

[structs.QueueDescriptor]
doc = """Descriptor for a GPUQueue.

Used in the default_queue field of structs.DeviceDescriptor.
"""
fields.label.doc = """A human-readable label for the queue, used in debugging and error messages."""

[structs.QuerySetDescriptor]
doc = """Descriptor for creating a GPUQuerySet.

Used as the descriptor argument of the GPUDevice.create_query_set() method.
"""
fields.label.doc = """A human-readable label for the query set, used in debugging and error messages."""
fields.type.doc = """The type of queries managed by {@link GPUQuerySet}."""
fields.count.doc = """The number of queries managed by {@link GPUQuerySet}."""

[structs.CanvasToneMapping]
doc = """Describes the tone mapping of a canvas.

Used in the tone_mapping field of structs.CanvasConfiguration.
"""
fields.mode.doc = """The tone mapping mode, see enums.CanvasToneMappingMode. Defaults to standard."""

[structs.CanvasConfiguration]
doc = """Configuration for a GPUCanvasContext.

Used as the configuration argument of the GPUCanvasContext.configure() method.
"""
fields.device.doc = """The {@link GPUDevice} that textures returned by {@link GPUCanvasContext#getCurrentTexture} will be
compatible with.
"""
fields.format.doc = """The format that textures returned by {@link GPUCanvasContext#getCurrentTexture} will have.
Must be one of the Supported context formats.
"""
fields.usage.doc = """The usage that textures returned by {@link GPUCanvasContext#getCurrentTexture} will have.
{@link GPUTextureUsage#RENDER_ATTACHMENT} is the default, but is not automatically included
if the usage is explicitly set. Be sure to include {@link GPUTextureUsage#RENDER_ATTACHMENT}
when setting a custom usage if you wish to use textures returned by
{@link GPUCanvasContext#getCurrentTexture} as color targets for a render pass.
"""
fields.view_formats.doc = """The formats that views created from textures returned by
{@link GPUCanvasContext#getCurrentTexture} may use.
"""
fields.color_space.doc = """The color space that values written into textures returned by
{@link GPUCanvasContext#getCurrentTexture} should be displayed with.
"""
fields.tone_mapping.doc = """The tone mapping determines how the content of textures returned by
{@link GPUCanvasContext#getCurrentTexture} are to be displayed.
<div class=note heading>
This is a required feature, but user agents might not yet implement it,
effectively supporting only the default {@link GPUCanvasToneMapping}.
In such implementations, this member **should not** exist in its implementation of
{@link GPUCanvasConfiguration}, to make feature detection possible using
{@link GPUCanvasContext#getConfiguration}.
This is especially important in implementations which otherwise have HDR capabilities
(where a <l>'@media/dynamic-range'</l> of <l>''@media/dynamic-range/high''</l> would be
exposed).
If an implementation exposes this member and a `high` dynamic range, it **should** render the
canvas as an HDR element, not clamp values to the SDR range of the HDR display.
</div>
"""
fields.alpha_mode.doc = """Determines the effect that alpha values will have on the content of textures returned by
{@link GPUCanvasContext#getCurrentTexture} when read, displayed, or used as an image source.
"""

[structs.UncapturedErrorEventInit]
doc = """Initialization data for an uncaptured error event.

The event is passed to the callback set via the onuncapturederror property of GPUDevice.
"""
fields.error.doc = """The GPUError (GPUValidationError, GPUOutOfMemoryError or GPUInternalError) that was not captured by an error scope."""

[structs.Color]
doc = """An RGBA color with floating point components.

Can also be given as a tuple (r, g, b, a). Used e.g. in the clear_value field of structs.RenderPassColorAttachment.
"""
fields.r.doc = """The red component."""
fields.g.doc = """The green component."""
fields.b.doc = """The blue component."""
fields.a.doc = """The alpha component."""

[structs.Origin2D]
doc = """A 2D origin (offset) in a texture or image, in texels.

Can also be given as a tuple (x, y).
"""
fields.x.doc = """The x coordinate (horizontal). Defaults to 0."""
fields.y.doc = """The y coordinate (vertical). Defaults to 0."""

[structs.Origin3D]
doc = """A 3D origin (offset) in a texture, in texels.

Can also be given as a tuple (x, y, z).
"""
fields.x.doc = """The x coordinate (horizontal). Defaults to 0."""
fields.y.doc = """The y coordinate (vertical). Defaults to 0."""
fields.z.doc = """The z coordinate (depth, or array layer). Defaults to 0."""

[structs.Extent3D]
doc = """A 3D size (extent) of a texture, in texels.

Can also be given as a tuple (width, height, depth_or_array_layers).
"""
fields.width.doc = """The width of the extent."""
fields.height.doc = """The height of the extent. Defaults to 1."""
fields.depth_or_array_layers.doc = """The depth (for 3D textures) or the number of array layers (for other textures). Defaults to 1."""

# --------------------------------------------------------------------------------
