fields.depth_compare.doc = """The comparison operation used to test fragment depths against
{@link GPURenderPassDescriptor#depthStencilAttachment} depth values.
"""
fields.stencil_front.doc = """Defines how stencil comparisons and operations are performed for front-facing primitives."""
fields.stencil_back.doc = """Defines how stencil comparisons and operations are performed for back-facing primitives."""
fields.stencil_read_mask.doc = """Bitmask controlling which {@link GPURenderPassDescriptor#depthStencilAttachment} stencil value
bits are read when performing stencil comparison tests.
