fields.store_op.doc = """The store operation to perform on {@link GPURenderPassColorAttachment#view}
after executing the render pass.
"""

[structs.RenderPassDepthStencilAttachment]
doc = """Describes the depth-stencil attachment of a render pass.

Used in the depth_stencil_attachment field of structs.RenderPassDescriptor.
"""
