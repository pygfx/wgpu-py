[classes]

[classes.GPUObjectBase]
doc = """The base class of all GPU objects.

It provides the label property that is shared by all objects in the API.
"""
properties.label.doc = """A human-readable label for the object, used in debugging and error messages. Initially taken from the label field of the descriptor used to create it."""
[classes.GPUObjectBase.methods]

[classes.GPUAdapterInfo]
doc = """Information about a physical adapter (GPU).

An instance is available via the info property of GPUAdapter and the adapter_info property of GPUDevice.
The values are strings that are possibly empty if the information is not available.
"""
properties.vendor.doc = """The name of the vendor of the adapter, e.g. 'nvidia' or 'amd'."""
properties.architecture.doc = """The name of the family or class of GPUs the adapter belongs to."""
properties.device.doc = """A vendor-specific identifier of the adapter."""
properties.description.doc = """A human-readable description of the adapter, e.g. the name of the GPU."""
properties.subgroup_min_size.doc = """The minimum supported subgroup size of the adapter."""
properties.subgroup_max_size.doc = """The maximum supported subgroup size of the adapter."""
properties.is_fallback_adapter.doc = """Whether this is a fallback adapter, e.g. a software renderer."""
[classes.GPUAdapterInfo.methods]

[classes.GPU]
doc = """The entry point of the API.

It is used to request a GPUAdapter. In wgpu-py an instance is available as wgpu.gpu.
"""
properties.wgsl_language_features.doc = """The set of WGSL language features that are supported by the implementation."""
[classes.GPU.methods]
[classes.GPU.methods.request_adapter]
doc = """Requests an adapter from the user agent.
The user agent chooses whether to return an adapter, and, if so,
chooses according to the provided options.
"""
returns.doc = """A GPUAdapter, or None if no suitable adapter was found."""
args.options.doc = """Criteria used to select the adapter."""
[classes.GPU.methods.get_preferred_canvas_format]
doc = """Returns an optimal {@link GPUTextureFormat} for displaying 8-bit depth, standard dynamic range
content on this system. Must only return {@link GPUTextureFormat} `"rgba8unorm"` or
{@link GPUTextureFormat} `"bgra8unorm"`.
The returned value can be passed as the {@link GPUCanvasConfiguration#format} to
{@link GPUCanvasContext#configure} calls on a {@link GPUCanvasContext} to ensure the associated
canvas is able to display its contents efficiently.
Note: Canvases which are not displayed to the screen may or may not benefit from using this
format.
"""
returns.doc = """An enums.TextureFormat, either rgba8unorm or bgra8unorm."""

[classes.GPUAdapter]
doc = """Represents a physical GPU (or a software implementation of one).

An adapter can be used to inspect the capabilities of the GPU, and to request a GPUDevice,
which is used to do actual work. Adapters are obtained via GPU.request_adapter().
"""
properties.features.doc = """The set of enums.FeatureName that the adapter supports."""
properties.limits.doc = """A mapping of limit names to the maximum values supported by the adapter."""
properties.info.doc = """A GPUAdapterInfo with information about the adapter."""
[classes.GPUAdapter.methods]
[classes.GPUAdapter.methods.request_device]
doc = """Requests a device from the adapter.
This is a one-time action: if a device is returned successfully,
the adapter becomes {@link adapter#[[state]]#"consumed"}.
"""
returns.doc = """A GPUDevice."""
args.descriptor.doc = """Description of the {@link GPUDevice} to request."""

[classes.GPUDevice]
doc = """The main object that is used to create GPU resources and to submit work.

A device is requested from a GPUAdapter. It is a GPUObjectBase, and has a GPUQueue
(the queue property) which is used to submit work to the GPU. Most resources
(buffers, textures, pipelines, etc.) are created using the create_* methods of the device.
"""
properties.features.doc = """The set of enums.FeatureName that are enabled on the device."""
properties.limits.doc = """A mapping of limit names to the values that are in effect for the device."""
properties.adapter_info.doc = """A GPUAdapterInfo with information about the adapter that this device was created from."""
properties.queue.doc = """The default GPUQueue of the device."""
properties.lost.doc = """A promise or future that resolves to a GPUDeviceLostInfo when the device is lost."""
properties.onuncapturederror.doc = """A callback that is called with an event (see structs.UncapturedErrorEventInit) when an error occurs that is not captured by an error scope."""
[classes.GPUDevice.methods]
[classes.GPUDevice.methods.destroy]
doc = """Destroys the device, preventing further operations on it.
Outstanding asynchronous operations will fail.
Note: It is valid to destroy a device multiple times.
Note: Since no further operations can be enqueued on this device, implementations can abort
outstanding asynchronous operations immediately and free resource allocations, including
mapped memory that was just unmapped.
"""
returns.doc = """None."""
[classes.GPUDevice.methods.create_buffer]
doc = """Creates a {@link GPUBuffer}."""
returns.doc = """A GPUBuffer."""
args.descriptor.doc = """Description of the {@link GPUBuffer} to create."""
[classes.GPUDevice.methods.create_texture]
doc = """Creates a {@link GPUTexture}."""
returns.doc = """A GPUTexture."""
args.descriptor.doc = """Description of the {@link GPUTexture} to create."""
[classes.GPUDevice.methods.create_sampler]
doc = """Creates a {@link GPUSampler}."""
returns.doc = """A GPUSampler."""
args.descriptor.doc = """Description of the {@link GPUSampler} to create."""
[classes.GPUDevice.methods.create_bind_group_layout]
doc = """Creates a {@link GPUBindGroupLayout}."""
returns.doc = """A GPUBindGroupLayout."""
args.descriptor.doc = """Description of the {@link GPUBindGroupLayout} to create."""
[classes.GPUDevice.methods.create_pipeline_layout]
doc = """Creates a {@link GPUPipelineLayout}."""
returns.doc = """A GPUPipelineLayout."""
args.descriptor.doc = """Description of the {@link GPUPipelineLayout} to create."""
[classes.GPUDevice.methods.create_bind_group]
doc = """Creates a {@link GPUBindGroup}."""
returns.doc = """A GPUBindGroup."""
args.descriptor.doc = """Description of the {@link GPUBindGroup} to create."""
[classes.GPUDevice.methods.create_shader_module]
doc = """Creates a {@link GPUShaderModule}."""
returns.doc = """A GPUShaderModule."""
args.descriptor.doc = """Description of the {@link GPUShaderModule} to create."""
[classes.GPUDevice.methods.create_compute_pipeline]
doc = """Creates a {@link GPUComputePipeline} using immediate pipeline creation."""
returns.doc = """A GPUComputePipeline."""
args.descriptor.doc = """Description of the {@link GPUComputePipeline} to create."""
[classes.GPUDevice.methods.create_render_pipeline]
doc = """Creates a {@link GPURenderPipeline} using immediate pipeline creation."""
returns.doc = """A GPURenderPipeline."""
args.descriptor.doc = """Description of the {@link GPURenderPipeline} to create."""
[classes.GPUDevice.methods.create_compute_pipeline_async]
doc = """Creates a {@link GPUComputePipeline} using async pipeline creation.
The returned Promise resolves when the created pipeline
is ready to be used without additional delay.
If pipeline creation fails, the returned Promise rejects with an {@link GPUPipelineError}.
(A {@link GPUError} is not dispatched to the device.)
Note: Use of this method is preferred whenever possible, as it prevents blocking the
queue timeline work on pipeline compilation.
"""
returns.doc = """A GPUComputePipeline (awaitable)."""
args.descriptor.doc = """Description of the {@link GPUComputePipeline} to create."""
[classes.GPUDevice.methods.create_render_pipeline_async]
doc = """Creates a {@link GPURenderPipeline} using async pipeline creation.
The returned Promise resolves when the created pipeline
is ready to be used without additional delay.
If pipeline creation fails, the returned Promise rejects with an {@link GPUPipelineError}.
(A {@link GPUError} is not dispatched to the device.)
Note: Use of this method is preferred whenever possible, as it prevents blocking the
queue timeline work on pipeline compilation.
"""
returns.doc = """A GPURenderPipeline (awaitable)."""
args.descriptor.doc = """Description of the {@link GPURenderPipeline} to create."""
[classes.GPUDevice.methods.create_command_encoder]
doc = """Creates a {@link GPUCommandEncoder}."""
returns.doc = """A GPUCommandEncoder."""
args.descriptor.doc = """Description of the {@link GPUCommandEncoder} to create."""
[classes.GPUDevice.methods.create_render_bundle_encoder]
doc = """Creates a {@link GPURenderBundleEncoder}."""
returns.doc = """A GPURenderBundleEncoder."""
args.descriptor.doc = """Description of the {@link GPURenderBundleEncoder} to create."""
[classes.GPUDevice.methods.create_query_set]
doc = """Creates a {@link GPUQuerySet}."""
returns.doc = """A GPUQuerySet."""
args.descriptor.doc = """Description of the {@link GPUQuerySet} to create."""
[classes.GPUDevice.methods.push_error_scope]
doc = """Pushes a new GPU error scope onto the {@link GPUDevice}.`[[errorScopeStack]]` for `this`."""
returns.doc = """None."""
args.filter.doc = """Which class of errors this error scope observes."""
[classes.GPUDevice.methods.pop_error_scope]
doc = """Pops a GPU error scope off the {@link GPUDevice}.`[[errorScopeStack]]` for `this`
and resolves to **any** {@link GPUError} observed by the error scope, or `null` if none.
There is no guarantee of the ordering of promise resolution.
"""
returns.doc = """A GPUError (GPUValidationError, GPUOutOfMemoryError or GPUInternalError), or None if no error was captured."""

[classes.GPUBuffer]
doc = """A block of memory that can be used by the GPU for e.g. vertex data, uniform data or general storage.

Buffers are created with GPUDevice.create_buffer(). Data can be uploaded with GPUQueue.write_buffer() or
copy commands, or by mapping the buffer. Mapping makes the memory accessible to the CPU, but the
buffer cannot be used by the GPU while it is mapped.
"""
properties.size.doc = """The size of the buffer in bytes."""
properties.usage.doc = """The usage of the buffer, a combination of flags.BufferUsage."""
properties.map_state.doc = """The current mapping state of the buffer, see enums.BufferMapState."""
[classes.GPUBuffer.methods]
[classes.GPUBuffer.methods.map_async]
doc = """Maps the given range of the {@link GPUBuffer} and resolves the returned Promise when the
{@link GPUBuffer}'s content is ready to be accessed with {@link GPUBuffer#getMappedRange}.
The resolution of the returned Promise **only** indicates that the buffer has been mapped.
It does not guarantee the completion of any other operations visible to the content timeline,
and in particular does not imply that any other Promise returned from
{@link GPUQueue#onSubmittedWorkDone()} or {@link GPUBuffer#mapAsync} on other {@link GPUBuffer}s
have resolved.
The resolution of the Promise returned from {@link GPUQueue#onSubmittedWorkDone}
**does** imply the completion of
{@link GPUBuffer#mapAsync} calls made prior to that call,
on {@link GPUBuffer}s last used exclusively on that queue.
"""
returns.doc = """None (awaitable); resolves when the buffer is mapped."""
args.mode.doc = """Whether the buffer should be mapped for reading or writing."""
args.offset.doc = """Offset in bytes into the buffer to the start of the range to map."""
args.size.doc = """Size in bytes of the range to map."""
[classes.GPUBuffer.methods.get_mapped_range]
doc = """Returns an ArrayBuffer with the contents of the {@link GPUBuffer} in the given mapped range."""
returns.doc = """A writable memory view (e.g. a memoryview) on the mapped range."""
args.offset.doc = """Offset in bytes into the buffer to return buffer contents from."""
args.size.doc = """Size in bytes of the ArrayBuffer to return."""
[classes.GPUBuffer.methods.unmap]
doc = """Unmaps the mapped range of the {@link GPUBuffer} and makes its contents available for use by the
GPU again.
"""
returns.doc = """None."""
[classes.GPUBuffer.methods.destroy]
doc = """Destroys the {@link GPUBuffer}.
Note: It is valid to destroy a buffer multiple times.
Note: Since no further operations can be enqueued using this buffer, implementations can
free resource allocations, including mapped memory that was just unmapped.
"""
returns.doc = """None."""

[classes.GPUTexture]
doc = """An image resource of one, two or three dimensions, optionally with mip levels and array layers.

Textures are created with GPUDevice.create_texture(). To use a texture in a shader or as a render
attachment, create a GPUTextureView with create_view().
"""
properties.width.doc = """The width of the texture in texels."""
properties.height.doc = """The height of the texture in texels."""
properties.depth_or_array_layers.doc = """The depth (for 3D textures) or the number of array layers of the texture."""
properties.mip_level_count.doc = """The number of mip levels of the texture."""
properties.sample_count.doc = """The number of samples per pixel of the texture (1 unless multisampled)."""
properties.dimension.doc = """The dimensionality of the texture, see enums.TextureDimension."""
properties.format.doc = """The pixel format of the texture, see enums.TextureFormat."""
properties.usage.doc = """The allowed usages of the texture, a combination of flags.TextureUsage."""
properties.texture_binding_view_dimension.doc = """Compatibility mode only: the enums.TextureViewDimension that views of this texture can use for texture binding."""
[classes.GPUTexture.methods]
[classes.GPUTexture.methods.create_view]
doc = """Creates a {@link GPUTextureView}."""
returns.doc = """A GPUTextureView."""
args.descriptor.doc = """Description of the {@link GPUTextureView} to create."""
[classes.GPUTexture.methods.destroy]
doc = """Destroys the {@link GPUTexture}."""
returns.doc = """None."""

[classes.GPUTextureView]
doc = """A view on (a part of) a GPUTexture.

Texture views are created with GPUTexture.create_view(), and are used in bind groups (see structs.BindGroupEntry)
and as render pass attachments (see structs.RenderPassColorAttachment).
"""
[classes.GPUTextureView.methods]

[classes.GPUSampler]
doc = """Defines how a texture is sampled in a shader: the filtering and the handling of coordinates outside of the texture.

Samplers are created with GPUDevice.create_sampler().
"""
[classes.GPUSampler.methods]

[classes.GPUBindGroupLayout]
doc = """Describes the types of resources and their shader visibility for the bindings in a GPUBindGroup.

Bind group layouts are created with GPUDevice.create_bind_group_layout() or obtained from a pipeline
via GPUPipelineBase.get_bind_group_layout().
"""
[classes.GPUBindGroupLayout.methods]

[classes.GPUBindGroup]
doc = """A set of resources (buffers, samplers, texture views) bound together, following a GPUBindGroupLayout.

Bind groups are created with GPUDevice.create_bind_group() and activated with GPUBindingCommandsMixin.set_bind_group().
"""
[classes.GPUBindGroup.methods]

[classes.GPUPipelineLayout]
doc = """Describes the bind group layouts (and immediate data size) that a pipeline uses.

Pipeline layouts are created with GPUDevice.create_pipeline_layout(), or derived automatically using enums.AutoLayoutMode.auto.
"""
[classes.GPUPipelineLayout.methods]

[classes.GPUShaderModule]
doc = """A compiled piece of shader code (WGSL), containing one or more entry points.

Shader modules are created with GPUDevice.create_shader_module() and used in pipeline descriptors (see structs.ProgrammableStage).
"""
[classes.GPUShaderModule.methods]
[classes.GPUShaderModule.methods.get_compilation_info]
doc = """Returns any messages generated during the {@link GPUShaderModule}'s compilation.
The locations, order, and contents of messages are implementation-defined.
In particular, messages aren't necessarily ordered by {@link GPUCompilationMessage#lineNum}.
"""
returns.doc = """A GPUCompilationInfo (awaitable) with the list of messages."""

[classes.GPUCompilationMessage]
doc = """A single diagnostic message produced when compiling a shader module.

The messages are available via the messages property of GPUCompilationInfo.
"""
properties.message.doc = """The human-readable text of the message."""
properties.type.doc = """The severity of the message, see enums.CompilationMessageType."""
properties.line_num.doc = """The 1-based line number in the shader code that the message refers to, or 0 if it does not apply to a line."""
properties.line_pos.doc = """The 1-based position in the line (in UTF-16 code units) that the message refers to, or 0 if it does not apply to a position."""
properties.offset.doc = """The offset in the shader code (in UTF-16 code units) that the message refers to."""
properties.length.doc = """The length (in UTF-16 code units) of the span in the shader code that the message refers to."""
[classes.GPUCompilationMessage.methods]

[classes.GPUCompilationInfo]
doc = """The diagnostic messages produced when compiling a shader module.

Obtained from GPUShaderModule.get_compilation_info().
"""
properties.messages.doc = """A list of GPUCompilationMessage objects."""
[classes.GPUCompilationInfo.methods]

[classes.GPUPipelineError]
doc = """The error that is raised when asynchronous pipeline creation fails.

Raised by GPUDevice.create_compute_pipeline_async() and GPUDevice.create_render_pipeline_async().
"""
properties.reason.doc = """The reason for the failure, see enums.PipelineErrorReason."""
[classes.GPUPipelineError.methods]
[classes.GPUPipelineError.methods.constructor]
doc = """Create a GPUPipelineError.

Normally these are created by the implementation rather than by user code.
"""
returns.doc = """A GPUPipelineError."""
args.message.doc = """The human-readable error message."""
args.options.doc = """A structs.PipelineErrorInit with the reason of the error."""

[classes.GPUPipelineBase]
doc = """The base class for GPUComputePipeline and GPURenderPipeline.

It provides access to the bind group layouts of the pipeline.
"""
[classes.GPUPipelineBase.methods]
[classes.GPUPipelineBase.methods.get_bind_group_layout]
doc = """Gets a {@link GPUBindGroupLayout} that is compatible with the {@link GPUPipelineBase}'s
{@link GPUBindGroupLayout} at `index`.
"""
returns.doc = """A GPUBindGroupLayout."""
args.index.doc = """Index into the pipeline layout's {@link GPUPipelineLayout}.`[[bindGroupLayouts]]` sequence."""

[classes.GPUComputePipeline]
doc = """A pipeline that describes a compute shader and its resources.

Created with GPUDevice.create_compute_pipeline(). It is used in a compute pass with GPUComputePassEncoder.set_pipeline().
"""
[classes.GPUComputePipeline.methods]

[classes.GPURenderPipeline]
doc = """A pipeline that describes the complete graphics pipeline state: shaders, vertex layout, rasterization, depth/stencil and blending.

Created with GPUDevice.create_render_pipeline(). It is used in a render pass with GPURenderCommandsMixin.set_pipeline().
"""
[classes.GPURenderPipeline.methods]

[classes.GPUCommandBuffer]
doc = """A recorded list of GPU commands, ready to be submitted.

Obtained from GPUCommandEncoder.finish() and submitted with GPUQueue.submit(). A command buffer can only be submitted once.
"""
[classes.GPUCommandBuffer.methods]

[classes.GPUCommandsMixin]
doc = """A mixin class for objects that record commands: GPUCommandEncoder, GPUComputePassEncoder, GPURenderPassEncoder and GPURenderBundleEncoder.

It has no methods of its own in the current version of the API.
"""
[classes.GPUCommandsMixin.methods]

[classes.GPUCommandEncoder]
doc = """Records GPU commands (render passes, compute passes and copy operations) into a GPUCommandBuffer.

Create one with GPUDevice.create_command_encoder(). Call finish() to obtain the command buffer, and submit it with GPUQueue.submit().
Only one pass can be active at a time; end the pass (using the end() method of the pass encoder) before recording other commands.
"""
[classes.GPUCommandEncoder.methods]
[classes.GPUCommandEncoder.methods.begin_render_pass]
doc = """Begins encoding a render pass described by `descriptor`."""
returns.doc = """A GPURenderPassEncoder."""
args.descriptor.doc = """Description of the {@link GPURenderPassEncoder} to create."""
[classes.GPUCommandEncoder.methods.begin_compute_pass]
doc = """Begin a compute pass, returning a GPUComputePassEncoder to record dispatch commands with.

The pass must be ended with GPUComputePassEncoder.end() before the encoder can be used again.
"""
returns.doc = """A GPUComputePassEncoder."""
args.descriptor.doc = """A structs.ComputePassDescriptor. Optional."""
[classes.GPUCommandEncoder.methods.copy_buffer_to_buffer]
doc = """Encode a command into the {@link GPUCommandEncoder} that copies data from a sub-region of a
{@link GPUBuffer} to a sub-region of another {@link GPUBuffer}.
"""
returns.doc = """None."""
args.source.doc = """The {@link GPUBuffer} to copy from."""
args.source_offset.doc = """Offset in bytes into `source` to begin copying from."""
args.destination.doc = """The {@link GPUBuffer} to copy to."""
args.destination_offset.doc = """Offset in bytes into `destination` to place the copied data."""
args.size.doc = """Bytes to copy. Defaults to the size of the buffer `source` minus `sourceOffset`."""
[classes.GPUCommandEncoder.methods.copy_buffer_to_texture]
doc = """Encode a command into the {@link GPUCommandEncoder} that copies data from a sub-region of a
{@link GPUBuffer} to a sub-region of one or multiple continuous texture subresources.
"""
returns.doc = """None."""
args.source.doc = """Combined with `copySize`, defines the region of the source buffer."""
