fields.src_factor.doc = """Defines the {@link GPUBlendFactor} operation to be performed on values from the fragment shader."""
fields.dst_factor.doc = """Defines the {@link GPUBlendFactor} operation to be performed on values from the target attachment."""

[structs.DepthStencilState]
doc = """Describes the depth and stencil state of a render pipeline.

Used in the depth_stencil field of structs.RenderPipelineDescriptor.
